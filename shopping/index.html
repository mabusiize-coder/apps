<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="買い物メモ">
<title>買い物メモ</title>
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<style>
  html, body { margin: 0; height: 100%; background: #f2f2f7; font-family: -apple-system, sans-serif; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  .setup { padding: 48px 24px; max-width: 480px; margin: 0 auto; }
  .setup img { width: 72px; height: 72px; border-radius: 16px; }
  .setup input { width: 100%; box-sizing: border-box; font-size: 16px; padding: 12px; border: 1px solid #ccc; border-radius: 10px; }
  .setup button { margin-top: 12px; width: 100%; font-size: 17px; padding: 12px; border: 0; border-radius: 10px; background: #16A34A; color: #fff; }
  .setup p { color: #444; line-height: 1.6; }
</style>
</head>
<body>
<script>
// アプリのURL（?key= 付き）はこのページのURLの ?u= で受け取る。リポジトリにはキーを置かない
var u = new URLSearchParams(location.search).get('u') || '';
if (/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec/.test(u)) {
  var f = document.createElement('iframe');
  f.src = u;
  f.allow = 'clipboard-write';
  document.body.appendChild(f);
} else {
  document.body.innerHTML =
    '<div class="setup"><img src="icon.png" alt=""><h2>買い物メモ</h2>' +
    '<p>いつも開いているアプリのURL（?key= まで全部）を貼ってください。</p>' +
    '<input id="u" placeholder="https://script.google.com/macros/s/…/exec?key=…">' +
    '<button onclick="go()">開く</button>' +
    '<p>開いたら、共有 →「ホーム画面に追加」で置いてください。</p></div>';
}
function go() {
  var v = document.getElementById('u').value.trim();
  if (!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec/.test(v)) { alert('…/exec?key=… の形のアプリのURLを貼ってください'); return; }
  location.href = location.pathname + '?u=' + encodeURIComponent(v);
}
</script>
</body>
</html>

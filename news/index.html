<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="art/brief.png">
<title>朝のニュース</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=Noto+Sans+JP:wght@200;400;500;700;900&display=swap">
<style>
:root{
  color-scheme:light;
  --paper:#FFFFFF; --ink:#141414; --sub:#555; --faint:#999; --rule:#DCDCDC;
  --ic:#FFE03A;                                   /* その日のテーマカラー（JSで日替わり） */
  --ic-t:color-mix(in srgb,var(--ic) 28%,#fff);
  --ic-tt:color-mix(in srgb,var(--ic) 12%,#fff);
  --up:#D23B2F; --down:#1E4FD6;
  --f-en:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-jp:"Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN",system-ui,sans-serif;
  --gut:max(22px,env(safe-area-inset-left,0px));
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(60px + var(--sat))}
:root{--sat:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-jp);font-size:16px;line-height:2;letter-spacing:.04em;-webkit-font-smoothing:antialiased;padding-top:var(--sat);overflow-x:hidden}
[hidden]{display:none!important}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.in{max-width:660px;margin:0 auto;padding-left:var(--gut);padding-right:max(22px,env(safe-area-inset-right,0px))}
h1,h2,h3,.bp{word-break:auto-phrase}
p,.vp,.tx{overflow-wrap:anywhere}
.en{font-family:var(--f-en)}
.chip{display:inline-block;background:var(--ink);color:#fff;font:700 13px/1 var(--f-jp);letter-spacing:.06em;padding:7px 10px 6px}
.chip.ic{background:var(--ic);color:var(--ink)}
.pill{display:inline-block;border:2px solid var(--ink);border-radius:999px;padding:3px 14px 2px;font-weight:700}
.runhead{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--ink);padding:14px 0 8px;font:800 12px/1 var(--f-en);letter-spacing:.06em}
.runhead i{width:10px;height:10px;border:1.5px solid var(--ink);display:inline-block}
.folio{display:grid;grid-template-columns:56px minmax(0,1fr) auto;border:1px solid var(--ink);margin-top:28px;font:500 11px/1 var(--f-en);letter-spacing:.08em}
.folio>*{padding:11px 10px}
.folio>:nth-child(2){border-left:1px solid var(--ink);border-right:1px solid var(--ink);font-family:var(--f-jp);font-weight:700;letter-spacing:.14em}
.folio>:last-child{text-align:right;min-width:56px;white-space:nowrap}

/* ---------- cover ---------- */
.cover{background:var(--ic);padding-bottom:26px}
.cover .runhead{border-color:var(--ink)}
.cv-frame{margin-top:22px;background:#fff;border:2px solid var(--ink);aspect-ratio:10/7;overflow:hidden}
.cv-frame svg{display:block;width:100%;height:100%}
.cv-cap{font-size:10px;text-align:right;margin-top:4px;letter-spacing:.06em}
.cv-k{margin-top:18px;font-weight:700;font-size:13px;letter-spacing:.2em}
.cv-t{display:flex;align-items:center;flex-wrap:wrap;gap:10px 14px;margin:4px 0 0}
.cv-t h1{margin:0;font-weight:900;font-size:clamp(40px,12.4vw,64px);line-height:1.15;letter-spacing:.14em}
.cv-t .pill{font-size:clamp(18px,5vw,24px);letter-spacing:.06em;font-family:var(--f-en);font-weight:800}
.lede{margin:18px 0 0;font-weight:500;font-size:14.5px;line-height:1.95}
.mk{display:grid;grid-template-columns:1fr 1fr;margin-top:22px;border-top:1.5px solid var(--ink);border-left:1.5px solid var(--ink);background:#fff}
.mk>div{min-width:0;padding:10px 12px 12px;border-right:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink)}
.mk .l{font-size:11px;font-weight:700;line-height:1.4}
.mk .v{font:900 25px/1.2 var(--f-en);letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
.mk .c{font-size:11px;line-height:1.4;font-variant-numeric:tabular-nums}
.mk .c.up{color:var(--up)} .mk .c.down{color:var(--down)}

/* listen */
.lsn{margin-top:36px}
.lsn .box{display:flex;align-items:center;gap:14px;border:2px solid var(--ink);padding:12px 12px 12px 18px;position:relative;background:#fff}
.lsn .box::after{content:"";position:absolute;inset:6px -6px -6px 6px;background:var(--ic);z-index:-1;border:2px solid var(--ink)}
.lsn .lt{flex:1;min-width:0;line-height:1.5}
.lsn .lt b{display:block;font-size:15px;font-weight:900}
.lsn .lt span{font-size:12px;color:var(--sub)}
.go{flex:none;display:flex;align-items:center;gap:8px;background:var(--ink);color:#fff;border:0;border-radius:999px;padding:13px 20px;font:700 14px/1 var(--f-jp);letter-spacing:.1em;cursor:pointer}
.go svg{width:12px;height:12px}

/* contents */
.toc{margin-top:64px}
.toc .hd{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:10px}
.toc h2{margin:0;font:900 34px/1 var(--f-en);letter-spacing:-.02em}
.toc ol{list-style:none;margin:0;padding:0}
.toc li a{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;padding:16px 0;border-bottom:1px solid var(--rule);text-decoration:none}
.toc .no{font:900 30px/1 var(--f-en);color:transparent;-webkit-text-stroke:1.5px var(--ink);min-width:48px}
.toc .nm{font-weight:900;font-size:17px;line-height:1.4}
.toc .nm small{display:block;font:700 11px/1.6 var(--f-en);letter-spacing:.12em;text-transform:uppercase;color:var(--sub)}
.toc .ct{font-size:12px;font-weight:700}
.favbtn{margin-top:16px;background:#fff;border:1.5px solid var(--ink);border-radius:999px;padding:8px 16px;font:700 13px/1 var(--f-jp);cursor:pointer}
.favbtn[aria-pressed=true]{background:var(--ink);color:#fff}

/* sticky nav */
.navslot{margin-top:64px;min-height:47px}
.nav{z-index:20;background:#fff;border-bottom:1.5px solid var(--ink)}
.nav.fix{position:fixed;top:0;left:0;right:0;padding-top:var(--sat)}
.nav .in{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-block:9px}
.nav .in::-webkit-scrollbar{display:none}
.nav a{flex:none;text-decoration:none;font:700 12px/1 var(--f-jp);letter-spacing:.06em;padding:8px 12px 7px;border:1.5px solid var(--ink);border-radius:999px}
.nav a.on{background:var(--ic)}
.prog{height:3px;background:var(--ic);width:0;transition:width .15s linear;margin-bottom:-1.5px}

/* ---------- common article parts ---------- */
.ch{padding-top:72px}
.sechead{display:flex;justify-content:flex-end;align-items:stretch;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);padding:10px 0;gap:0}
.sechead .lede2{flex:1;font-size:12px;font-weight:700;line-height:1.7;padding-right:10px}
.sechead .t{display:flex;align-items:flex-start}
.sechead .t span{font:700 12px/1 var(--f-jp);padding:6px 8px 5px;border:1px solid var(--ink)}
.sechead .t span:first-child{background:var(--ic)}
.sechead .t span+span{border-left:0;font-weight:500}
.art{padding-top:48px}
.art h3{margin:10px 0 0;font-weight:900;font-size:clamp(21px,5.8vw,25px);line-height:1.55;letter-spacing:.02em}
.art p{margin:16px 0 0;font-size:15.5px;line-height:2.05}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grp{font-size:12px;font-weight:700;letter-spacing:.08em}
.grp::before{content:"#";color:var(--sub);margin-right:2px}
.tag{display:inline-block;font:800 10px/1 var(--f-en);letter-spacing:.12em;padding:5px 8px 4px;border-radius:99px;vertical-align:4px;margin-left:8px;white-space:nowrap}
.tag.fav{background:var(--ic);border:1.5px solid var(--ink);color:var(--ink)}
.tag.barca{background:#A50044;color:#fff}
.srcs{margin-top:16px;font-size:11.5px;line-height:1.9;color:var(--sub)}
.srcs b{font:800 10px/1 var(--f-en);letter-spacing:.14em;border:1px solid var(--sub);padding:3px 5px 2px;margin-right:8px}
.srcs a{margin-right:10px;text-underline-offset:3px}
.speaking{position:relative}
.speaking::after{content:"♪ NOW READING";position:absolute;right:max(22px,env(safe-area-inset-right,0px));top:20px;font:800 10px/1 var(--f-en);letter-spacing:.12em;background:var(--ic);border:1.5px solid var(--ink);padding:5px 8px 4px}

/* figures */
.fig{margin:28px 0 0;border:1.5px solid var(--ink);padding:16px 16px 14px;background:#fff}
.fig .fl{display:inline-block;transform:translateY(-27px);margin-bottom:-22px;background:var(--ink);color:#fff;font:800 10px/1 var(--f-en);letter-spacing:.14em;padding:5px 8px 4px}
.fig .ft{font-weight:900;font-size:15px;line-height:1.6}
.fig .fn{font-size:11px;color:var(--sub);margin-top:12px;line-height:1.7}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;margin-top:12px}
.stats>div{background:var(--ic-t);padding:12px 12px 11px;min-width:0}
.stats .sv{font:800 32px/1.1 var(--f-en);letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
.stats .sv.up{color:var(--up)} .stats .sv.down{color:var(--down)}
.stats .sl{font-size:11.5px;line-height:1.6;margin-top:6px;font-weight:500}
.bars{margin-top:12px;display:grid;gap:9px}
.bar{display:grid;grid-template-columns:6.5em minmax(0,1fr);align-items:center;gap:10px;font-size:12.5px;line-height:1.4;font-weight:500}
.bar .track{display:flex;align-items:center;gap:8px;min-width:0}
.bar .fill{height:14px;background:#fff;border:1.5px solid var(--ink);flex:none}
.bar.hi .fill{background:var(--ic)}
.bar .bv{font:800 12.5px/1 var(--f-en);white-space:nowrap}
.tl{list-style:none;margin:12px 0 0;padding:0 0 0 14px;border-left:2px dotted var(--ink)}
.tl li{position:relative;padding:6px 0 10px;font-size:13.5px;line-height:1.7}
.tl li::before{content:"";position:absolute;left:-21px;top:12px;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--ink)}
.tl li.hi::before{background:var(--ic)}
.tl .td{display:block;font:800 12px/1.6 var(--f-en)}
.tl li.hi .tx{font-weight:700}

/* two views */
.vw{margin-top:30px;position:relative;border:1.5px solid var(--ink);padding:24px 16px 16px;background:var(--ic-tt)}
.vw .lb{position:absolute;top:-14px;left:12px;transform:rotate(-3deg)}
.vw .vq{font-weight:900;font-size:16px;line-height:1.7}
.vc{margin-top:14px;background:#fff;border:1px solid var(--ink);padding:12px 14px}
.vc .vs{font-weight:900;font-size:13.5px;display:flex;gap:8px;align-items:center}
.vc .vs::before{content:"A";font:900 11px/18px var(--f-en);width:20px;height:20px;text-align:center;border-radius:50%;background:var(--ink);color:#fff;flex:none}
.vc.v1 .vs::before{content:"B";background:var(--ic);color:var(--ink);border:1.5px solid var(--ink);line-height:16px}
.vc .vp{margin:8px 0 0;font-size:13.5px;line-height:1.9}
.vc .vwho{margin-top:8px;font-size:11.5px;font-weight:700;line-height:1.6}
.vc .va{display:inline-block;font-size:11px;color:var(--sub);text-underline-offset:3px}

/* ---------- STYLE: label (WELL-MADE風) ---------- */
.s-label .opn{position:relative;margin-top:30px}
.s-label .tilt{transform:rotate(-4deg);display:inline-block;font:800 18px/1 var(--f-en);letter-spacing:.04em;padding:10px 16px 9px;position:relative;z-index:2;margin-left:-4px}
.s-label .box{background:var(--ic);border:2px solid var(--ink);padding:26px 20px 18px;margin-top:-12px}
.s-label .box h2{overflow:hidden;margin:0;font:900 clamp(40px,12.5vw,60px)/.98 var(--f-en);letter-spacing:-.02em;text-transform:uppercase}
.s-label .box .jp{margin-top:14px;font-weight:700;font-size:13px}
.s-label .cred{border:5px solid var(--ink);padding:10px 14px;margin-top:10px;font:700 12px/1.8 var(--f-en);letter-spacing:.02em}
.s-label .ill{margin-top:22px;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);aspect-ratio:10/6;overflow:hidden;background:var(--ic-tt)}
.s-label .ill svg{display:block;width:100%;height:100%}
.s-label .art.lead p:first-of-type::first-letter{float:left;font-weight:200;font-size:4.3em;line-height:.95;margin:8px 12px 0 -2px;padding:0 2px;background:linear-gradient(transparent 68%,var(--ic) 68%)}
.s-label .art h3{border-bottom:1px solid var(--ink);padding-bottom:10px}
.s-label .art:not(.lead) h3{font-size:19px;border:0;padding:0}
.s-label .art:not(.lead){border-left:3px solid var(--ink);padding-left:14px;margin-left:var(--gut);padding-top:0;margin-top:44px}
@media (min-width:704px){.s-label .art:not(.lead){margin-left:auto;margin-right:auto;max-width:616px}}

/* ---------- STYLE: map（相関図） ---------- */
.s-map .opn h2{margin:22px 0 0;font-weight:900;font-size:clamp(30px,9vw,42px);line-height:1.3;letter-spacing:.06em}
.s-map .opn .sub{font-weight:700;font-size:13px;margin-top:8px}
.map{position:relative;margin-top:22px;background-color:var(--ic-t);background-image:radial-gradient(color-mix(in srgb,var(--ink) 22%,transparent) .8px,transparent 1px);background-size:5px 5px;border:1px solid var(--ink);padding:26px 14px 30px}
.map svg.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.map .node{position:relative;display:block;width:78%;text-decoration:none;margin-top:30px}
.map .node:first-of-type{margin-top:0}
.map .node.r{margin-left:auto}
.map .node .chip{position:relative;z-index:1}
.map .node .nb{display:block;background:#fff;border:1.5px solid var(--ink);padding:10px 12px 10px;margin-top:-3px;font-weight:900;font-size:14.5px;line-height:1.55}
.map .node .nb small{display:block;font-weight:500;font-size:11px;line-height:1.6;color:var(--sub);margin-top:4px}
.map .key{position:absolute;right:12px;bottom:-14px}
.s-map .art .no{display:inline-grid;place-items:center;width:30px;height:30px;background:var(--ink);color:#fff;font:900 13px/1 var(--f-en)}

/* ---------- STYLE: outline（白抜き英字） ---------- */
.s-outline .opn .big{display:flex;align-items:center;gap:10px;margin-top:26px}
.s-outline .opn .big h2{overflow:hidden;min-width:0;padding:0 2px 4px;margin:0;font:900 clamp(54px,17vw,92px)/1 var(--f-en);letter-spacing:-.01em;color:transparent;-webkit-text-stroke:1.5px var(--ink);flex:0 1 auto}
.s-outline .opn .big i{flex:1 0 24px;height:1px;background:var(--ink)}
.s-outline .opn .bp{margin-top:12px;background:var(--ic-t);border:1px solid var(--ink);padding:10px 14px;font-weight:900;font-size:15px;text-align:center}
.s-outline .ill{margin-top:22px;aspect-ratio:10/6;overflow:hidden;background:var(--ic-tt);border:1px solid var(--ink)}
.s-outline .ill svg{display:block;width:100%;height:100%}
.s-outline .art .num{display:flex;align-items:center;gap:10px}
.s-outline .art .num b{font:900 52px/1 var(--f-en);color:transparent;-webkit-text-stroke:1.2px var(--ink);flex:none}
.s-outline .art .num i{flex:1;height:1px;background:var(--ink)}
.s-outline .art h3{background:var(--ic-t);border:1px solid var(--ink);padding:10px 14px;font-size:18px;margin-top:10px}
.s-outline .art.lead h3{font-size:22px}

/* ---------- STYLE: cards（グリッド） ---------- */
.s-cards .opn .hl{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:22px;flex-wrap:wrap}
.s-cards .opn h2{margin:0;font-weight:900;font-size:clamp(28px,8.4vw,40px);line-height:1.35;letter-spacing:.04em}
.s-cards .opn h2 em{font-style:normal;background:linear-gradient(transparent 58%,var(--ic) 58%)}
.s-cards .grid{display:grid;grid-template-columns:1fr;gap:0;margin-top:22px;border-top:1px solid var(--ink)}
.s-cards .art{min-width:0;padding:22px 0 26px;border-bottom:1px solid var(--ink)}
.s-cards .art .th{display:grid;grid-template-columns:38% minmax(0,1fr);gap:14px;align-items:start}
.s-cards .art .th .pic{border:1px solid var(--ink);aspect-ratio:4/3;overflow:hidden;background:var(--ic-tt)}
.s-cards .art .th .pic svg{display:block;width:100%;height:100%}
.s-cards .art h3{overflow-wrap:anywhere;margin:0;font-size:16.5px;line-height:1.6}
.s-cards .art.lead h3{font-size:21px}
.s-cards .art .th .meta{margin-top:6px}
.s-cards .art p{font-size:14px;line-height:1.95;margin-top:12px}
.s-cards .art.lead p{font-size:15.5px}

/* ---------- 特集 ---------- */
.ftr{margin-top:72px}
.ftr .hero{background:var(--ic);border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);padding:22px 0 30px;position:relative;overflow:hidden}
.ftr .hero .bg{position:absolute;right:-12px;bottom:-34px;font:900 clamp(120px,40vw,220px)/1 var(--f-en);letter-spacing:-.04em;color:transparent;-webkit-text-stroke:1.5px color-mix(in srgb,var(--ink) 28%,transparent);pointer-events:none;white-space:nowrap}
.ftr .hero .in{position:relative}
.ftr .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ftr .kick{font-weight:700;font-size:13px;line-height:1.8;margin-top:18px}
.ftr h2{margin:6px 0 0;font-weight:900;font-size:clamp(28px,8.2vw,44px);line-height:1.4;letter-spacing:.03em;word-break:auto-phrase}
.ftr .ld{margin:16px 0 0;font-size:15px;font-weight:500;line-height:2}
.ftr .facts{margin:28px 0 0;border:1.5px solid var(--ink)}
.ftr .facts>div{display:grid;grid-template-columns:6.5em minmax(0,1fr);border-top:1px solid var(--ink);font-size:13px;line-height:1.7}
.ftr .facts>div:first-child{border-top:0}
.ftr .facts dt{background:var(--ic-t);padding:8px 10px;font-weight:700;border-right:1px solid var(--ink)}
.ftr .facts dd{margin:0;padding:8px 12px;overflow-wrap:anywhere}
.ftr .pts{margin:30px 0 0;border:1.5px solid var(--ink);padding:22px 16px 10px;position:relative;background:var(--ic-tt)}
.ftr .pts .lb{position:absolute;top:-14px;left:12px;transform:rotate(-3deg)}
.ftr .pts ol{list-style:none;margin:0;padding:0;counter-reset:p}
.ftr .pts li{counter-increment:p;display:grid;grid-template-columns:34px minmax(0,1fr);gap:8px;padding:8px 0;border-top:1px dotted var(--ink);font-weight:700;font-size:14.5px;line-height:1.8}
.ftr .pts li:first-child{border-top:0}
.ftr .pts li::before{content:counter(p);font:900 26px/1.2 var(--f-en);color:transparent;-webkit-text-stroke:1.2px var(--ink)}
.ftr .blk{margin-top:44px}
.ftr .blk .n{display:flex;align-items:center;gap:10px;font:800 12px/1 var(--f-en);letter-spacing:.14em}
.ftr .blk .n i{flex:1;height:1px;background:var(--ink)}
.ftr .blk h3{margin:10px 0 0;font-weight:900;font-size:clamp(20px,5.6vw,24px);line-height:1.6;word-break:auto-phrase}
.ftr .blk h3 span{background:linear-gradient(transparent 62%,var(--ic) 62%)}
.ftr .blk p{margin:12px 0 0;font-size:15.5px;line-height:2.05}
.ftr .qt{margin:40px 0 0;border-left:6px solid var(--ic);padding:4px 0 4px 16px}
.ftr .qt p{margin:0;font-weight:200;font-size:clamp(20px,5.6vw,26px);line-height:1.75}
.ftr .qt cite{display:block;font-style:normal;font-size:12px;font-weight:700;margin-top:8px}
.ftr .its{margin:36px 0 0}
.ftr .its .hd{display:flex;align-items:center;gap:10px;font:800 12px/1 var(--f-en);letter-spacing:.14em;margin-bottom:14px}
.ftr .its .hd i{flex:1;height:1px;background:var(--ink)}
.lk{display:block;color:var(--ink);text-decoration:none;border:1.5px solid var(--ink);background:#fff;margin-top:12px;-webkit-tap-highlight-color:transparent}
.lk:active{background:var(--ic-tt)}
.lk .ph{display:block;background:var(--ic-tt);overflow:hidden;position:relative}
.lk .ph img{display:block;width:100%;height:100%;object-fit:cover}

ive、NVIDIA"}, "debate": {"q": "辞めさせて12日で呼び戻す判断は、取締役会の失敗か、株主を守る現実的な選択か", "views": [{"side": "統治の失敗だとする見方", "point": "説明が誠実でないとして辞めさせたのに、同じ事実のまま、調査も終わらないうちに呼び戻したと批判する。投資家や政府の圧力に負けた「人質に取られた取締役会」だという。判断を翻した取締役は身を引くべきで、調査が終わるまで休職させる道もあったと主張する。", "who": "ジェフリー・ソネンフェルド（米イェール大学経営大学院教授）", "src": ["Fortune", "https://fortune.com/2026/11/23/nvidia-board-reinstates-jensen-huang-twelve-days-sonnenfeld/"]}, {"side": "現実的な判断だとする見方", "point": "市場の反応を見れば、取締役会は株主への責任を果たしたという。フアン氏には報酬の削減のような形だけの処分が科され、調査もそのぶん穏やかになるだろうとみる。議会がどれだけ追及しても、トップを欠いたときのような1兆〜2兆ドル規模の打撃にはならない、という考え方だ。", "who": "ジェシー・フリード（米ハーバード大学ロースクール教授、企業統治）", "src": ["Fortune", "https://fortune.com/2026/11/23/corporate-governance-experts-divided-nvidia-decision-rehire-jensen-huang/"]}]}}, {"group": "AI・テクノロジー", "title": "スペースXのAIデータセンター計画、740億ドル　「電気代はだれが払うのか」", "body": "スペースXは今月12日、アリゾナ州とテキサス州にAI用の巨大な計算施設を建てると発表した。総額は740億ドルを超える。アリゾナ州コチース郡の施設は約500億ドルだ。完成すれば、約6000メガワットの電気を使う。州の大手電力会社APSが今夏に記録した最大需要の、3分の2近い量になる。会社は、地元の電気代も税金も下がると約束している。けれど州の司法長官は19日、電力や水、火災への備えを調べ終えるまで、12月9日の郡の採決を延ばすよう求めた。テキサス州では郡の委員会が、10年間の固定資産税の全額免除に向けた協議を、3対2で退けた。11月の中間選挙では、データセンター開発をめぐる地元の投票で、集計を終えた38件のうち37件で反対側が勝ったという。AIの電力をだれが負担するのか。その問いが、地方の議場で形をとりはじめている。", "terms": [{"w": "APS", "d": "アリゾナ・パブリック・サービス。アリゾナ州で約150万の家庭や企業に電気を送る電力会社。"}, {"w": "メガワット", "d": "電力の大きさを表す単位。1メガワットは100万ワット。"}], "src": [["Fortune", "https://fortune.com/2026/11/22/spacex-74-billion-ai-data-centers-texas-arizona-who-pays/"]], "viz": {"type": "stats", "title": "スペースXのAI施設計画の数字", "items": [{"value": "740億ドル超", "label": "アリゾナとテキサスの総投資額"}, {"value": "約6,000MW", "label": "アリゾナ施設の電力（完成時）", "dir": "up"}, {"value": "37／38", "label": "中間選挙の地元投票で、データセンター反対側が勝った数"}], "note": "出典：Fortune（Reuters、KJZZなどの報道を引用）"}}]}, {"id": "football", "name": "海外サッカー", "items": [{"title": "ケイン、左足首の靱帯断裂で数か月離脱　ドルトムントが首位に", "body": "バイエルンのハリー・ケインが、20日のケルン戦で左足首をいためた。相手DFのヨエル・シュミートと接触し、2人のトレーナーの手当てを受けて退いた。クラブは、左足首の靱帯結合が切れていて、この先数か月は出られないと発表した。試合は1対1の引き分けだった。ケインは33歳で、2029年6月までの契約延長を結んだばかりだった。翌21日、ドルトムントは敵地でボルシアMGを1対0で破った。80分、相手GKバッツのミスから、フェリックス・ヌメチャが決めた。ドルトムントは勝ち点24になり、バイエルンを2点上回って首位に立った。エースのギラシーは、太ももの負傷で欠場していた。ドルトムントは24日、CLでアーセナルと戦う。", "terms": [{"w": "靱帯結合", "d": "すねの2本の骨（脛骨と腓骨）を、足首の近くでつないでいる靱帯。痛めると長引きやすい。"}], "src": [["FOX Sports（AP）", "https://www.foxsports.com/stories/soccer/england-captain-harry-kane-expected-miss-a-few-months-left-ankle-injury"], ["ZDFheute", "https://www.zdfheute.de/sport/fussball-bundesliga/bundesliga-10-spieltag-borussia-moenchengladbach-borussia-dortmund-100.html"]]}]}, {"id": "art", "name": "アート", "viz": {"type": "timeline", "title": "国内アート、これからの日程", "items": [{"date": "11/20", "text": "MAFIN 2026が開幕（宮島・大聖院）"}, {"date": "11/21", "text": "Roof Park Art Fes 2026が開幕（旧KK線）"}, {"date": "11/28", "text": "瀬戸内サーカスファクトリーの公演（29日まで）"}, {"date": "11/29", "text": "Roof Park Art Fes 最終日", "hi": true}, {"date": "12/13", "text": "MAFIN 2026 最終日"}], "note": "出典：Tokyo Art Beat、美術手帖"}, "items": [{"group": "国内", "title": "旧KK線の高架の上で、夜だけの芸術祭　YOSHIROTTENの光とイーノの音", "body": "東京の京橋、銀座、新橋を結んでいた旧東京高速道路、KK線の上で「Roof Park Art Fes 2026」が開かれている。会期は21日から29日まで。ふだんは入れない場所を、夜だけ開けている。道路の役目を終えた高架を、人が歩ける緑の広場に変える「Roof Park Project」の一つだ。都の芸術祭ARTE TOKYOの目玉企画でもある。中心になるのはYOSHIROTTENだ。テーマは、この道がもとは汐留川という川だったこと。長さ約40メートルのオレンジ色に光る物体や、星の軌道を光にした彫刻が並ぶ。365個の「太陽」でできた空間には、中に入って歩ける。会場にはブライアン・イーノの音楽が流れる。28日と29日には、瀬戸内サーカスファクトリーの現代サーカスもある。", "terms": [{"w": "KK線", "d": "東京高速道路の通称。京橋、銀座、新橋を結ぶ高架の道路で、道路としての役目を終えた。"}], "src": [["Tokyo Art Beat", "https://www.tokyoartbeat.com/articles/-/roof-park-art-fes-news-202611"]]}, {"group": "国内", "title": "宮島で芸術祭「MAFIN 2026」　Chim↑Pomが三つの火を並べる", "body": "広島・宮島の大聖院で、芸術祭「MAFIN 2026」が20日に始まった。2回目で、会期は12月13日まで。時間は10時から17時で、入場は無料だ。テーマは「時の目」。参加は4組と小さい。Chim↑Pom from Smappa!Groupは、3本のろうそくを並べた。弥山の「消えずの火」、原爆の残り火を受け継ぐ「平和の火」、そして由来のないふつうの火だ。見ただけでは、どれがどれだかわからない。今年5月に焼けた弥山の霊火堂の、焦げた木も使っている。金沢寿美は、約10年分の新聞を鉛筆で黒く塗った「新聞紙のドローイング」を、約100枚つないだ。ほかに、ベラルーシ生まれのイェラシェビッチ・イリヤと、広島出身の彫刻家・久保寛子が出品している。", "terms": [{"w": "霊火堂", "d": "宮島の弥山にあるお堂で、「消えずの火」を守ってきた。2026年5月20日に焼けたが、火そのものは残った。"}], "src": [["美術手帖", "https://bijutsutecho.com/magazine/news/report/33366"]]}]}, {"id": "film", "name": "映画", "items": [{"title": "原田マハの初監督作『無用の人』、東京フィルメックスで開幕上映", "body": "小説家の原田マハが初めて監督した長編『無用の人』が、21日、第27回東京フィルメックスのオープニングで上映された。自分の短編小説がもとで、脚本も自分で書いた。主演は蒼井優で、美術館の監視員の聡美を演じる。作品はサン・セバスティアン国際映画祭のコンペティションに出て、国際批評家連盟賞とアテネオ・ギプスコアノ賞を受けている。舞台あいさつで原田さんは、蒼井さんの俳優としての力にほれぼれした、と話した。上映時間は109分。全国公開は2027年1月29日だ。", "src": [["映画.com", "https://eiga.com/news/20261122/3/"], ["映画.com（作品ページ）", "https://eiga.com/movie/103577/"]]}, {"title": "押井守がはじめて撮った『ボトムズ』　劇場版『灰色の魔女』が公開", "fav": true, "body": "押井守監督のアニメ映画『装甲騎兵ボトムズ 灰色の魔女（ヘクセ）』が、20日に劇場で公開された。押井監督がボトムズを手がけるのは、これが初めてだ。原作と監修は、シリーズを生んだ髙橋良輔。100年続いた戦争の終わりが舞台になる。いつも生き残るので「魔女」と呼ばれる兵士アッシュ・ヴァンプスを、マキ・シュタウフェンベルクが調べていく。声は沢城みゆきと安藤麻吹。上映時間は100分で、2部構成の前編にあたる。押井監督は、まじめに戦争に向き合って作ったと話している。後編の公開日はまだ出ていない。", "src": [["映画.com", "https://eiga.com/news/20261122/11/"], ["アニメハック（映画.com）", "https://anime.eiga.com/news/127899/"]]}]}, {"id": "science", "name": "科学", "items": [{"title": "太陽の12〜16倍のブラックホールが見当たらない　爆発せずに崩れた星のしるしか", "body": "重力波でとらえたブラックホールの合体257件を調べたら、重さの分布に妙なすき間があった。米カリフォルニア工科大学などのチームが、Physical Review D誌に発表した。使ったのは、LIGO、Virgo、KAGRAの観測網が、この10年ほどで見つけた合体のデータだ。全体の約4分の3で、太陽の約10倍の重さのブラックホールが見つかった。一方で、12〜16倍のものはほとんどない。こうしたすき間が見つかったのは初めてだという。10倍前後のものは、回る速さもせまい範囲にそろっていた。チームは、重い星が超新星爆発を起こさず、そのまま崩れてできた仲間ではないかと考えている。ただ、この結果は「爆発しなかった超新星」を直接たしかめたものではない。そうした星の実例は、まだ一つも確認されていない。", "terms": [{"w": "重力波", "d": "ブラックホールの合体のような激しい天体現象で生まれ、時空のゆがみが波として伝わるもの。2015年に初めて直接とらえられた。"}, {"w": "超新星爆発", "d": "重い星が一生の最後に起こす大爆発。その後に中性子星やブラックホールが残る。"}, {"w": "KAGRA", "d": "岐阜県の神岡の地下にある、日本の重力波望遠鏡。"}], "src": [["ScienceDaily（Caltech発表）", "https://www.sciencedaily.com/releases/2026/11/261121221126.htm"], ["Physical Review D（論文）", "http://dx.doi.org/10.1103/mnzq-w1b5"]]}]}], "cover": {"svg": "<rect width=\"400\" height=\"280\" fill=\"#F4EFE6\"/>\n<rect x=\"0\" y=\"196\" width=\"400\" height=\"84\" fill=\"{C}\"/><path d=\"M0 196h400\" stroke=\"#141414\" stroke-width=\"3\"/>\n<circle cx=\"300\" cy=\"92\" r=\"58\" fill=\"#141414\"/>\n<path d=\"M300 22a70 70 0 1 1-70 70\" fill=\"none\" stroke=\"#F4C744\" stroke-width=\"5\" stroke-linecap=\"round\"/>\n<path d=\"M300 8a84 84 0 0 1 84 84\" fill=\"none\" stroke=\"#C9C2B6\" stroke-width=\"3\" stroke-linecap=\"round\"/>\n<circle cx=\"300\" cy=\"92\" r=\"16\" fill=\"#F4EFE6\" stroke=\"#141414\" stroke-width=\"3\"/>\n<g stroke=\"#141414\" stroke-width=\"3\" stroke-linejoin=\"round\">\n<rect x=\"70\" y=\"120\" width=\"76\" height=\"76\" fill=\"#A9CBEA\"/>\n<rect x=\"88\" y=\"138\" width=\"40\" height=\"40\" fill=\"#FFFFFF\"/>\n<\/g>\n<path d=\"M82 120v-12M100 120v-12M118 120v-12M134 120v-12M82 196v12M100 196v12M118 196v12M134 196v12M70 134h-12M70 158h-12M70 182h-12M146 134h12M146 158h12M146 182h12\" stroke=\"#141414\" stroke-width=\"4\" stroke-linecap=\"round\"/>\n<path d=\"M40 66q30-44 70-34t60 40\" fill=\"none\" stroke=\"#141414\" stroke-width=\"4\" stroke-dasharray=\"4 8\" stroke-linecap=\"round\"/>\n<path d=\"M166 58l6 18-18 2\" fill=\"none\" stroke=\"#141414\" stroke-width=\"4\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\n<path d=\"M30 50l22 10-10 22z\" fill=\"#F2A27E\" stroke=\"#141414\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<circle cx=\"236\" cy=\"236\" r=\"22\" fill=\"#FFFFFF\" stroke=\"#141414\" stroke-width=\"3\"/>\n<path d=\"M236 226l9 7-3 10h-12l-3-10z\" fill=\"#141414\"/>\n<path d=\"M300 222h56v28h-56z\" fill=\"#FFFFFF\" stroke=\"#141414\" stroke-width=\"3\"/>\n<path d=\"M300 236h56M318 222v28M338 222v28\" stroke=\"#F2A27E\" stroke-width=\"4\"/>\n<path d=\"M40 238h60M60 254h70\" stroke=\"#FFFFFF\" stroke-width=\"3\" stroke-linecap=\"round\"/>", "motif": "戻ってくる半導体、すき間のある黒い星、包帯とボール"}, "features": [{"topic": "ai", "label": "AI", "kicker": "AIは、自分を迷わせた言葉を知らない。", "title": "関係ない一語にAIは振り回され、本人は「関係ない」と言う。その一語を消すと正答率が8.9ポイント上がった", "lead": "算数の問題を解くAIに、文中のある一語を消したら答えは変わるかと聞いてみる。AIは「変わらない」と答える。でも実際に消してみると、答えが変わる。しかもその一語は、たいてい問題とは関係のない言葉だった。メルボルン大学などのチームが11月20日にarXivに出したプレプリント（査読前の論文）を読んでみる。", "facts": [{"k": "論文", "v": "Do Language Models Know Which Words Steer Their Reasoning?"}, {"k": "著者", "v": "Yanbei Jiang、Chao Lei、Jey Han Lau、Krista A. Ehinger ほか（メルボルン大学）"}, {"k": "公開", "v": "2026年11月20日　arXiv（査読前）"}, {"k": "調べたAI", "v": "Qwen-3.5（4B・9B）、Gemma-3（12B・27B）の4つ"}, {"k": "試験", "v": "GSM8K（算数の文章題）、TruthfulQA、MMLU など5種類"}], "pointsLabel": "ここが面白い", "points": ["答えを左右した一語について、AI本人は「関係ない」と言う。この食い違いが、Qwenでは単語単位で31〜80%の割合で起きた", "人が確かめると、AIが「関係ない」とした一語の87%は、本当に考えるうえで余計な言葉だった", "その一語をAIの記憶から消して解き直すと、算数の文章題で正答率が72.3%から81.2%に上がった"], "blocks": [{"h": "一語ずつ消して、答えの揺れを見る", "body": "やり方は地道だ。問題文から単語を一つだけ抜いて、AIの次の一語の予想がどれだけ変わるかを測る。それを全部の単語で繰り返す。抜くと一番手の答えがひっくり返る単語を、著者たちは「ピボット語」と呼んでいる。ピボットは、回転の軸になる点のことだ。\nそのうえで、同じAIに聞く。「この単語を消したら、あなたの答えは変わりますか」。AIはイエスかノーで答える。測ってみると答えを大きく動かしているのに、AI自身は「動かない」と言う。このずれに、著者たちは「幻の文脈の影響（PCI）」という名前をつけた。"}, {"h": "食い違いは、思ったよりずっと多い", "body": "結果はなかなか派手だった。単語単位で見ると、食い違いの割合はQwenで31.3〜79.7%、Gemmaで10.7〜46.4%。回答全体で見ても9.1〜68.0%あった。どの組み合わせでも、QwenのほうがGemmaより高かった。\nでは、その一語は本当に余計なのか。人が確かめている。Qwen-3.5-4Bが「関係ない」と言ったピボット語を150個選び、人に判定してもらった。87%は、考える手順にとって余計な言葉だった。つまりAIは、どうでもいい言葉に引っぱられ、しかも引っぱられたことに気づいていない。道ばたの看板につられて曲がり角を間違え、「看板なんて見ていない」と言う人に、少し似ている。"}, {"h": "消してみたら、算数の点が上がった", "body": "では、その一語をなかったことにしたらどうなるか。著者たちは「オンラインKV抑制」という方法を試した。AIは読んだ文章を、KVキャッシュという作業用のメモに置きながら考える。そのメモから、影響が一番大きくて、しかもAIが「関係ない」と言った一語の分だけを消す。そして解き直させる。\n算数の文章題GSM8Kで、Qwen-3.5-4Bの正答率は72.3%から81.2%になった。8.9ポイントの上昇だ。4つのモデルの平均でも、1.1〜3.9ポイント上がった。AIの重みには手を入れていない。読み方を少し変えただけである。"}, {"h": "大事なのは「本人に聞く」ひと手間", "body": "面白いのは、影響の大きい言葉をただ消すだけでは駄目だったことだ。AIに確かめずに一番影響の大きい語を消すと、同じ問題の正答率は44.2%まで落ちた。影響が大きい語の多くは、解くのに本当に必要な言葉だからだ。\nつまり、測った影響と、AI自身の「関係ない」という判断。この2つが重なったところにだけ、余計な一語がいる。AIの自己申告はあてにならない。けれど、まるで役に立たないわけでもない。そのあたりの加減が、この研究のいちばん人間くさいところだと思う。"}, {"h": "割り引いて読む点", "body": "割り引いて読むべきところもある。まず査読前の論文で、試したのは中くらいの大きさの公開モデル4つだけだ。人による確認も、1つのモデルの150語にとどまる。食い違いの割合は、どこから「影響あり」とみなすかの線の引き方でも変わる、と著者たち自身が書いている。\nそれに、メモから一語を消しても、その影響は完全には消えない。ほかの言葉にすでに染みこんでいるからだ。上がった点数は「その語に影響があった」しるしではあるけれど、「その語は不要だった」という証明ではない。AIの「考えの中身」を本人に説明させる研究は多い。その説明をどこまで信じていいのか。この論文は、そこに一つ小さな目盛りを足したのだと思う。"}], "quote": {"text": "言語モデルは、どの単語が自分の推論を動かしているのかを、ほとんど知らない（訳）", "who": "論文の要旨より"}, "terms": [{"w": "プレプリント", "d": "専門家による審査（査読）を受ける前に公開される論文。速く共有できる一方、内容はまだ確かめられていない。"}, {"w": "GSM8K", "d": "小学校レベルの算数の文章題を集めた試験用のデータ。AIの計算と推論の力を測るのによく使われる。"}, {"w": "KVキャッシュ", "d": "AIが読んだ文章の情報を、次の言葉を出すときに使えるよう一時的にためておく仕組み。"}, {"w": "Qwen", "d": "中国のアリババが公開している大規模言語モデルのシリーズ。"}, {"w": "Gemma", "d": "グーグルが公開している、誰でも使える大規模言語モデルのシリーズ。"}], "src": [["arXiv（論文の概要）", "https://arxiv.org/abs/2611.27317"], ["arXiv（論文本文）", "https://arxiv.org/html/2611.27317v1"]]}, {"topic": "film", "label": "映画", "kicker": "消したはずの記憶に、会ったことのない幼なじみ。", "title": "北村匠海×出口夏希『君の話』、27日公開。三秋縋の小説を『虎に翼』の吉田恵里香が脚本に", "lead": "つらい過去の記憶を消す治療を受けた。目が覚めると、記憶は消えていない。そのうえ、会ったこともない幼なじみの思い出が、なぜか頭の中にある。そしてある日、その子が本当に目の前に現れる。中川龍太郎監督の『君の話』が、11月27日に公開される。", "facts": [{"k": "監督", "v": "中川龍太郎"}, {"k": "脚本・原作", "v": "脚本：吉田恵里香／原作：三秋縋『君の話』（2018年。ハヤカワ文庫）"}, {"k": "出演", "v": "北村匠海、出口夏希、佐野晶哉、宮﨑優、原田泰造"}, {"k": "公開", "v": "2026年11月27日（金）　配給：松竹"}, {"k": "上映時間", "v": "120分（映画.com）。主題歌はMrs. GREEN APPLE「本と彗星」"}], "pointsLabel": "ここが見どころ", "points": ["記憶を消す治療のはずが、ありもしない思い出が残る。その思い出の相手が、現実に会いにくる", "脚本は朝ドラ『虎に翼』の吉田恵里香。原作の三秋縋は「映画で初めて自分の話に出会える」と話す", "監督と北村匠海は、10年以上前から一緒に作りたいと話していた仲。今年の東京国際映画祭でも上映された"], "blocks": [{"h": "どんな話か", "body": "主人公は大学生の天谷千尋。北村匠海が演じる。友だちの少ない、さびしい青年だ。彼は、つらい過去の記憶を消す治療を受ける。ところが目覚めても、記憶はちゃんと残っている。おまけに、知らない思い出まで増えている。夏凪灯花という幼なじみとの、初恋の記憶だ。\nもちろん、千尋は灯花に会ったことがない。作られた記憶の中にしかいない子のはずだ。それなのに、彼女のことが頭から離れない。そこへ、灯花本人が現れる。演じるのは出口夏希。二人が分け合う思い出は、本物なのか、作り物なのか。宣伝では「純愛ミステリー」と呼ばれている。"}, {"h": "書く人と撮る人", "body": "原作は三秋縋が2018年に出した小説だ。脚本は吉田恵里香。NHKの朝ドラ『虎に翼』や、ドラマ『恋せぬふたり』を書いた人である。恋愛を、少し外れた角度から描くのがうまい人だと思う。\n監督の中川龍太郎は『四月の永い夢』『やがて海へと届く』を撮ってきた。どちらも、いなくなった人や過ぎた時間を、静かに見つめる映画だった。記憶と喪失は、この監督がずっと手放さない題材なのだろう。今回の話は、そこへまっすぐ重なる。"}, {"h": "現場の声", "body": "中川監督によると、北村さんとは10年以上前から一緒に作りたいと話していたそうだ。二人とも「演出オタク」なのだという。北村さんは現場を、カメラの前に立つ監督のように引っぱっていた、とも話している。\n北村さんのほうは、また制服を着ることを心配していたらしい。けれど撮影初日、二人の場面を見た監督の目の輝きで、信じられたという。出口さんは、これまで恋愛ものでは高校生の役ばかりだったので、大人の役が楽しみだったと話す。泣く場面の多い役だったが、明るさを失わなかったと監督は言う。"}, {"h": "原作者が楽しみにしていること", "body": "原作者の三秋縋のコメントが、ちょっと面白い。作家は自分の本を、まっさらな気持ちでは読めないのだという。開いたとたんに、反省会が始まってしまうからだ。\nだから映画になると、自分の話に新しい角度から出会える。三秋さんは「映画で初めて『君の話』を体験する」ような気がしている、と話している。記憶を書きかえる話の原作者が、自分の記憶ごと物語を見直すことになる。なんだか、作品の中身と少し響き合っている。"}, {"h": "こんな人におすすめ", "body": "キラキラした恋愛映画を想像していると、たぶん少し違う。映画.comに載った観客の感想にも、浅い恋愛ものかと思ったら、生きることや記憶とは何かまで描いていた、とあった。ただ、これは一人の感想で、批評家の評価はまだ出そろっていない。\n『エターナル・サンシャイン』のように、記憶をいじる話が好きな人。中川監督の、静かで少しさびしい画面が好きな人。そういう人には合うと思う。主題歌はMrs. GREEN APPLEの新曲「本と彗星」。上映時間は120分で、映画.comの表示ではG（だれでも見られる）だ。"}], "quote": {"text": "映画で、初めて『君の話』を体験するような気がしている（要約）", "who": "原作者・三秋縋"}, "terms": [{"w": "三秋縋", "d": "小説家。記憶や孤独をテーマにした恋愛小説で知られ、『君の話』は2018年に刊行された。"}, {"w": "吉田恵里香", "d": "脚本家。NHK連続テレビ小説『虎に翼』やドラマ『恋せぬふたり』の脚本を書いた。"}, {"w": "中川龍太郎", "d": "映画監督。『四月の永い夢』『やがて海へと届く』などを撮っている。"}], "src": [["映画.com（作品ページ）", "https://eiga.com/movie/106579/"], ["リアルサウンド", "https://realsound.jp/movie/2026/07/post-2474001.html"], ["ORICON NEWS", "https://www.oricon.co.jp/news/2470684/full/"], ["ジョルダン映画", "https://movie.jorudan.co.jp/film/103232/"]]}, {"topic": "fashion", "label": "ファッション", "kicker": "冬のニットは、さわって選ぶ。", "title": "UOMOの「ニット番付」で大賞のエンカミング。チャコールのカシミヤVネックを、アウターの中に", "lead": "ニットは写真だと、どれも同じに見える。だからUOMOの試着フェスでは、スタイリストとデザイナーが10着を実際にさわって番付をつけた。デザイナーの西野大士さんが総合1位に選んだのは、4万円台のカシミヤのVネック。今日はこの1枚を軸に、冬のきれいめを組んでみる。", "facts": [{"k": "出発点", "v": "UOMO「触ればわかる！ニット番付」（2026年11月22日）"}, {"k": "主役", "v": "ENCOMING カシミヤ100%のVネック（チャコールグレー）　¥48,400"}, {"k": "方向", "v": "きれいめカジュアル。細身のニット×太めのパンツ×外遊びのアウター"}, {"k": "合計", "v": "約23万6,000円（4点）"}], "pointsLabel": "ここがポイント", "points": ["ニットは小さめ。西野さんいわく「ニットはもともとかさばるから、大きいのは着ない」", "浅いVネックのカシミヤは、きちんとしているのに、年寄りくさく見えない", "アウターは外遊びの形を、ジャーナル スタンダードの別注で大人っぽく"], "blocks": [{"h": "10着を、さわって比べた", "body": "UOMOの企画はこうだ。スタイリストの片貝俊さんと、デザイナーの西野大士さんが、今季のニット10着を着比べる。ユニクロの3,990円から、ピケアの9万6,800円まで。デザイン、コスパ、手ざわりなどの部門ごとに、それぞれが賞を決めた。\n二人の答えはけっこう割れた。片貝さんの個人大賞は、内モンゴルのベビーカシミヤを使うPICEA。西野さんの大賞はENCOMINGだった。値段、素材、デザイン、サイズのつり合いがいちばん取れている、というのが理由だ。今日はこちらを選んだ。"}, {"h": "エンカミングという新しい名前", "body": "ENCOMING（エンカミング）は、翔太さんがまだ挙げていないブランドだと思う。デザイナーは加藤大樹さん。ロンドンのニコラス・デイリーで働いていた人だ。\n番付に出たのは、カシミヤ100%のVネック。色はチャコールグレーで、Vの切れこみは浅め。体に沿う小さめの形だ。西野さんは「アウターの中にも着やすい」と言う。片貝さんは別の場面で、つるっとしたハイゲージのVネックはおじさんっぽくなりやすい、と話していた。浅いVで、表情のあるカシミヤ。そのあたりが、ちょうどいいのだと思う。"}, {"h": "下は、茶色のフランネル", "body": "ニットが小さめなら、パンツは少し太くていい。合わせたのはGraphpaperのウールフランネルのイージーワイドパンツ。色はブラウンで、日本製だ。フランネルは、表面をやわらかく起毛させたウールの生地のこと。冬の布団みたいな、ほっとする手ざわりがある。\nチャコールと茶色は、どちらも主張しない色だ。並べると、静かに落ちつく。腰まわりはゴムのイージーパンツだけれど、ウールの生地なので、だらしなくは見えない。休日にも、ちょっとした食事にも使える。"}, {"h": "上と足もとで、外に出る", "body": "アウターは、ザ・ノース・フェイス パープルレーベルとジャーナル スタンダードの別注、グログランフィールドジャケット。90年代のマウンテンパーカがもとで、中わたにプリマロフトが入っている。UOMOによると、重ね着しやすいようにゆったり作ってあるそうだ。小さめのニットは、まさにこういう上着の中で生きる。\n足もとは黒のブーツ。ロンハーマンがイタリアのディエッメに別注した「ロッチャ ヴェット」だ。見た目はどっしりしているのに、履くと驚くほど軽いとUOMOは書いている。撥水のスエードなら、冬の雨の日も気にしなくていい。"}, {"h": "割り引いて読む点", "body": "ニット番付の値段は、UOMOの掲載時のものだ。エンカミングのニットは公式の商品ページを確かめられなかったので、買う前にお店で見てほしい。パンツの値段はCOVERCHORDの表示（税込）で、ブーツとアウターはUOMOの記事の値段である。\n4点そろえると、24万円近くになる。全部を一度に買う必要はない。たとえばニットだけ替えるなら、下の3つの価格帯から選べる。ニットは、さわってみないと分からない服だ。UOMOの企画名どおり、一度お店で手にとるのがいちばんだと思う。"}], "quote": {"text": "ニットはもともとかさばるから、大きいのは着ない（要約）", "who": "デザイナー・西野大士（UOMO「ニット番付」より）"}, "items": [{"brand": "ENCOMING", "name": "カシミヤ100% Vネックニット（チャコールグレー）", "price": "¥48,400", "note": "UOMOニット番付で西野大士さんの大賞。浅いV、小さめの形", "url": "https://www.webuomo.jp/fashion/shichaku/t/202612-2026aw/8qZUzw/", "linkText": "UOMOの記事を見る", "img": "https://img.webuomo.jp/article/sns/image/bd/bd1a30bb-1e88-443a-b11c-5c0f5190e04f-1200x630.jpg"}, {"brand": "Graphpaper", "name": "Wool Smooth Flannel Easy Wide Pants（BROWN）", "price": "¥35,200（税込）", "note": "日本製のウールフランネル。COVERCHORDの表示価格", "url": "https://coverchord.com/en/products/vgr-p4302", "linkText": "商品ページを見る", "img": ""}, {"brand": "THE NORTH FACE PURPLE LABEL × JOURNAL STANDARD", "name": "Grosgrain Field JKT", "price": "¥72,600", "note": "90年代のマウンテンパーカがもと。中わたはプリマロフト。黒・ボルドー・カーキ", "url": "https://www.webuomo.jp/fashion/news/2026-11-18-rSio5w/", "linkText"   function fitAll(){document.querySelectorAll('.sv,.mk .v,.s-label .box h2,.s-outline .big h2,.toc .no').forEach(function(e){

  if(favN){
    var fb=document.getElementById('favbtn');fb.hidden=false;fb.textContent='★ 好みの記事だけ表示（'+favN+'）';

      var on=fb.getAttribute('aria-pressed')!=='true';fb.setAttribute('aria-pressed',String(on));
      document.querySelectorAll('.ch').forEach(function(ch){var shown=0;
        ch.querySelectorAll('[data-fav]').forEach(function(x){var h=on&&x.dataset.fav!=='1';x.hidden=h;if(!h)shown++;});
        ch.hidden=on&&!shown;});
      redraw();
    });
  }
  /* ---- 用語タップ解説・Claudeに聞く ---- */
  function askArticle(it){var b=String(it.body||it.lead||'').slice(0,260);
    return ASK+encodeURIComponent('今朝のニュースで読んだ記事について教えてください。\n\n記事：「'+it.title+'」\n'+(b?'概要：'+b+'\n':'')+'\nこの話の背景と、今後どこに注目すればいいかを、わかりやすく説明してください。');}
  function askWord(w,ctx){return ASK+encodeURIComponent('今朝のニュースを読んでいて「'+w+'」が気になりました。'+(ctx?'記事は「'+ctx+'」です。':'')+'この記事の文脈に沿って、背景も含めてわかりやすく教えてください。');}
  function ctxOf(n){var e=n&&(n.nodeType===1?n:n.parentNode);var a=e&&e.closest&&e.closest('article,.ftr');var h=a&&a.querySelector('h3,h2');return h?h.textContent.replace(/\s+/g,' ').trim():'';}
  function mark(root,terms){if(!root||!terms||!terms.length)return;
    terms.forEach(function(t){if(!t||!t.w||!t.d||String(t.w).length<2)return;
      var tw=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null),n;
      while((n=tw.nextNode())){var pe=n.parentNode;
        if(!pe.closest('p,li')||pe.closest('.tm,a,button,h2,h3,.srcs,.chip,.tag,.folio'))continue;
        var i=n.nodeValue.indexOf(t.w);if(i<0)continue;
        var r=n.splitText(i);r.splitText(t.w.length);
        r.parentNode.replaceChild(el('span',{class:'tm',role:'button',tabindex:'0','data-d':t.d,text:t.w}),r);break;}});}
  D.sections.forEach(function(s){(s.items||[]).forEach(function(it,i){mark(document.getElementById(s.id+'-'+i),it.terms);});});
  (D.features||(D.feature?[D.feature]:[])).forEach(function(F,fi){if(F&&F.title)mark(document.getElementById('feature'+(fi?'-'+(fi+1):'')),F.terms);});
  var tmbox=document.getElementById('tmbox'),tmOn=null,selask=document.getElementById('selask');
  function tmClose(){tmbox.hidden=true;if(tmOn)tmOn.classList.remove('on');tmOn=null;}
  function tmOpen(e){tmClose();tmOn=e;e.classList.add('on');
    tmbox.querySelector('.w').textContent=e.textContent;tmbox.querySelector('.d').textContent=e.getAttribute('data-d');
    tmbox.querySelector('.go').href=askWord(e.textContent,ctxOf(e));
    var pl=document.getElementById('player');if(pl&&!pl.hidden)document.body.style.setProperty('--plh',pl.offsetHeight+'px');
    selask.hidden=true;tmbox.hidden=false;
    var over=e.getBoundingClientRect().bottom-(tmbox.getBoundingClientRect().top-24);if(over>0)window.scrollBy({top:over,behavior:'smooth'});}
  document.addEventListener('click',function(ev){var t=ev.target.closest&&ev.target.closest('.tm');
    if(t){ev.preventDefault();if(t===tmOn)tmClose();else tmOpen(t);return;}
    if(!tmbox.hidden&&(!ev.target.closest('#tmbox')||ev.target.closest('#tmbox .x')))tmClose();});
  document.addEventListener('keydown',function(ev){if(ev.key==='Escape')tmClose();
    else if((ev.key==='Enter'||ev.key===' ')&&ev.target.classList&&ev.target.classList.contains('tm')){ev.preventDefault();tmOpen(ev.target);}});
  var selT=0;
  document.addEventListener('selectionchange',function(){clearTimeout(selT);selT=setTimeout(function(){
    var sel=window.getSelection(),tx=sel&&!sel.isCollapsed?String(sel).replace(/\s+/g,' ').trim():'';
    var an=sel&&sel.anchorNode,ae=an&&(an.nodeType===1?an:an.parentNode);
    if(!tx||tx.length>80||!ae||!ae.closest('#main')){selask.hidden=true;return;}
    selask.querySelector('b').textContent=tx;selask.href=askWord(tx,ctxOf(an));
    var pl=document.getElementById('player');if(pl&&!pl.hidden)document.body.style.setProperty('--plh',pl.offsetHeight+'px');
    tmClose();selask.hidden=false;},350);});
  var links=[].slice.call(nav.querySelectorAll('a')),prog=document.getElementById('prog');
  /* ジャンルのタブ：sticky はホーム画面アプリで効かないことがあるので、通り過ぎたら fixed に切り替える */
  var slot=document.getElementById('navslot'),bar=slot.firstElementChild,rt=document.documentElement;
  (function(){var pb=document.createElement('div');pb.style.cssText='position:fixed;top:0;left:0;width:0;height:env(safe-area-inset-top,0px);visibility:hidden';document.body.appendChild(pb);var sa=pb.offsetHeight;pb.remove();
    var alone=window.navigator.standalone===true||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches);
    if(alone&&!sa&&window.innerHeight>=screen.height-1)rt.style.setProperty('--sat','54px');})();
  function sat(){return parseFloat(getComputedStyle(document.body).paddingTop)||0;}
  function onScroll(){
    var fx=slot.getBoundingClientRect().top<=sat();
    if(fx!==bar.classList.contains('fix')){if(fx)slot.style.height=slot.offsetHeight+'px';bar.classList.toggle('fix',fx);if(!fx)slot.style.height='';}
    var y=window.scrollY+90,cur=null;
    document.querySelectorAll('.ch').forEach(function(ch){if(!ch.hidden&&ch.offsetTop<=y)cur=ch.id;});
    links.forEach(function(a){var on=a.getAttribute('href')==='#'+cur;if(on&&!a.classList.contains('on'))a.scrollIntoView({inline:'center',block:'nearest'});a.classList.toggle('on',on);});
    var h=document.documentElement.scrollHeight-window.innerHeight;prog.style.width=(h>0?Math.min(100,window.scrollY/h*100):0)+'%';
  }
  window.addEventListener('scroll',onScroll,{passive:true});onScroll();
})();
</script>
<script>
(function(){
  var D=JSON.parse(document.getElementById('news-data').textContent);
  var CH=[{"sec": "", "secName": "Morning Brief", "title": "今日のヘッドライン", "start": 0.0}, {"sec": "politics", "secName": "政治・経済", "title": "フアン氏、12日でエヌビディアに復帰　米国株は2025年4月以来の大幅高", "start": 40.13}, {"sec": "politics", "secName": "政治・経済", "title": "スペースXのAIデータセンター計画、740億ドル　「電気代はだれが払うのか」", "start": 99.77}, {"sec": "football", "secName": "海外サッカー", "title": "ケイン、左足首の靱帯断裂で数か月離脱　ドルトムントが首位に", "start": 126.46}, {"sec": "art", "secName": "アート", "title": "旧KK線の高架の上で、夜だけの芸術祭　YOSHIROTTENの光とイーノの音", "start": 159.19}, {"sec": "art", "secName": "アート", "title": "宮島で芸術祭「MAFIN 2026」　Chim↑Pomが三つの火を並べる", "start": 190.28}, {"sec": "film", "secName": "映画", "title": "原田マハの初監督作『無用の人』、東京フィルメックスで開幕上映", "start": 211.13}, {"sec": "film", "secName": "映画", "title": "押井守がはじめて撮った『ボトムズ』　劇場版『灰色の魔女』が公開", "start": 243.07}, {"sec": "science", "secName": "科学", "title": "太陽の12〜16倍のブラックホールが見当たらない　爆発せずに崩れた星のしるしか", "start": 270.83}, {"sec": "", "secName": "Morning Brief", "title": "おわり", "start": 300.36}], DUR=306.01;
  var COL={politics:'var(--pol)',football:'var(--foot)',art:'var(--art)',film:'var(--film)'};
  var keyOf={};D.sections.forEach(function(s){(s.items||[]).forEach(function(it,i){keyOf[s.id+'|'+it.title]=s.id+'-'+i;});});
  CH.forEach(function(c){c.key=keyOf[c.sec+'|'+c.title]||null;});
  var au=new Audio();au.preload='metadata';au.src='audio.mp3?'+D.date;
  var player=document.getElementById('player'),pp=document.getElementById('pl-pp'),bar=document.getElementById('pl-bar');
  var I_PLAY='<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9-5.5z" fill="currentColor"/></svg>';
  var I_PAUSE='<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 2.5h3v11h-3zM9.5 2.5h3v11h-3z" fill="currentColor"/></svg>';
  var RATES=[1.0,1.2,1.4,0.9],rateI=0,PK='brief-pos-'+D.date;
  try{var r=+localStorage.getItem('brief-arate');if(RATES.indexOf(r)>=0)rateI=RATES.indexOf(r);}catch(e){}
  var meta=document.getElementById('lsn-meta');
  function idx(t){var i=0;for(var k=0;k<CH.length;k++)if(CH[k].start<=t+0.05)i=k;return i;}
  var ti=-1,lastEl=null;
  function show(scroll){var n=idx(au.currentTime);
    bar.style.width=((au.currentTime/(au.duration||DUR))*100)+'%';
    if(n===ti&&!scroll)return;ti=n;var c=CH[n];
    document.getElementById('pl-sec').textContent=c.secName||'Morning Brief';
    player.style.setProperty('--pc',COL[c.sec]||'var(--night-sub)');
    document.getElementById('pl-ttl').textContent=c.title;
    document.getElementById('pl-pos').textContent=(n+1)+' / '+CH.length;
    if(lastEl)lastEl.classList.remove('speaking');lastEl=null;
    var e=c.key&&document.querySelector('[data-k="'+c.key+'"]');
    if(e){if(e.tagName==='DETAILS')e.open=true;e.classList.add('speaking');lastEl=e;
      if(scroll&&!document.hidden){window.scrollTo({top:e.getBoundingClientRect().top+window.scrollY-60,behavior:'smooth'});}}
    if('mediaSession' in navigator){try{navigator.mediaSession.metadata=new MediaMetadata({title:c.title,artist:(c.secName||'朝のニュース'),album:'朝のニュース '+D.date,
      artwork:[{src:'art/'+(c.sec||'brief')+'.png',sizes:'512x512',type:'image/png'}]});}catch(e){}}
  }
  function setPP(){var p=!au.paused;pp.innerHTML=p?I_PAUSE:I_PLAY;pp.setAttribute('aria-label',p?'一時停止':'再生');}
  function open(){player.hidden=false;document.body.classList.add('listening');}
  function play(){open();au.playbackRate=RATES[rateI];var p=au.play();if(p&&p.catch)p.catch(function(err){meta.hidden=false;meta.textContent='再生できませんでした（'+(err&&err.name||'')+'）。もう一度押してください';});}
  function go(n){n=Math.max(0,Math.min(CH.length-1,n));au.currentTime=CH[n].start+0.01;show(true);}
  au.addEventListener('play',setPP);au.addEventListener('pause',setPP);
  au.addEventListener('timeupdate',function(){show(false);if(Math.floor(au.currentTime)%5===0){try{localStorage.setItem(PK,au.currentTime);}catch(e){}}});
  au.addEventListener('ended',function(){try{localStorage.removeItem(PK);}catch(e){}setPP();});
  au.addEventListener('error',function(){meta.hidden=false;meta.textContent='音声を読み込めませんでした（code '+(au.error&&au.error.code)+'）';});
  document.getElementById('lsn-go').addEventListener('click',function(){
    var s=0;try{s=+localStorage.getItem(PK)||0;}catch(e){}
    if(au.currentTime<1&&s>5)au.currentTime=Math.max(0,s-3);
    play();show(true);
  });
  pp.addEventListener('click',function(){au.paused?play():au.pause();});
  document.getElementById('pl-prev').addEventListener('click',function(){var n=idx(au.currentTime);go(au.currentTime-CH[n].start>3?n:n-1);});
  document.getElementById('pl-next').addEventListener('click',function(){go(idx(au.currentTime)+1);});
  document.getElementById('pl-stop').addEventListener('click',function(){au.pause();player.hidden=true;document.body.classList.remove('listening');if(lastEl)lastEl.classList.remove('speaking');});
  var rb=document.getElementById('pl-rate');
  function setRate(){rb.textContent=RATES[rateI].toFixed(1)+'×';au.playbackRate=RATES[rateI];}
  setRate();
  rb.addEventListener('click',function(){rateI=(rateI+1)%RATES.length;setRate();try{localStorage.setItem('brief-arate',RATES[rateI])}catch(e){}});
  if('mediaSession' in navigator){var ms=navigator.mediaSession;
    try{ms.setActionHandler('play',play);ms.setActionHandler('pause',function(){au.pause();});
      ms.setActionHandler('previoustrack',function(){document.getElementById('pl-prev').click();});
      ms.setActionHandler('nexttrack',function(){document.getElementById('pl-next').click();});
      ms.setActionHandler('seekto',function(e){au.currentTime=e.seekTime;});}catch(e){}}
})();

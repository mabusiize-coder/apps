<style>
/* Layout: a newspaper "visual special" — dark masthead band, then one full-bleed chapter per genre: big Mincho opener, a lead story set large, the rest as a tappable index */
:root{
  --paper:#F5F6F8; --sheet:#FFFFFF; --ink:#111418; --sub:#4E5864; --faint:#8A94A0; --rule:#DADFE5;
  --night:#0C1016; --night-ink:#F2F4F7; --night-sub:#9AA6B4; --night-rule:#2A323D;
  --pol:#2D4F95; --foot:#127A55; --art:#AE2E69; --film:#9C6406;
  --up:#C8372D; --down:#2763AD; --fav:#C9461C; --barca:#A50044; --onacc:#FFFFFF; --barc:#C9D0D9;
  --f-mincho:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F1318; --sheet:#161B22; --ink:#E8ECF0; --sub:#A7B1BC; --faint:#6F7A86; --rule:#28303A;
  --night:#06080B; --night-rule:#222A34;
  --pol:#8EAEEB; --foot:#5ACB98; --art:#EC86B8; --film:#E9B45A;
  --up:#F27F72; --down:#7FB0EC; --fav:#F2915F; --barca:#E85A90; --onacc:#0C1016; --barc:#3A4451; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F1318; --sheet:#161B22; --ink:#E8ECF0; --sub:#A7B1BC; --faint:#6F7A86; --rule:#28303A;
  --night:#06080B; --night-rule:#222A34;
  --pol:#8EAEEB; --foot:#5ACB98; --art:#EC86B8; --film:#E9B45A;
  --up:#F27F72; --down:#7FB0EC; --fav:#F2915F; --barca:#E85A90; --onacc:#0C1016; --barc:#3A4451; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.8;-webkit-text-size-adjust:100%;word-break:auto-phrase}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--night)}
a{color:inherit}
:focus-visible{outline:2px solid var(--fav);outline-offset:3px;border-radius:4px}
.in{max-width:680px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}

/* masthead */
.mast{background:var(--night);color:var(--night-ink)}
.mast .in{padding-block:28px 0}
.mrow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;color:var(--night-sub);text-transform:uppercase}
.bigdate{font-family:var(--f-mincho);font-weight:800;font-size:clamp(76px,24vw,128px);line-height:.9;letter-spacing:-.03em;margin-top:18px;font-variant-numeric:tabular-nums}
.bigdate .dot{color:var(--fav)}
.dow{font-family:var(--f-mincho);font-weight:600;font-size:18px;margin-top:10px;color:var(--night-sub)}
.lede{font-family:var(--f-mincho);font-weight:800;font-size:clamp(23px,6.2vw,30px);line-height:1.55;margin:26px 0 0;letter-spacing:.01em}
.mk{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:30px;border-top:1px solid var(--night-rule)}
.mk>div{padding:14px 10px 18px 0;min-width:0}
.mk>div+div{padding-left:12px;border-left:1px solid var(--night-rule)}
.mk .l{font-size:11px;color:var(--night-sub);letter-spacing:.06em}
.mk .v{font-family:var(--f-mono);font-size:17px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.5}
.mk .c{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}
.mk .up{color:#FF8A7E} .mk .down{color:#8DB9F2} .mk .flat{color:var(--night-sub)}
@media (max-width:460px){.mk{grid-template-columns:repeat(2,minmax(0,1fr))}.mk>div:nth-child(3){padding-left:0;border-left:0}.mk>div:nth-child(n+3){border-top:1px solid var(--night-rule)}}

/* sticky chapter nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--night);border-bottom:1px solid var(--night-rule)}
.nav .in{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-block:0}
.nav .in::-webkit-scrollbar{display:none}
.nav a,.nav button{flex:none;display:flex;align-items:center;gap:6px;color:var(--night-sub);text-decoration:none;font:500 13px/1 var(--f-body);padding:14px 10px;border:0;background:none;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.nav a.on{color:var(--night-ink);border-bottom-color:var(--c)}
.nav a .sw{width:7px;height:7px;border-radius:50%;background:var(--c)}
.nav button[aria-pressed="true"]{color:var(--onacc);background:var(--fav);border-radius:999px;padding:7px 12px;margin-block:7px}
.prog{position:absolute;left:0;bottom:-1px;height:2px;background:var(--night-ink);opacity:.5;width:0}

/* chapters */
.ch{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 46px)}
.opener{border-top:6px solid var(--c);background:var(--sheet)}
.opener .in{padding-block:36px 8px}
.en{font-family:var(--f-mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--c)}
.opener h2{font-family:var(--f-mincho);font-weight:800;font-size:clamp(40px,12vw,60px);line-height:1.15;margin:6px 0 0;letter-spacing:.02em}
.opener .meta{font-size:13px;color:var(--sub);margin-top:6px}

.lead{background:var(--sheet)}
.lead .in{padding-block:18px 34px}
.lead h3{font-family:var(--f-mincho);font-weight:800;font-size:clamp(23px,6vw,28px);line-height:1.5;margin:0}
.lead p{font-size:16.5px;line-height:1.95;margin:14px 0 0;color:var(--ink);max-width:60ch}

.idx{background:var(--paper)}
.idx .in{padding-block:8px 44px}
.grp{font-family:var(--f-body);font-weight:700;font-size:12px;letter-spacing:.14em;color:var(--c);margin:26px 0 4px;display:flex;align-items:center;gap:10px}
.grp::after{content:"";flex:1;height:1px;background:var(--rule)}
.item{border-bottom:1px solid var(--rule)}
.item summary{list-style:none;cursor:pointer;display:flex;gap:14px;align-items:flex-start;padding-block:16px}
.item summary::-webkit-details-marker{display:none}
.item .t{flex:1;min-width:0;font-weight:700;font-size:16.5px;line-height:1.6}
.pm{flex:none;width:22px;height:22px;margin-top:2px;border-radius:50%;border:1px solid var(--rule);position:relative}
.pm::before,.pm::after{content:"";position:absolute;left:50%;top:50%;width:9px;height:1.5px;background:var(--sub);transform:translate(-50%,-50%)}
.pm::after{transform:translate(-50%,-50%) rotate(90deg);transition:transform .2s}
.item[open] .pm::after{transform:translate(-50%,-50%) rotate(0deg)}
.item .b{padding-bottom:18px}
.item .b p{margin:0;font-size:15.5px;line-height:1.9;color:var(--ink);max-width:60ch}

.tag{display:inline-block;font:500 10px/1 var(--f-mono);letter-spacing:.06em;padding:4px 6px 3px;border-radius:3px;margin-left:8px;vertical-align:3px;color:var(--onacc);white-space:nowrap}
.tag.fav{background:var(--fav)} .tag.barca{background:var(--barca)}
.srcs{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:12.5px}
.srcs a{color:var(--c);text-decoration:none;border-bottom:1px solid currentColor;padding-bottom:1px}
.srcs a::after{content:" ↗";color:var(--faint)}
.srcs span{color:var(--faint);font-family:var(--f-mono);font-size:10px;letter-spacing:.12em}

.foot{background:var(--night);color:var(--night-sub);font-size:12px;line-height:1.8}
.foot .in{padding-block:32px 40px}
.foot b{color:var(--night-ink);font-family:var(--f-mincho);font-size:16px;display:block;margin-bottom:6px}

/* illustrations & figures */
.mast{position:relative;overflow:hidden}
.sun{position:absolute;right:-60px;top:-40px;width:300px;height:300px;color:var(--fav);opacity:.9;pointer-events:none}
.mast .in{position:relative}
.otop{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.illo{width:clamp(92px,26vw,132px);height:auto;color:var(--c);display:block;flex:none}
.fig{margin:22px 0 0;padding:18px 16px 14px;background:var(--paper);border-radius:10px}
.idx .fig{background:var(--sheet)}
.fig .fl{font-family:var(--f-mono);font-size:10px;letter-spacing:.16em;color:var(--c);text-transform:uppercase}

.fig .fn{font-size:11.5px;color:var(--faint);margin-top:10px;line-height:1.6}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:14px;margin-top:12px}
.stats .sv{font-family:var(--f-mincho);font-weight:800;font-size:clamp(30px,9vw,40px);line-height:1.1;font-variant-numeric:tabular-nums}
.stats .sv.up{color:var(--up)} .stats .sv.down{color:var(--down)}
.stats .sl{font-size:12.5px;color:var(--sub);line-height:1.5;margin-top:4px}
.bars{display:grid;gap:9px;margin-top:12px}
.bar{display:grid;grid-template-columns:minmax(0,7.5em) minmax(0,1fr);gap:10px;align-items:center;font-size:12.5px}
.bar .bl{color:var(--sub);line-height:1.35;overflow-wrap:anywhere}
.bar .track{display:flex;align-items:center;gap:8px;min-width:0}
.bar .fill{height:14px;border-radius:0 3px 3px 0;background:var(--barc);flex:none;min-width:2px}
.bar.hi .fill{background:var(--c)} .bar.hi .bl{color:var(--ink);font-weight:700}
.bar .bv{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tl{list-style:none;margin:14px 0 0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:5px;top:8px;bottom:8px;width:1.5px;background:var(--rule)}
.tl li{position:relative;padding-left:26px;display:grid;grid-template-columns:4.2em minmax(0,1fr);gap:10px;padding-block:6px;font-size:14px;line-height:1.55}
.tl li::before{content:"";position:absolute;left:0;top:12px;width:12px;height:12px;border-radius:50%;background:var(--sheet);border:2px solid var(--c);box-sizing:border-box}
.tl li.hi::before{background:var(--c)}
.tl .td{font-family:var(--f-mono);font-size:12.5px;color:var(--c);font-weight:500;padding-top:1px}
.tl li.hi .tx{font-weight:700}
/* debate: two opposing views */
:root{--v0:#A8512A;--v1:#2C6A87}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--v0:#EE9B72;--v1:#7DBCDB}}
:root[data-theme="dark"]{--v0:#EE9B72;--v1:#7DBCDB}
.vw{margin:22px 0 0;border-top:1px solid var(--rule);padding-top:14px}
.vl{font-family:var(--f-mono);font-size:10px;letter-spacing:.16em;color:var(--c);text-transform:uppercase}
.vq{font-weight:700;font-size:14.5px;line-height:1.5;margin-top:2px}
.vg{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin-top:10px}
.vc{background:var(--paper);border-radius:10px;padding:14px 14px 12px;border-top:3px solid var(--va);min-width:0}
.idx .vc{background:var(--sheet)}
.vc.v0{--va:var(--v0)} .vc.v1{--va:var(--v1)}
.vs{font-weight:700;font-size:13px;color:var(--va);letter-spacing:.04em}
.vc p.vp{margin:6px 0 0;font-size:14.5px;line-height:1.8;color:var(--ink)}
.vwho{font-size:12px;color:var(--sub);margin-top:8px;line-height:1.5}
.va{display:inline-block;font-size:12px;color:var(--va);text-decoration:none;border-bottom:1px solid currentColor;margin-top:6px}
.va::after{content:" ↗";color:var(--faint)}
@media (prefers-reduced-motion:reduce){.pm::after{transition:none}}
/* home-screen install guide */
.inst{background:var(--night);color:var(--night-ink);border-top:1px solid var(--night-rule)}
.inst .in{padding-block:16px 18px;display:grid;gap:10px}
.inst .ih{display:flex;justify-content:space-between;align-items:center;gap:12px}
.inst b{font-family:var(--f-mincho);font-size:16px}
.inst .x{flex:none;font:500 12px/1 var(--f-body);color:var(--night-sub);background:none;border:1px solid var(--night-rule);border-radius:999px;padding:7px 12px;cursor:pointer}
.inst ol{margin:0;padding:0;list-style:none;display:grid;gap:8px;font-size:13.5px;line-height:1.6;color:var(--night-sub)}
.inst ol li{display:grid;grid-template-columns:5.5em minmax(0,1fr);gap:8px}
.inst ol li span:first-child{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;color:var(--fav);padding-top:2px}
.inst .k{color:var(--night-ink);font-weight:700}
.inst .nt{font-size:12px;color:var(--night-sub);line-height:1.6}
.again{background:none;border:0;color:var(--night-sub);font:inherit;text-decoration:underline;cursor:pointer;padding:0;margin-top:6px}

/* listen: read-aloud player */
.lsn{background:var(--night);border-top:1px solid var(--night-rule)}
.lsn .in{padding-block:14px 16px;display:flex;align-items:center;gap:14px}
.lsn .lt{flex:1;min-width:0;color:var(--night-sub);font-size:13px;line-height:1.5}
.lsn .lt b{display:block;color:var(--night-ink);font-family:var(--f-mincho);font-size:17px}
.lsn .go{flex:none;display:flex;align-items:center;gap:8px;background:var(--fav);color:var(--onacc);border:0;border-radius:999px;padding:11px 18px;font:700 14px/1 var(--f-body);cursor:pointer}
.lsn .go svg{width:14px;height:14px}
.player{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--night);color:var(--night-ink);border-top:1px solid var(--night-rule);padding-bottom:env(safe-area-inset-bottom,0px)}
.player .in{padding-block:10px 12px;display:grid;gap:8px}
.pl-now{display:flex;gap:10px;align-items:baseline;min-width:0}
.pl-sec{flex:none;font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--pc,var(--night-sub))}
.pl-ttl{flex:1;min-width:0;font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-pos{flex:none;font-family:var(--f-mono);font-size:11px;color:var(--night-sub);font-variant-numeric:tabular-nums}
.pl-bar{height:3px;background:var(--night-rule);border-radius:2px;overflow:hidden}
.pl-bar i{display:block;height:100%;width:0;background:var(--fav);transition:width .3s}
.pl-ctl{display:flex;align-items:center;gap:8px}
.pl-ctl button{display:grid;place-items:center;background:none;border:1px solid var(--night-rule);color:var(--night-ink);border-radius:999px;width:42px;height:42px;cursor:pointer;flex:none}
.pl-ctl button svg{width:16px;height:16px}
.pl-ctl .pp{width:52px;height:52px;background:var(--fav);border-color:var(--fav);color:var(--onacc)}
.pl-ctl .pp svg{width:20px;height:20px}
.pl-ctl .rate{width:auto;padding:0 12px;font:500 12px/1 var(--f-mono);height:34px}
.pl-ctl .sp{flex:1}
.pl-ctl .x{width:auto;height:34px;padding:0 12px;font:500 12px/1 var(--f-body);color:var(--night-sub)}
.pl-note{font-size:11.5px;color:var(--night-sub);line-height:1.5}
body.listening .foot .in{padding-bottom:190px}
.speaking{box-shadow:inset 4px 0 0 var(--c)}
@media (prefers-reduced-motion:reduce){.pl-bar i{transition:none}}

/* desktop: wider sheet, larger type, two-column masthead and story index */

nsights/quad-passes-its-most-critical-test-survivability/"]}]}}, {"title": "ウクライナ、開戦以来最大のドローン攻撃 エストニアは国境閉鎖へ", "body": "ウクライナが開戦以来最大規模のドローン攻撃をロシアに仕掛け、ロシア側はモスクワやクリミア上空で迎撃したと発表した。クリミアとロシアを結ぶケルチ橋も攻撃を受け、ロシア大統領府は「軽微な損傷」だとしている。エストニアは防衛企業への破壊工作未遂を受けて12月1日からロシアとの国境検問所をすべて閉じる方針で、停戦交渉が進まないなか欧州の緊張も高まっている。", "src": [["Just Security（11/16）", "https://www.justsecurity.org/164727/early-edition-november-16-2026/"], ["Anadolu", "https://www.aa.com.tr/en/world/morning-briefing-nov-16-2026/4126094"]]}, {"group": "AI・テクノロジー", "title": "Nvidia、フアン氏の復帰は検討せず　17日に「フアン後」初の決算", "body": "Nvidia取締役会は辞任したジェンスン・フアン前CEOの復帰を検討していないと米CNBCが16日に報じた。トランプ大統領は復帰について「悪い考えではない」と述べたが、ベセント財務長官は外部からの起用を求めている。17日の米国市場の取引終了後（日本時間18日朝）に、コレット・クレス暫定CEOのもとで8〜10月期決算を発表する予定で、市場予想の売上高は約1091億ドルと会社見通しの1080億ドルを上回る。", "src": [["MarketScreener（Reuters）", "https://www.marketscreener.com/news/nvidia-board-is-not-considering-bringing-jensen-huang-back-as-ceo-cnbc-reports-ce785edfdd88ff2d"], ["Yahoo Finance（TIKR）", "https://finance.yahoo.com/markets/stocks/articles/trump-says-jensen-huang-return-195505875.html"]], "debate": {"q": "急落したNvidiaは買い場か、さらに下がる始まりか", "views": [{"side": "強気派の見方", "point": "10月の急落局面で、AI半導体の需要はなお供給を上回り、Nvidiaの強みはGPUだけでなくネットワークやシステム全体、CUDAにまで及ぶとして買い場だと主張した。フアン氏の辞任後は、同氏がいる場合といない場合で妥当な株価に差があると試算しつつ、強気の評価を維持している（10月の発言と11月中旬の試算）。", "who": "ダン・アイブス（ウェドブッシュ証券 アナリスト）", "src": ["Yahoo Finance（Barchart、10/21）", "https://finance.yahoo.com/markets/stocks/articles/dan-ives-calls-selloff-nvda-112607108.html"]}, {"side": "弱気派の見方", "point": "業績面では割安に見えても、トップ交代の混乱、市場全体の割高さ、AI関連企業の債務膨張など6つのリスクがそれを上回ると論じた。10月高値から3割超の下落は買い場ではなく、さらに5割下がる局面の入り口になりうると警告している（11/14の寄稿）。", "who": "ショーン・ウィリアムズ（モトリーフール 寄稿アナリスト）", "src": ["The Motley Fool（11/14）", "https://fool.com/investing/2026/11/14/think-nvidia-stock-bargain-6-reasons-face-ai-build-out-can-plunge-50-after-jensen-huang-resignation"]}]}}, {"group": "AI・テクノロジー", "title": "Anthropic、18日に公開価格決定　19日にナスダック上場へ", "body": "AI企業Anthropicは18日に新規株式公開（IPO）の価格を決め、19日にナスダックで「ANT」として取引を始める予定だ。仮条件は1株70〜78ドルで、上限なら約644億ドルを調達し、完全希薄化ベースの企業価値は約1.4兆ドルになる。需要は募集の約6倍と報じられる一方、7〜9月期の売上高は約170億ドルで前期比の伸びは47%と4〜6月期の144%から鈍っており、AI相場全体の試金石とみられている。", "src": [["MarketPulse（OANDA）", "https://www.marketpulse.com/markets/anthropics-ipo-a-make-or-break-test-for-the-trillion-dollar-ai-trade/"], ["Fortune", "https://fortune.com/2026/11/10/anthropic-lower-than-expected-ipo-valuation-smart-strategy-or-red-flag/"]], "debate": {"q": "1.4兆ドル規模のAnthropic上場は妥当な値付けか、上値の乏しい高値づかみか", "views": [{"side": "値付けを評価", "point": "夏に取り沙汰された約2兆ドルより低い仮条件は、事業の弱さの表れではなく、上場後の値上がり余地と話題性を残すための賢い価格戦略だと評価した。期待を抑えた設定が、上場後の株価を支えるとの見方だ（11/10の報道でのコメント）。", "who": "リオール・プロソル（ベンチャーキャピタルDeep33 ジェネラルパートナー）", "src": ["Fortune（11/10）", "https://fortune.com/2026/11/10/anthropic-lower-than-expected-ipo-valuation-smart-strategy-or-red-flag/"]}, {"side": "リターンに懐疑", "point": "1.3兆ドル前後で上場すれば、そこから企業価値が4兆ドルに育っても上昇余地は限られ、それには年2000億ドル規模の利益が必要になると指摘した。オープンソースや安価な競合との価格競争もリスクに挙げている（11/14のインタビュー）。", "who": "ジェイ・リッター（フロリダ大学 IPO研究の第一人者）", "src": ["TheStreet（11/14）", "https://www.thestreet.com/investing/anthropic-ipo-valuation-risk-1-trillion-ceiling-jay-ritter"]}]}}, {"group": "AI・テクノロジー", "title": "日米など10カ国、AIサプライチェーン防衛の協定に署名", "body": "米国主導の枠組み「パックス・シリカ」の会合で15日、米国と日本、オーストラリア、インド、イスラエル、韓国、カタール、シンガポール、UAE、英国の計10カ国が、AIを支える技術や重要インフラを守る「サンフランシスコ宣言」に署名した。信頼できる供給網に分散して過度な依存を減らすのが狙いで、英FTは主にレアアースなど中国によるリスクを念頭に置くと報じている。ドイツ、スウェーデン、オランダと欧州委員会も23日の週に署名する見込みだ。", "src": [["Anadolu（anews）", "https://www.anews.com.tr/world/2026/11/16/us-9-partners-sign-agreement-to-secure-ai-supply-chains"], ["Taiwan News", "https://www.taiwannews.com.tw/news/6476991"]]}]}, {"id": "football", "name": "海外サッカー", "items": [{"title": "ドイツがオランダに大勝、ヴィルツが2得点", "body": "ネーションズリーグの最終節が16日にベルリンで行われ、ドイツはシェアハントの先制点に続き、60分と71分にヴィルツ、65分にシュロッターベックが決めて71分までに4-0とし、オランダを圧倒した（最終スコアは5-0とする報道もある）。試合前は勝ち点11のオランダが首位で、ドイツとギリシャが8で追っており、同時刻のギリシャ対セルビアの結果と合わせて準々決勝進出の顔ぶれが決まる。クロップ監督のもとで宿敵相手に示した攻撃力は大きな収穫だ。", "src": [["Yahoo Sports（OneFootball）", "https://sports.yahoo.com/articles/klopp-ing-kidding-germany-thrash-211500508.html"], ["UEFA", "https://www.uefa.com/uefanationsleague/news/02ab-22096ba64f4d-f179d6d05013-1000--nations-league-quarter-finals-who-is-through-who-can-joi/"]]}, {"title": "バルサ：デ・ヨングとクバルシに検査、ビジャレアル戦の出場は不透明", "barca": true, "body": "オランダ代表を離脱したフレンキー・デ・ヨングは、シャビ監督が「深刻ではない」と話したものの、恥骨周辺の問題の可能性も報じられ、16日にクラブの練習場で検査を受けた。イングランド戦で腰（股関節）付近の違和感を訴えてハーフタイムに退いたクバルシも、けがの有無を確かめる検査を受ける予定だ。週末のビジャレアル戦に向けて守備と中盤の主力の状態が焦点になる。", "src": [["Yahoo Sports（Barca Universal）", "https://sports.yahoo.com/articles/barcelona-receive-positive-injury-news-074000310.html"], ["Yahoo Sports（SB Nation）", "https://sports.yahoo.com/articles/fc-barcelona-news-16-november-100000956.html"]]}, {"title": "ネーションズリーグ8強に仏・ベルギー・英・スペイン・ポルトガル", "body": "リーグAではフランス、ベルギー、イングランド、スペイン、ポルトガルが準々決勝進出を決め、イタリアは3位で敗退、クロアチアは入れ替えプレーオフに回り、チェコはリーグBへの降格が決まった。17日にはデンマーク対ノルウェー（デンマークは引き分け以上で突破）とウェールズ対ポルトガルが行われ、20日に準々決勝と入れ替え戦の組み合わせ抽選がある。", "src": [["UEFA", "https://www.uefa.com/uefanationsleague/news/02ab-22096ba64f4d-f179d6d05013-1000--nations-league-quarter-finals-who-is-through-who-can-joi/"], ["Football360", "https://football360.com.au/uefa-nations-league-2026-27-quarter-finals-promotion-relegation-playoffs/"]], "viz": {"type": "timeline", "title": "ネーションズリーグ これからの日程", "items": [{"date": "11/17", "text": "デンマーク対ノルウェー、ウェールズ対ポルトガル（リーグ最終戦）"}, {"date": "11/20", "text": "準々決勝・入れ替え戦の抽選", "hi": true}, {"date": "3/25〜30", "text": "準々決勝・入れ替え戦（2027年）"}, {"date": "6/9〜13", "text": "ファイナルズ（2027年）"}], "note": "出典：UEFA、Football360"}}, {"title": "レアル：チュアメニが代表で負傷離脱、週末のセルタ戦は微妙", "body": "レアル・マドリードのチュアメニは10日のフランス代表の練習で負傷して代表を離れ、スペイン紙マルカは週末のセルタ戦の出場が不透明だと伝えた。現地記者は大きなけがではないとの見方も示しており、中断明けの中盤の構成に影響しそうだ。", "src": [["Roundtable", "https://roundtable.io/sports/soccer/la-liga/real-madrid/news/fresh-injury-updates-provided-on-real-madrid-midfield-partners"]]}]}, {"id": "art", "name": "アート", "viz": {"type": "timeline", "title": "今週のアート注目日程", "items": [{"date": "11/16", "text": "サザビーズNY「Now & Contemporary」イブニング（現地）"}, {"date": "11/17", "text": "フィリップスNY 近現代イブニング（現地）"}, {"date": "11/18", "text": "サザビーズNY ブラキエ＝アリエタ・コレクション／モダン・イブニング（現地）", "hi": true}, {"date": "11/21", "text": "近藤亜樹「吾は、わたしは、」開幕（大田区立龍子記念館）", "hi": true}, {"date": "12/20", "text": "すみだ五彩の芸術祭 閉幕"}], "note": "出典：Beyond Every Art、Sotheby's、美術手帖（NYは現地時間）"}, "items": [{"group": "国内", "title": "近藤亜樹が川端龍子の記念館で個展、21日開幕", "body": "大田区立龍子記念館で、画家・近藤亜樹の展覧会「吾は、わたしは、」が21日から2027年1月24日まで開かれる。日本画家・川端龍子と現代の作家を組み合わせる企画「川端龍子プラスワン」の後期で、精神科医でコレクターの高橋龍太郎のコレクションと合わせて構成する。大画面の日本画で知られる龍子の空間に、近藤の力強い色彩の絵画がどう向き合うかが見どころだ。", "src": [["美術手帖", "https://bijutsutecho.com/magazine/news/exhibition/33334"]]}, {"group": "国内", "title": "墨田区で初の「すみだ五彩の芸術祭」、12月20日まで", "body": "東京・墨田区で初めての芸術祭「すみだ五彩の芸術祭」が12月20日まで開かれている。旧商家や町工場、大学のサテライトキャンパスなど地域の建物を会場に、小泉智貴、山口藍、風間サチコらが参加し、多くの会場は入場無料だ。ものづくりの町の歴史と現代美術を重ねる試みとして、週末の街歩きにも向いている。", "src": [["美術手帖", "https://bijutsutecho.com/magazine/news/promotion/33290"]]}, {"group": "国内", "title": "浅田政志が箱根を撮る、彫刻の森美術館で来年1月から", "body": "写真家・浅田政志が神奈川の4つの町を撮るシリーズの箱根編が、2027年1月16日から3月22日まで彫刻の森美術館で展示されることが決まった。白黒写真に手で色を付けた明治期の「横浜写真」の手法を取り入れ、土地の人々と風景を写す。家族写真で知られる浅田が、観光地の記憶をどう写し直すかに注目だ。", "src": [["美術手帖", "https://bijutsutecho.com/magazine/news/exhibition/33336"]]}, {"group": "海外", "title": "NYで秋の大型オークション週間、ゴッホに約1.8億ドルの声", "body": "ニューヨークでは16日のサザビーズ「Now & Contemporary」を皮切りに秋のイブニングセールが続き、リキテンスタインに2000万〜3000万ドル、草間彌生《No. 3P.B.》に1000万〜1500万ドルの予想がついている。18日のブラキエ＝アリエタ・コレクションではゴッホ《花咲くマロニエ》が約1.8億ドルと報じられ、市場の冷え込みが続くなかで高額作品の買い手がどこまで戻るかが試される。結果は日本時間の今週後半に判明する。", "src": [["Beyond Every Art", "https://www.beyondeveryart.com/new-york-november-2026-auctions-estimates-explained/"], ["Sotheby's", "https://www.sothebys.com/en/series/the-new-york-sales"]]}, {"group": "海外", "title": "シャネルの文化誌第2号、表紙はシンディ・シャーマン", "body": "シャネルが発行する文化誌「ARTS & CULTURE」の第2号が出た。シンディ・シャーマンが「Fabric Matrons」シリーズの新作で表紙と作品ページを手がけ、パティ・スミスは2026年のCHANELネクスト・プライズ受賞者に向けた手書きの詞を寄せている。17の国と地域で無料配布され、ブランドと現代美術の結びつきを示す媒体になっている。", "src": [["美術手帖", "https://bijutsutecho.com/magazine/news/headline/33345"]]}]}, {"id": "film", "name": "映画", "items": [{"title": "ジャームッシュの金獅子賞作『ファーザー マザー シスター ブラザー』、20日公開", "fav": true, "body": "ジム・ジャームッシュが6年ぶりに撮り、第82回ヴェネチア国際映画祭で金獅子賞を受けた『ファーザー マザー シスター ブラザー』が20日に日本で公開される。ニュージャージー、ダブリン、パリを舞台に、大人になった子どもと親のぎこちない再会を3つの物語で描き、トム・ウェイツやアダム・ドライバーらが出演する（111分）。ジャームッシュらしい間とドライなユーモアが、家族という題材でどう効くかを劇場で確かめたい。", "src": [["MOVIE WALKER PRESS", "https://press.moviewalker.jp/news/article/1455811/"], ["Filmarks（公開予定）", "https://filmarks.com/list/coming"]], "viz": {"type": "timeline", "title": "これから2週間の公開・映画祭・賞", "items": [{"date": "11/19", "text": "IDFA（アムステルダム）受賞発表"}, {"date": "11/20", "text": "ジャームッシュ新作 日本公開／ズビャギンツェフ『Minotaur』米公開", "hi": true}, {"date": "11/22", "text": "金馬奨授賞式"}, {"date": "11/25", "text": "濱口竜介『All of a Sudden』米公開", "hi": true}, {"date": "11/27", "text": "広瀬奈々子『このごにおよんで愛など』公開"}, {"date": "11/30", "text": "ゴッサム賞授賞式"}], "note": "出典：MOVIE WALKER PRESS、The Film Stage、Focus Taiwan、映画.com"}}, {"title": "濱口竜介『All of a Sudden』、25日に米公開", "fav": true, "body": "濱口竜介の新作で、カンヌでヴィルジニー・エフィラと岡本多緒が女優賞を受けた『All of a Sudden』が25日に米国で公開される。ゴッサム賞では最多候補の一つに入っており、賞レースの中で濱口作品がどこまで存在感を示すかが注目される。日本公開の時期も気になるところだ。", "src": [["The Film Stage（11月の注目作）", "https://thefilmstage.com/15-films-to-see-in-november-2026/"], ["The Film Stage（ゴッサム賞候補）", "https://thefilmstage.com/all-of-a-sudden-clarissa-la-gradiva-the-invite-and-tender-loving-care-lead-2026-gotham-awards-nominations/"]]}, {"title": "ポール・トーマス・アンダーソン『Cameron Winter at Carnegie Hall』、20日米公開", "fav": true, "body": "ポール・トーマス・アンダーソンが監督した『Cameron Winter at Carnegie Hall』が20日に米国で公開される。シンガーソングライターのキャメロン・ウィンターのカーネギー・ホールでの公演を題材にした作品で、ハイム姉妹のMVなど音楽映像でも知られるPTAの演出が見どころになる。", "src": [["The Film Stage", "https://thefilmstage.com/15-films-to-see-in-november-2026/"]]}, {"title": "スピルバーグ、ネイサン・フィールダーらのドキュメンタリーを絶賛", "body": "スティーヴン・スピルバーグがニューヨーク近代美術館（MoMA）の映画ガラで表彰された際、ネイサン・フィールダーとランス・オッペンハイムによる約3時間のドキュメンタリー『You Can See Everything』を、ここ20年ほどで見た中で最も並外れた作品の一つだと米紙に語った。エリザベス・ホームズを題材にしたA24作品で、テルライドでサプライズ上映され、SCADサバンナ映画祭では観客賞を受けている。ドキュメンタリーとして初の作品賞候補入りを予想する声も出ている。", "src": [["World of Reel", "https://www.worldofreel.com/blog/2026/11/16/steven-spielberg-calls-you-can-see-everything-one-of-the-most-extraordinary-documentaries-hes-seen-in-a-couple-of-decades"], ["Next Best Picture", "https://nextbestpicture.com/the-2026-scad-savannah-film-festival-award-winners/"]]}, {"title": "ズビャギンツェフのカンヌ・グランプリ作『Minotaur』、20日米公開", "body": "『裁かれるは善人のみ』『ラブレス』のアンドレイ・ズビャギンツェフが、今年のカンヌでグランプリを受けた『Minotaur』が20日に米国で公開される。ロシアを離れて活動する監督の新作で、社会を見つめる作家の現在地を示す一本として賞レースでも注目される。", "src": [["The Film Stage", "https://thefilmstage.com/15-films-to-see-in-november-2026/"]]}, {"title": "『ドリーム・シナリオ』のボルグリ、A24新作にマーゴット・ロビー", "fav": true, "body": "不条理なユーモアで知られるノルウェー出身のクリストファー・ボルグリが、A24の新作『The Week of Pain』を撮り、マーゴット・ロビーが出演を決めた。撮影は2027年の予定だ。『シック・オブ・マイセルフ』『ドリーム・シナリオ』に続き、皮肉の効いた作風がスター俳優とどう組み合わさるかが楽しみだ。", "src": [["World of Reel", "https://www.worldofreel.com/"]]}, {"title": "今週のミニシアター：ブルース・ウェバーのミッチャム論と加藤拓也『日曜のあと』", "body": "20日には、写真家ブルース・ウェバーが俳優ロバート・ミッチャムを描いたドキュメンタリー『ちゃんとした女の子は朝食までいるもんじゃない』（93分）が公開される。同じ日には、劇作家・加藤拓也の監督作『日曜のあと』も公開され、黒木華と吉田羊が出演する。27日にはヤン・コマサ監督の『HEEL／ヒール』も控えている。", "src": [["Filmarks（公開予定）", "https://filmarks.com/list/coming"]]}, {"title": "クライテリオン、2月にバームバック『Jay Kelly』とエゴヤン作品", "body": "米クライテリオン・コレクションが2027年2月のラインナップを発表し、ノア・バームバック『Jay Kelly』を監督承認の4Kマスターで16日に出す。同じ月にアトム・エゴヤン『スウィート ヒアアフター』、ガス・ヴァン・サントの長編デビュー作『マラノーチェ』、カルラ・シモン『Romería』なども加わる。", "src": [["World of Reel", "https://www.worldofreel.com/blog/2026/11/14/173bifvr99u5tk41ia753ndbqhglm1"]]}]}]}</script>

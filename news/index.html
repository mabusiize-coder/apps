<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="art/brief.png">
<title>朝のニュース</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=Noto+Sans+JP:wght@200;400;500;700;900&display=swap">
<style>
:root{
  color-scheme:light;
  --paper:#FFFFFF; --ink:#141414; --sub:#555; --faint:#999; --rule:#DCDCDC;
  --ic:#FFE03A;                                   /* その日のテーマカラー（JSで日替わり） */
  --ic-t:color-mix(in srgb,var(--ic) 28%,#fff);
  --ic-tt:color-mix(in srgb,var(--ic) 12%,#fff);
  --up:#D23B2F; --down:#1E4FD6;
  --f-en:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-jp:"Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN",system-ui,sans-serif;
  --gut:max(22px,env(safe-area-inset-left,0px));
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(60px + var(--sat))}
:root{--sat:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-jp);font-size:16px;line-height:2;letter-spacing:.04em;-webkit-font-smoothing:antialiased;padding-top:var(--sat);overflow-x:hidden}
[hidden]{display:none!important}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.in{max-width:660px;margin:0 auto;padding-left:var(--gut);padding-right:max(22px,env(safe-area-inset-right,0px))}
h1,h2,h3,.bp{word-break:auto-phrase}
p,.vp,.tx{overflow-wrap:anywhere}
.en{font-family:var(--f-en)}
.chip{display:inline-block;background:var(--ink);color:#fff;font:700 13px/1 var(--f-jp);letter-spacing:.06em;padding:7px 10px 6px}
.chip.ic{background:var(--ic);color:var(--ink)}
.pill{display:inline-block;border:2px solid var(--ink);border-radius:999px;padding:3px 14px 2px;font-weight:700}
.runhead{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--ink);padding:14px 0 8px;font:800 12px/1 var(--f-en);letter-spacing:.06em}
.runhead i{width:10px;height:10px;border:1.5px solid var(--ink);display:inline-block}
.folio{display:grid;grid-template-columns:56px minmax(0,1fr) auto;border:1px solid var(--ink);margin-top:28px;font:500 11px/1 var(--f-en);letter-spacing:.08em}
.folio>*{padding:11px 10px}
.folio>:nth-child(2){border-left:1px solid var(--ink);border-right:1px solid var(--ink);font-family:var(--f-jp);font-weight:700;letter-spacing:.14em}
.folio>:last-child{text-align:right;min-width:56px;white-space:nowrap}

/* ---------- cover ---------- */
.cover{background:var(--ic);padding-bottom:26px}
.cover .runhead{border-color:var(--ink)}
.cv-frame{margin-top:22px;background:#fff;border:2px solid var(--ink);aspect-ratio:10/7;overflow:hidden}
.cv-frame svg{display:block;width:100%;height:100%}
.cv-cap{font-size:10px;text-align:right;margin-top:4px;letter-spacing:.06em}
.cv-k{margin-top:18px;font-weight:700;font-size:13px;letter-spacing:.2em}
.cv-t{display:flex;align-items:center;flex-wrap:wrap;gap:10px 14px;margin:4px 0 0}
.cv-t h1{margin:0;font-weight:900;font-size:clamp(40px,12.4vw,64px);line-height:1.15;letter-spacing:.14em}
.cv-t .pill{font-size:clamp(18px,5vw,24px);letter-spacing:.06em;font-family:var(--f-en);font-weight:800}
.lede{margin:18px 0 0;font-weight:500;font-size:14.5px;line-height:1.95}
.mk{display:grid;grid-template-columns:1fr 1fr;margin-top:22px;border-top:1.5px solid var(--ink);border-left:1.5px solid var(--ink);background:#fff}
.mk>div{min-width:0;padding:10px 12px 12px;border-right:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink)}
.mk .l{font-size:11px;font-weight:700;line-height:1.4}
.mk .v{font:900 25px/1.2 var(--f-en);letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
.mk .c{font-size:11px;line-height:1.4;font-variant-numeric:tabular-nums}
.mk .c.up{color:var(--up)} .mk .c.down{color:var(--down)}

/* listen */
.lsn{margin-top:36px}
.lsn .box{display:flex;align-items:center;gap:14px;border:2px solid var(--ink);padding:12px 12px 12px 18px;position:relative;background:#fff}
.lsn .box::after{content:"";position:absolute;inset:6px -6px -6px 6px;background:var(--ic);z-index:-1;border:2px solid var(--ink)}
.lsn .lt{flex:1;min-width:0;line-height:1.5}
.lsn .lt b{display:block;font-size:15px;font-weight:900}
.lsn .lt span{font-size:12px;color:var(--sub)}
.go{flex:none;display:flex;align-items:center;gap:8px;background:var(--ink);color:#fff;border:0;border-radius:999px;padding:13px 20px;font:700 14px/1 var(--f-jp);letter-spacing:.1em;cursor:pointer}
.go svg{width:12px;height:12px}

/* contents */
.toc{margin-top:64px}
.toc .hd{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:10px}
.toc h2{margin:0;font:900 34px/1 var(--f-en);letter-spacing:-.02em}
.toc ol{list-style:none;margin:0;padding:0}
.toc li a{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;padding:16px 0;border-bottom:1px solid var(--rule);text-decoration:none}
.toc .no{font:900 30px/1 var(--f-en);color:transparent;-webkit-text-stroke:1.5px var(--ink);min-width:48px}
.toc .nm{font-weight:900;font-size:17px;line-height:1.4}
.toc .nm small{display:block;font:700 11px/1.6 var(--f-en);letter-spacing:.12em;text-transform:uppercase;color:var(--sub)}
.toc .ct{font-size:12px;font-weight:700}
.favbtn{margin-top:16px;background:#fff;border:1.5px solid var(--ink);border-radius:999px;padding:8px 16px;font:700 13px/1 var(--f-jp);cursor:pointer}
.favbtn[aria-pressed=true]{background:var(--ink);color:#fff}

/* sticky nav */
.navslot{margin-top:64px;min-height:47px}
.nav{z-index:20;background:#fff;border-bottom:1.5px solid var(--ink)}
.nav.fix{position:fixed;top:0;left:0;right:0;padding-top:var(--sat)}
.nav .in{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-block:9px}
.nav .in::-webkit-scrollbar{display:none}
.nav a{flex:none;text-decoration:none;font:700 12px/1 var(--f-jp);letter-spacing:.06em;padding:8px 12px 7px;border:1.5px solid var(--ink);border-radius:999px}
.nav a.on{background:var(--ic)}
.prog{height:3px;background:var(--ic);width:0;transition:width .15s linear;margin-bottom:-1.5px}

/* ---------- common article parts ---------- */
.ch{padding-top:72px}
.sechead{display:flex;justify-content:flex-end;align-items:stretch;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);padding:10px 0;gap:0}
.sechead .lede2{flex:1;font-size:12px;font-weight:700;line-height:1.7;padding-right:10px}
.sechead .t{display:flex;align-items:flex-start}
.sechead .t span{font:700 12px/1 var(--f-jp);padding:6px 8px 5px;border:1px solid var(--ink)}
.sechead .t span:first-child{background:var(--ic)}
.sechead .t span+span{border-left:0;font-weight:500}
.art{padding-top:48px}
.art h3{margin:10px 0 0;font-weight:900;font-size:clamp(21px,5.8vw,25px);line-height:1.55;letter-spacing:.02em}
.art p{margin:16px 0 0;font-size:15.5px;line-height:2.05}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grp{font-size:12px;font-weight:700;letter-spacing:.08em}
.grp::before{content:"#";color:var(--sub);margin-right:2px}
.tag{display:inline-block;font:800 10px/1 var(--f-en);letter-spacing:.12em;padding:5px 8px 4px;border-radius:99px;vertical-align:4px;margin-left:8px;white-space:nowrap}
.tag.fav{background:var(--ic);border:1.5px solid var(--ink);color:var(--ink)}
.tag.barca{background:#A50044;color:#fff}
.srcs{margin-top:16px;font-size:11.5px;line-height:1.9;color:var(--sub)}
.srcs b{font:800 10px/1 var(--f-en);letter-spacing:.14em;border:1px solid var(--sub);padding:3px 5px 2px;margin-right:8px}
.srcs a{margin-right:10px;text-underline-offset:3px}
.speaking{position:relative}
.speaking::after{content:"♪ NOW READING";position:absolute;right:max(22px,env(safe-area-inset-right,0px));top:20px;font:800 10px/1 var(--f-en);letter-spacing:.12em;background:var(--ic);border:1.5px solid var(--ink);padding:5px 8px 4px}

/* figures */
.fig{margin:28px 0 0;border:1.5px solid var(--ink);padding:16px 16px 14px;background:#fff}
.fig .fl{display:inline-block;transform:translateY(-27px);margin-bottom:-22px;background:var(--ink);color:#fff;font:800 10px/1 var(--f-en);letter-spacing:.14em;padding:5px 8px 4px}
.fig .ft{font-weight:900;font-size:15px;line-height:1.6}
.fig .fn{font-size:11px;color:var(--sub);margin-top:12px;line-height:1.7}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;margin-top:12px}
.stats>div{background:var(--ic-t);padding:12px 12px 11px;min-width:0}
.stats .sv{font:800 32px/1.1 var(--f-en);letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
.stats .sv.up{color:var(--up)} .stats .sv.down{color:var(--down)}
.stats .sl{font-size:11.5px;line-height:1.6;margin-top:6px;font-weight:500}
.bars{margin-top:12px;display:grid;gap:9px}
.bar{display:grid;grid-template-columns:6.5em minmax(0,1fr);align-items:center;gap:10px;font-size:12.5px;line-height:1.4;font-weight:500}
.bar .track{display:flex;align-items:center;gap:8px;min-width:0}
.bar .fill{height:14px;background:#fff;border:1.5px solid var(--ink);flex:none}
.bar.hi .fill{background:var(--ic)}
.bar .bv{font:800 12.5px/1 var(--f-en);white-space:nowrap}
.tl{list-style:none;margin:12px 0 0;padding:0 0 0 14px;border-left:2px dotted var(--ink)}
.tl li{position:relative;padding:6px 0 10px;font-size:13.5px;line-height:1.7}
.tl li::before{content:"";position:absolute;left:-21px;top:12px;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--ink)}
.tl li.hi::before{background:var(--ic)}
.tl .td{display:block;font:800 12px/1.6 var(--f-en)}
.tl li.hi .tx{font-weight:700}

/* two views */
.vw{margin-top:30px;position:relative;border:1.5px solid var(--ink);padding:24px 16px 16px;background:var(--ic-tt)}
.vw .lb{position:absolute;top:-14px;left:12px;transform:rotate(-3deg)}
.vw .vq{font-weight:900;font-size:16px;line-height:1.7}
.vc{margin-top:14px;background:#fff;border:1px solid var(--ink);padding:12px 14px}
.vc .vs{font-weight:900;font-size:13.5px;display:flex;gap:8px;align-items:center}
.vc .vs::before{content:"A";font:900 11px/18px var(--f-en);width:20px;height:20px;text-align:center;border-radius:50%;background:var(--ink);color:#fff;flex:none}
.vc.v1 .vs::before{content:"B";background:var(--ic);color:var(--ink);border:1.5px solid var(--ink);line-height:16px}
.vc .vp{margin:8px 0 0;font-size:13.5px;line-height:1.9}
.vc .vwho{margin-top:8px;font-size:11.5px;font-weight:700;line-height:1.6}
.vc .va{display:inline-block;font-size:11px;color:var(--sub);text-underline-offset:3px}

/* ---------- STYLE: label (WELL-MADE風) ---------- */
.s-label .opn{position:relative;margin-top:30px}
.s-label .tilt{transform:rotate(-4deg);display:inline-block;font:800 18px/1 var(--f-en);letter-spacing:.04em;padding:10px 16px 9px;position:relative;z-index:2;margin-left:-4px}
.s-label .box{background:var(--ic);border:2px solid var(--ink);padding:26px 20px 18px;margin-top:-12px}
.s-label .box h2{overflow:hidden;margin:0;font:900 clamp(40px,12.5vw,60px)/.98 var(--f-en);letter-spacing:-.02em;text-transform:uppercase}
.s-label .box .jp{margin-top:14px;font-weight:700;font-size:13px}
.s-label .cred{border:5px solid var(--ink);padding:10px 14px;margin-top:10px;font:700 12px/1.8 var(--f-en);letter-spacing:.02em}
.s-label .ill{margin-top:22px;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);aspect-ratio:10/6;overflow:hidden;background:var(--ic-tt)}
.s-label .ill svg{display:block;width:100%;height:100%}
.s-label .art.lead p:first-of-type::first-letter{float:left;font-weight:200;font-size:4.3em;line-height:.95;margin:8px 12px 0 -2px;padding:0 2px;background:linear-gradient(transparent 68%,var(--ic) 68%)}
.s-label .art h3{border-bottom:1px solid var(--ink);padding-bottom:10px}
.s-label .art:not(.lead) h3{font-size:19px;border:0;padding:0}
.s-label .art:not(.lead){border-left:3px solid var(--ink);padding-left:14px;margin-left:var(--gut);padding-top:0;margin-top:44px}
@media (min-width:704px){.s-label .art:not(.lead){margin-left:auto;margin-right:auto;max-width:616px}}

/* ---------- STYLE: map（相関図） ---------- */
.s-map .opn h2{margin:22px 0 0;font-weight:900;font-size:clamp(30px,9vw,42px);line-height:1.3;letter-spacing:.06em}
.s-map .opn .sub{font-weight:700;font-size:13px;margin-top:8px}
.map{position:relative;margin-top:22px;background-color:var(--ic-t);background-image:radial-gradient(color-mix(in srgb,var(--ink) 22%,transparent) .8px,transparent 1px);background-size:5px 5px;border:1px solid var(--ink);padding:26px 14px 30px}
.map svg.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.map .node{position:relative;display:block;width:78%;text-decoration:none;margin-top:30px}
.map .node:first-of-type{margin-top:0}
.map .node.r{margin-left:auto}
.map .node .chip{position:relative;z-index:1}
.map .node .nb{display:block;background:#fff;border:1.5px solid var(--ink);padding:10px 12px 10px;margin-top:-3px;font-weight:900;font-size:14.5px;line-height:1.55}
.map .node .nb small{display:block;font-weight:500;font-size:11px;line-height:1.6;color:var(--sub);margin-top:4px}
.map .key{position:absolute;right:12px;bottom:-14px}
.s-map .art .no{display:inline-grid;place-items:center;width:30px;height:30px;background:var(--ink);color:#fff;font:900 13px/1 var(--f-en)}

/* ---------- STYLE: outline（白抜き英字） ---------- */
.s-outline .opn .big{display:flex;align-items:center;gap:10px;margin-top:26px}
.s-outline .opn .big h2{overflow:hidden;min-width:0;padding:0 2px 4px;margin:0;font:900 clamp(54px,17vw,92px)/1 var(--f-en);letter-spacing:-.01em;color:transparent;-webkit-text-stroke:1.5px var(--ink);flex:0 1 auto}
.s-outline .opn .big i{flex:1 0 24px;height:1px;background:var(--ink)}
.s-outline .opn .bp{margin-top:12px;background:var(--ic-t);border:1px solid var(--ink);padding:10px 14px;font-weight:900;font-size:15px;text-align:center}
.s-outline .ill{margin-top:22px;aspect-ratio:10/6;overflow:hidden;background:var(--ic-tt);border:1px solid var(--ink)}
.s-outline .ill svg{display:block;width:100%;height:100%}
.s-outline .art .num{display:flex;align-items:center;gap:10px}
.s-outline .art .num b{font:900 52px/1 var(--f-en);color:transparent;-webkit-text-stroke:1.2px var(--ink);flex:none}
.s-outline .art .num i{flex:1;height:1px;background:var(--ink)}
.s-outline .art h3{background:var(--ic-t);border:1px solid var(--ink);padding:10px 14px;font-size:18px;margin-top:10px}
.s-outline .art.lead h3{font-size:22px}

/* ---------- STYLE: cards（グリッド） ---------- */
.s-cards .opn .hl{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:22px;flex-wrap:wrap}
.s-cards .opn h2{margin:0;font-weight:900;font-size:clamp(28px,8.4vw,40px);line-height:1.35;letter-spacing:.04em}
.s-cards .opn h2 em{font-style:normal;background:linear-gradient(transparent 58%,var(--ic) 58%)}
.s-cards .grid{display:grid;grid-template-columns:1fr;gap:0;margin-top:22px;border-top:1px solid var(--ink)}
.s-cards .art{min-width:0;padding:22px 0 26px;border-bottom:1px solid var(--ink)}
.s-cards .art .th{display:grid;grid-template-columns:38% minmax(0,1fr);gap:14px;align-items:start}
.s-cards .art .th .pic{border:1px solid var(--ink);aspect-ratio:4/3;overflow:hidden;background:var(--ic-tt)}
.s-cards .art .th .pic svg{display:block;width:100%;height:100%}
.s-cards .art h3{overflow-wrap:anywhere;margin:0;font-size:16.5px;line-height:1.6}
.s-cards .art.lead h3{font-size:21px}
.s-cards .art .th .meta{margin-top:6px}
.s-cards .art p{font-size:14px;line-height:1.95;margin-top:12px}
.s-cards .art.lead p{font-size:15.5px}

/* ---------- 特集 ---------- */
.ftr{margin-top:72px}
.ftr .hero{background:var(--ic);border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);padding:22px 0 30px;position:relative;overflow:hidden}
.ftr .hero .bg{position:absolute;right:-12px;bottom:-34px;font:900 clamp(120px,40vw,220px)/1 var(--f-en);letter-spacing:-.04em;color:transparent;-webkit-text-stroke:1.5px color-mix(in srgb,var(--ink) 28%,transparent);pointer-events:none;white-space:nowrap}
.ftr .hero .in{position:relative}
.ftr .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ftr .kick{font-weight:700;font-size:13px;line-height:1.8;margin-top:18px}
.ftr h2{margin:6px 0 0;font-weight:900;font-size:clamp(28px,8.2vw,44px);line-height:1.4;letter-spacing:.03em;word-break:auto-phrase}
.ftr .ld{margin:16px 0 0;font-size:15px;font-weight:500;line-height:2}
.ftr .facts{margin:28px 0 0;border:1.5px solid var(--ink)}
.ftr .facts>div{display:grid;grid-template-columns:6.5em minmax(0,1fr);border-top:1px solid var(--ink);font-size:13px;line-height:1.7}
.ftr .facts>div:first-child{border-top:0}
.ftr .facts dt{background:var(--ic-t);padding:8px 10px;font-weight:700;border-right:1px solid var(--ink)}
.ftr .facts dd{margin:0;padding:8px 12px;overflow-wrap:anywhere}
.ftr .pts{margin:30px 0 0;border:1.5px solid var(--ink);padding:22px 16px 10px;position:relative;background:var(--ic-tt)}
.ftr .pts .lb{position:absolute;top:-14px;left:12px;transform:rotate(-3deg)}
.ftr .pts ol{list-style:none;margin:0;padding:0;counter-reset:p}
.ftr .pts li{counter-increment:p;display:grid;grid-template-columns:34px minmax(0,1fr);gap:8px;padding:8px 0;border-top:1px dotted var(--ink);font-weight:700;font-size:14.5px;line-height:1.8}
.ftr .pts li:first-child{border-top:0}
.ftr .pts li::before{content:counter(p);font:900 26px/1.2 var(--f-en);color:transparent;-webkit-text-stroke:1.2px var(--ink)}
.ftr .blk{margin-top:44px}
.ftr .blk .n{display:flex;align-items:center;gap:10px;font:800 12px/1 var(--f-en);letter-spacing:.14em}
.ftr .blk .n i{flex:1;height:1px;background:var(--ink)}
.ftr .blk h3{margin:10px 0 0;font-weight:900;font-size:clamp(20px,5.6vw,24px);line-height:1.6;word-break:auto-phrase}
.ftr .blk h3 span{background:linear-gradient(transparent 62%,var(--ic) 62%)}
.ftr .blk p{margin:12px 0 0;font-size:15.5px;line-height:2.05}
.ftr .qt{margin:40px 0 0;border-left:6px solid var(--ic);padding:4px 0 4px 16px}
.ftr .qt p{margin:0;font-weight:200;font-size:clamp(20px,5.6vw,26px);line-height:1.75}
.ftr .qt cite{display:block;font-style:normal;font-size:12px;font-weight:700;margin-top:8px}
.ftr .its{margin:36px 0 0}
.ftr .its .hd{display:flex;align-items:center;gap:10px;font:800 12px/1 var(--f-en);letter-spacing:.14em;margin-bottom:14px}
.ftr .its .hd i{flex:1;height:1px;background:var(--ink)}
.lk{display:block;color:var(--ink);text-decoration:none;border:1.5px solid var(--ink);background:#fff;margin-top:12px;-webkit-tap-highlight-color:transparent}
.lk:active{background:var(--ic-tt)}
.lk .ph{display:block;background:var(--ic-tt);overflow:hidden;position:relative}
.lk .ph img{display:block;width:100%;height:100%;object-fit:cover}

, "debate": {"q": "FRBは12月に、どこまで利上げすべきか", "views": [{"side": "大きく上げるべきだとする見方", "point": "物価の基調は3か月続けて0.3%ずつ上がり、インフレは悪い方向に広がっていると見る。企業が3%の値上げを当たり前にしはじめていて、流れを断つには強い手が要るという。2025年の予防的な利下げを戻すため、12月に0.5%上げるべきだと主張した（11月18日のCNBCのインタビュー）。", "who": "クリストファー・ウォラー（米連邦準備制度理事会〈FRB〉理事）", "src": ["Stocktwits", "https://stocktwits.com/news-articles/markets/equity/fed-s-waller-stresses-on-the-need-for-half-point-rate-hike-in-december-says-i-am-very-concerned-about-inflation/cNbg5eSR9LV"]}, {"side": "上げる必要はないとする見方", "point": "住宅ローンなどの借入コストの上昇が、すでに景気を冷やしているという。9月の利上げの効き目もまだ出きっておらず、原油安でインフレの一部は和らぎつつあるとみる。どうしても上げるなら0.25%にとどめ、その先は約束すべきでないと説く。", "who": "リチャード・ロバーツ（米モンマス大学教授、元FRB職員）", "src": ["RealClearMarkets", "https://www.realclearmarkets.com/articles/2026/11/24/the_federal_reserve_will_raise_rates_the_data_say_it_shouldnt_1222957.html"]}]}}, {"title": "ソロモン諸島、中国との安保協定を更新せず　豪と新しい条約へ", "body": "ソロモン諸島が、中国と結んだ安全保障の協定を更新しないと中国側に伝えた。オーストラリアのABCやロイターが24日に報じた。協定は2022年に結ばれ、期限は2027年4月だ。中国の警察の訓練チームが、交代で島に入ることを認めている。5月に就任したウェール首相は、いまキャンベラにいる。25日、アルバニージー首相と包括的な条約に署名する予定だ。ABCによると、条約には約9億8000万ドルの追加資金がつく。全文はまだ公表されていない。中国外務省は、まだ反応していない。南太平洋で中国が広げてきた足場の一つが、揺らぐことになる。", "src": [["ABC News（豪）", "https://www.abc.net.au/news/2026-11-24/china-solomon-islands-security-pact-australia/107421976"], ["Yahoo News（ロイター）", "https://www.yahoo.com/news/articles/solomon-islands-plans-replace-china-044751902.html"]], "debate": {"q": "ソロモン諸島の中国離れは、オーストラリアの勝利と言えるか", "views": [{"side": "豪州の大きな得点とする見方", "point": "今回の動きを、オーストラリアにとって大きな勝利だと評価する。ただ、キャンベラがどれほどの見返りを用意したのかには疑問も示した。ウェール首相はすでに不信任案を突きつけられており、国内で揺さぶられるおそれもあると指摘する。", "who": "オリバー・ノベタウ（豪ローウィー研究所研究員）", "src": ["ABC News（豪）", "https://www.abc.net.au/news/2026-11-24/china-solomon-islands-security-pact-australia/107421976"]}, {"side": "協定を手放すことに反対する見方", "point": "2022年に中国との協定をまとめた本人だ。ウェール首相は協定を捨てる準備をしているようだと述べ、国として何を失うのかをよく考えるべきだと訴えた。野党側は、豪州がお金で味方を買う「小切手外交」をしていると批判している。", "who": "マナセ・ソガバレ（ソロモン諸島野党党首、前首相）", "src": ["ABC News（豪）", "https://www.abc.net.au/news/2026-11-24/china-solomon-islands-security-pact-australia/107421976"]}]}}, {"group": "AI・テクノロジー", "title": "アンソロピック株、公開価格の83ドルを割る　上場から1週間足らず", "body": "AI企業アンソロピックの株が24日、上場のときの公開価格83ドルを下回った。一時は9.4%下げ、79.42ドルをつけた。同社は19日にナスダックに上場したばかりだ。集めた資金は813億ドルで、過去最大の新規上場だった。初日は111.50ドルで始まり、23日は87.64ドルで終えていた。上場時の上乗せは、1週間足らずで消えたことになる。同じ日、エヌビディア株も約6%下げ、半導体株の指数は5.8%落ちた。前日の急騰の反動で、AI関連株に利益を確定する売りが広がった。AIへの期待がどこまで続くのか。市場はその手ごたえを探っている。", "terms": [{"w": "公開価格", "d": "新規上場のときに、投資家が株を買う値段として決められる価格。上場後の株価がこれを下回ることを「公開価格割れ」という。"}], "src": [["Forbes", "https://www.forbes.com/sites/zacharyfolk/2026/11/24/anthropic-stock-falls-below-83-per-share-ipo-price/"], ["Yahoo Finance（ブルームバーグ）", "https://finance.yahoo.com/markets/stocks/articles/anthropic-shares-fall-below-ipo-181906660.html"], ["Business Recorder（ロイター）", "https://www.brecorder.com/news/40450534/nasdaq-sampp-500-ease-as-nvidia-driven-ai-rally-fizzles"]], "viz": {"type": "bars", "title": "アンソロピックの株価（ドル）", "items": [{"label": "公開価格", "value": 83, "display": "$83.00"}, {"label": "初日の始値（19日）", "value": 111.5, "display": "$111.50"}, {"label": "23日の終値", "value": 87.64, "display": "$87.64"}, {"label": "24日の安値", "value": 79.42, "display": "$79.42", "hi": true}], "note": "出典：Forbes、Yahoo Finance（ブルームバーグ）"}, "debate": {"q": "アンソロピック株は、公開価格に見合う価値があるのか", "views": [{"side": "高い評価に値するとする見方", "point": "生成AIは最大5.6兆ドルの市場になりうるとし、ソフトウェアへの支出を上回るとみる。規模が大きいので最先端のモデル開発に資金を回せ、高めの価格づけも保てるという。企業での導入が速いことを理由に、目標株価を150ドルとした（11月19日）。", "who": "スコット・バーグ（ニーダム証券アナリスト）", "src": ["Yahoo Finance（Barchart）", "https://finance.yahoo.com/technology/ai/articles/needham-initiates-coverage-anthropic-buy-204602099.html"]}, {"side": "割高でもろいとする見方", "point": "計算資源のコストを高く見直し、評価を1株約77ドルに下げた。公開価格より低い水準だ。計算資源のリース契約は約5000億ドルの借金に近い負担で、利益の出ていない会社が借りるべきではないと警告する。株主から見た企業統治の仕組みにも強い疑問を示している。", "who": "アスワス・ダモダラン（米ニューヨーク大学スターン経営大学院教授）", "src": ["TradingView（Stocktwits）", "https://www.tradingview.com/news/stocktwits:8f7efcef3094b:0-aswath-damodaran-valued-anthropic-at-77-a-share-its-ipo-price-of-83-terrifies-him/"]}]}}]}, {"id": "football", "name": "海外サッカー", "items": [{"title": "レアル・マドリード、PSVに5発で逆転勝ち　CLは5戦全勝", "body": "CLのリーグフェーズ第5節で、レアル・マドリードがPSVを5対1で下した。24日、本拠地ベルナベウでの試合だ。前半32分、PSVがペリシッチのPKで先に点を取った。チュアメニのファウルで与えたPKだった。後半、レアルが一気に返す。50分にバルベルデ、60分にベリンガムが決めた。エムバペが64分と84分に2点を加え、87分にはヴィニシウスも決めた。ヴィニシウスにとっては、長く続いた無得点を抜ける1点だった。レアルは5戦全勝で勝ち点15。ペリシッチは37歳295日で、CL史上4番目の年長得点者になった。", "src": [["Sporza", "https://sporza.be/nl/matches/voetbal/eur/uefa-champions-league/2026-2027/leaguefase/05/real-madrid-psv-dankzij-5-goals-in-de-tweede-helft-ontketend-real-madrid-pakt-ook-tegen-psv-uit-met-cl-comeback~1781706728491/"], ["La Razón", "https://razon.com.mx/deportes/2026/11/24/real-madrid-viene-de-atras-ante-el-psv-y-lo-golea-para-seguir-con-paso-perfecto-en-la-champions-league"]]}, {"title": "アーセナルとドルトムント、1対1で分ける", "body": "24日のCLで、アーセナルは本拠地にドルトムントを迎え、1対1で引き分けた。10分、ギェケレシュが遠めから決めて先に出た。55分、ドルトムントのマクシミリアン・バイアーが追いついた。アーセナルのゴールはケパが守った。アーセナルは勝ち点11になり、このリーグフェーズの負けなしが続く。ドルトムントは5試合を終えて勝ち点10だ。週末のブンデスリーガでは、本拠地にレバークーゼンを迎える。", "src": [["Schwäbische（dpa）", "https://www.schwaebische.de/sport/bvb-auf-kurs-dortmund-erkaempft-sich-11-beim-fc-arsenal-5035923"], ["Sportsdunia", "https://www.sportsdunia.com/football-ratings/arsenal-vs-dortmund-player-ratings-ucl-24th-november-2026"]]}]}, {"id": "art", "name": "アート", "items": [{"group": "海外", "title": "ヴェネチア・ビエンナーレが閉幕　日本館は観客投票から降りたまま", "body": "第61回ヴェネチア・ビエンナーレが22日に閉幕した。来場者は71万4015人。会期は5月9日からで、これまでより約3週間短かった。今回は異例ずくめだった。4月30日に国際審査員が一斉に辞め、金獅子賞の代わりに来場者の投票で選ぶ「ビジターズ・ライオン」が設けられた。作家と国別館の2部門だ。日本館は11月19日、この投票から降りると表明した。出品は荒川ナッシュ医の「草の赤ちゃん、月の赤ちゃん」。メイン会場の外にある館に不利な仕組みだという点と、審査員への連帯を理由に挙げた。ガザとウクライナの戦争に反対する立場も示している。日本館の展示は、2027年6月19日からアーティゾン美術館で帰国展として見られる。", "src": [["Tokyo Art Beat", "https://www.tokyoartbeat.com/articles/-/venice-biennale-visitors-lions-news-202611"], ["Monopol", "https://www.monopol-magazin.de/en/714000-visitors-venice-biennale"]]}]}, {"id": "film", "name": "映画", "viz": {"type": "timeline", "title": "今週の映画の予定", "items": [{"date": "11/27", "text": "広瀬奈々子『このごにおよんで愛など』、ヤン・コマサ『HEEL ヒール』が公開"}, {"date": "11/29", "text": "東京フィルメックス最終日"}, {"date": "11/30", "text": "ゴッサム賞の授賞式（ニューヨーク、現地時間）", "hi": true}], "note": "出典：映画.com、Real Sound、The Gotham"}, "items": [{"title": "スピルバーグ初の西部劇、脚本はポール・トーマス・アンダーソン", "fav": true, "body": "スティーヴン・スピルバーグが、初めて西部劇を撮る。原作はアイルランドの作家ケヴィン・バリーの2024年の小説『The Heart in Winter』。脚本はポール・トーマス・アンダーソンが書き上げた。PTAがほかの監督のために脚本を書くのは、これが初めてだという。主演はキリアン・マーフィーとジェシー・バックリーの予定で、2人の共演も初めてだ。マーク・ライランスも加わる。舞台は1891年、モンタナ州ビュートの鉱山町。依存症をかかえたアイルランドの詩人が、鉱山の監督の若い妻と、盗んだ金を持って冬のロッキー山脈を逃げる。あとを殺し屋たちが追う。製作はユニバーサルで、配給はフォーカス・フィーチャーズの見込み。撮影は2027年の冬、公開は2028年の予定だ。", "src": [["RTÉ", "https://www.rte.ie/entertainment/2026/1123/1600361-jessie-buckley-cillian-murphy-going-west-with-spielberg/"], ["The Week", "https://www.theweek.in/news/entertainment/2026/11/24/paul-thomas-anderson-spielberg-movie-announcement.html"]]}, {"title": "ゴッサム賞は30日　濱口竜介『急に具合が悪くなる』が4部門の候補", "fav": true, "body": "米国のインディペンデント映画の賞、ゴッサム賞の授賞式が30日（現地時間）にニューヨークで開かれる。濱口竜介監督の『急に具合が悪くなる』は、4部門で候補に入っている。国際長編映画賞、監督賞、脚色賞、そして岡本多緒の助演の演技賞だ。脚色はレア・ル・ディムナとの共同になる。アダム・ドライバーも『Paper Tiger』で助演の候補だ。作品賞の候補には、エマ・ストーンが製作に加わる『The Debut』と、アリ・アスターが製作する『Primetime』も並ぶ。国内では27日、是枝裕和監督の助監督を務めた広瀬奈々子の長編2作目『このごにおよんで愛など』が公開される。", "src": [["The Gotham（ノミネート発表）", "https://thegotham.org/press/the-gothams-nominations-36th-edition/"], ["Real Sound（『このごにおよんで愛など』）", "https://realsound.jp/movie/2026/03/post-2351832.html"]]}]}, {"id": "science", "name": "科学", "items": [{"title": "白斑に初めての飲み薬　米FDAがウパダシチニブを承認", "body": "米食品医薬品局（FDA）が23日、白斑の飲み薬を承認した。アッヴィの「リンヴォック」（一般名ウパダシチニブ）で、JAK阻害薬と呼ばれる種類の薬だ。対象は12歳以上の、非分節型の白斑。米国で白斑を体の内側から治療する薬が認められるのは、これが初めてだ。これまでは塗り薬や、光をあてる治療が中心だった。根拠は、計614人が参加した2つの第3相試験。薬と偽薬をくらべ、結果はランセット誌に載った。48週の時点で、顔の白い部分の75%以上に色が戻った人は、薬で25%と23%、偽薬で6%と7%だった。全身で75%以上戻った人の割合は、偽薬と差がつかなかった。顔の色がしっかり戻るのは、4人に1人ほどということになる。JAK阻害薬には、重い感染症などへの警告がつく。EUでは7月に承認された。日本での承認は確認できていない。", "terms": [{"w": "JAK阻害薬", "d": "免疫の細胞の中で信号を伝える酵素JAKの働きを抑える薬。関節リウマチやアトピー性皮膚炎などにも使われる。"}, {"w": "非分節型", "d": "白斑のうち最も多いタイプで、色の抜けた部分が体の左右両側などに広がる。免疫が色素をつくる細胞を攻撃して起こる。"}, {"w": "第3相試験", "d": "新薬の効き目と安全性を、多くの患者で確かめる最終段階の臨床試験。この結果をもとに承認の審査が行われる。"}], "src": [["AbbVie（プレスリリース）", "https://news.abbvie.com/2026-11-23-AbbVies-RINVOQ-R-upadacitinib-Approved-as-the-First-Systemic-Therapy-in-the-U-S-to-Treat-Adult-and-Pediatric-Patients-With-Nonsegmental-Vitiligo"], ["AJMC", "https://www.ajmc.com/view/fda-approves-upadacitinib-as-first-systemic-therapy-for-vitiligo"]], "viz": {"type": "bars", "title": "48週で顔の色が75%以上戻った人の割合", "unit": "%", "items": [{"label": "試験1・薬", "value": 25, "hi": true}, {"label": "試験1・偽薬", "value": 6}, {"label": "試験2・薬", "value": 23, "hi": true}, {"label": "試験2・偽薬", "value": 7}], "note": "出典：AbbVie、AJMC（The Lancet掲載の第3相試験 Viti-Up-1/2）"}}]}], "cover": {"svg": "<rect width=\"400\" height=\"280\" fill=\"#A9CBEA\"/>\n<rect x=\"0\" y=\"190\" width=\"400\" height=\"90\" fill=\"{C}\"/><path d=\"M0 190h400\" stroke=\"#141414\" stroke-width=\"3\"/>\n<path d=\"M30 214q15-8 30 0t30 0M260 236q15-8 30 0t30 0M120 252q15-8 30 0t30 0\" fill=\"none\" stroke=\"#141414\" stroke-width=\"3\" stroke-linecap=\"round\"/>\n<g stroke=\"#141414\" stroke-width=\"3\" stroke-linejoin=\"round\">\n<ellipse cx=\"320\" cy=\"192\" rx=\"54\" ry=\"12\" fill=\"#F4C744\"/>\n<path d=\"M318 186q-6-40 4-74\" fill=\"none\" stroke-width=\"5\"/>\n<path d=\"M322 112q-26-6-42 10q20-4 42-10zM322 112q22-14 44-6q-22 2-44 6zM322 112q-8-22-28-26q14 12 28 26zM322 112q16-20 34-20q-16 8-34 20z\" fill=\"#FFFFFF\"/>\n<rect x=\"60\" y=\"150\" width=\"54\" height=\"38\" fill=\"#F2A27E\"/><rect x=\"114\" y=\"150\" width=\"54\" height=\"38\" fill=\"#FFFFFF\"/><rect x=\"87\" y=\"112\" width=\"54\" height=\"38\" fill=\"#C9C2B6\"/>\n<path d=\"M74 150v38M88 150v38M100 150v38M128 150v38M142 150v38M154 150v38M101 112v38M115 112v38M127 112v38\" fill=\"none\" stroke-width=\"2\"/>\n<rect x=\"184\" y=\"120\" width=\"8\" height=\"70\" fill=\"#141414\"/>\n<path d=\"M192 132h70\" fill=\"none\" stroke-width=\"10\" stroke-linecap=\"butt\"/>\n<path d=\"M192 132h70\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"5\" stroke-dasharray=\"10 10\"/>\n<path d=\"M250 20q-30 0-30 30q0 22 30 40q30-18 30-40q0-30-30-30z\" fill=\"#F2A27E\"/>\n<path d=\"M241 88l-4 14M259 88l4 14\" fill=\"none\"/>\n<rect x=\"237\" y=\"102\" width=\"26\" height=\"12\" fill=\"#F4EFE6\"/>\n<path d=\"M278 32q10 4 14 0M282 44q8 4 14 2\" fill=\"none\" stroke-linecap=\"round\"/>\n<\/g>", "motif": "しぼむ気球、関税の遮断機、南の島"}, "features": [{"topic": "ai", "label": "AI", "kicker": "知っている。でも、使わない。", "title": "マイクラの宙に浮いた土は落ちるか。AIはルールを知っているのに「落ちる」と答えた", "lead": "マインクラフトの画面に、土のブロックが1つ、宙に浮いている。手を離したら、どうなるか。ゲームの中では、浮いたままだ。ところがAIに画像だけを見せると「落ちる」と答える。ルールを知らないわけではない。聞けば、ちゃんと言える。では、なぜ間違えるのか。11月21日にarXivに出た論文を読んでみる。", "facts": [{"k": "論文", "v": "Multimodal LLMs Know the Game but Assume the Real World"}, {"k": "著者", "v": "Jianxin Gao、Bohan Chen、Runze Li、Qi Zhang（中国農業大学、吉林大学）"}, {"k": "公開", "v": "2026年11月21日　arXiv（査読前）"}, {"k": "実験", "v": "マインクラフトの155のルールで1,240問（ゲームの中で結果を確認済み）。広く使われている6つのモデルを比べた"}], "pointsLabel": "ここが面白い", "points": ["画像だけを見せると、AIはゲームではなく現実の物理で答える。ルールそのものは、聞けば知っている", "「これはマインクラフトです」と一言添えるだけで、現実と食い違うルールの正答率が8.2〜19.8ポイント上がった", "考える過程では、ゲームのルールを自分で書いている。なのに最後の答えは、現実のほうを選んでいた"], "blocks": [{"h": "宙に浮いた土は、落ちるか", "body": "研究チームが作ったテストの名前は「RuleCraft」。マインクラフトの155のルールについて、1,240問の画像の問題を用意した。どの問題も、本当にそうなるかをゲームの中で確かめてある。\n選択肢は3つある。ゲームの中で起きること。現実なら起きること。そして、どちらの世界でも起きないこと。浮いた土なら「浮いたまま」「落ちる」、それに見当違いの答えが1つ、という具合だ。\nルールの種類は、重さと支え、水や溶岩、植物、光と火、素材と道具。ゲームと現実で結果が同じルールも、わざと混ぜてある。"}, {"h": "3通りの聞き方", "body": "同じ問題を、3通りの聞き方で出した。1つめは、場面を文章で説明し、ゲーム名も添える。2つめは、画像を見せて「これはマインクラフト（Java版1.20.1）です。このゲームのルールで答えて」と言う。3つめは、画像だけを見せる。\n6つのモデルとも、ゲームのルールは知っていた。画像がマインクラフトだということも、ちゃんと見分けた。それでも3つめの聞き方になると、現実の物理で答えてしまう。\nゲーム名を添えると、現実と食い違うルールでの正答率は8.2〜19.8ポイント上がった。もっと難しい問題を集めた別のセットでは、33.8〜52.7ポイントも上がった。"}, {"h": "何も起きない、がいちばん難しい", "body": "間違えるとき、AIはたいてい「現実なら起きること」を選んでいた。でたらめに外すのではない。いつも、こちらの世界に引き寄せられる。\nずれがいちばん大きかったのは、ゲームの中では何も変わらない場面だ。浮いた土は浮いたまま。時間がたっても、雨が降っても、そのまま。現実の感覚だと、これがどうにも落ち着かないらしい。\n公開されたコードのページには、難しいセットでの出力例が載っている。あるモデルは、文章で聞くと98.7%正解した。画像だけだと47.0%だった。ほぼ半分だ。\n推論（答える前に考える過程）を使わせても、同じことが起きた。過程の中ではゲームのルールを書いておきながら、答えは現実で出す。テストの前の晩に公式を暗記して、本番では勘で解いてしまう。少し、そんな感じに似ている。"}, {"h": "一文で、かなり戻る", "body": "では、どうすればいいのか。答えは意外と簡単だった。\nゲーム名を出さずに「画像に写っている世界のルールで答えてください」と一文足す。それだけで、差のかなりの部分が戻ったという。AIに足りなかったのは知識ではなく、「いまどの世界の話をしているのか」を選ぶことだった。\n同じ傾向は、テラリアとスターデューバレーという2つのゲームでも出た。AIが自分で「これはゲームの質問だ」と判断した問題でも、やはり現実で答えていた。\n著者たちは、ゲーム名を告げる評価が測っているのはルールの知識で、どの世界かを選ぶ力ではない、と書いている。ゲームの話だけではないと思う。説明書と違う動きをする機械や、ふつうと違う決まりの職場。AIに画像を見せて判断させる場面は、これから増えるはずだ。"}, {"h": "割り引いて読む点", "body": "まず、これは査読前の論文だ。それに、ここで読めたのは要旨と、公開されたコードのページまでで、本文の表は確かめられていない。6つのモデルの名前や出力例の数字も、コードのページによる。\nマインクラフトは1つの版（Java版1.20.1）だけで確かめている。「一文で戻る」効果が何ポイントだったのかも、要旨には書かれていない。\nそれでも、知っていることと使えることは別だ、という話はわかりやすい。たぶん、人間にもよくある。"}], "quote": {"text": "ゲーム名を告げる評価が測っているのはルールの知識で、どの世界かを選ぶ力ではない（訳）", "who": "論文の要旨より"}, "terms": [{"w": "arXiv", "d": "研究者が論文を、査読（専門家による審査）の前に公開できるインターネット上の論文置き場。物理や数学、AIの分野でよく使われる。"}, {"w": "RuleCraft", "d": "この論文のために作られたテスト。マインクラフトの155のルールについて1,240問の画像問題をそろえ、答えはゲームの中で確かめてある。"}, {"w": "推論", "d": "ここでは、AIが答えを出す前に、途中の考えを文章で書き出しながら考えること。難しい問題で正答率が上がりやすい。"}, {"w": "テラリア", "d": "2011年に出た2Dの冒険・ものづくりゲーム。掘る、建てる、戦うを横から見た世界で楽しむ。"}, {"w": "スターデューバレー", "d": "2016年に出た農場づくりのゲーム。畑を耕し、町の人と付き合いながら暮らす。季節や天気で作物が変わる。"}], "src": [["alphaXiv（論文ページ）", "https://www.alphaxiv.org/abs/2611.28745"], ["GitHub（RuleCraftのコード）", "https://github.com/GaoJianXin05/RuleCraft"]]}, {"topic": "film", "label": "映画", "kicker": "首輪と、やさしすぎる夫婦。", "title": "首輪でつながれた19歳を「いい子」に。『聖なる犯罪者』のヤン・コマサ『HEEL ヒール』、27日公開", "lead": "19歳のトミーは、ある夜、何者かにさらわれる。目を覚ますと、人里はなれた家の地下にいた。首には犬のような首輪。上の階では、穏やかな中年の夫婦と、素直な幼い息子が暮らしている。夫婦は彼をほめたり、罰したりしながら「再教育」していく。いったい、何のために。", "facts": [{"k": "監督", "v": "ヤン・コマサ（『聖なる犯罪者』）"}, {"k": "出演", "v": "スティーヴン・グレアム、アンドレア・ライズボロー、アンソン・ブーン、キット・ラクセン"}, {"k": "公開", "v": "2026年11月27日（金）　新宿ピカデリー、ヒューマントラストシネマ有楽町ほか"}, {"k": "上映時間", "v": "110分　PG12　2025年　ポーランド・イギリス合作（原題 Good Boy）"}, {"k": "配給", "v": "スターキャットアルバトロス・フィルム（提供・宣伝 SUNDAE）"}], "pointsLabel": "ここが見どころ", "points": ["監督は、アカデミー賞の国際長編映画賞の候補になった『聖なる犯罪者』のヤン・コマサ", "夫を演じるのは、ドラマ『アドレセンス』のスティーヴン・グレアム。本人いわく「ねじれた、恐ろしいおとぎ話」", "海外の批評は割れた。「奇妙で、引きこまれる寓話」という声と「吠えるだけで、噛まない」という声"], "blocks": [{"h": "地下室の「再教育」", "body": "トミーはドラッグとパーティーと暴力の毎日を送っている。仲間と別れた直後、彼は誘拐される。\n連れてこられた家には、3人の家族がいる。落ち着いた夫のクリス。心に傷をかかえた妻のキャスリン。そして、おとなしい息子のジョナサン。夫婦はトミーを殴りもするし、ごほうびもくれる。まるで犬のしつけのように。\nタイトルの「ヒール」は、たぶん犬に「脚の横につけ」と言うときの号令だ。原題は『Good Boy』。いい子、そして、よしよし。どちらも犬にかける言葉なのが、少し意地が悪い。"}, {"h": "監督と、3人の役者", "body": "ヤン・コマサはポーランドの監督だ。少年院を出た青年が神父になりすます『聖なる犯罪者』で、アカデミー賞の国際長編映画賞の候補になった。今回は英語の映画で、イギリス北部のヨークシャーで撮った。家の中の場面はワルシャワで撮影している。\nクリスを演じるスティーヴン・グレアムは、この映画を「イギリス訛りのヨーロッパ映画」と呼んだ（訳）。監督については「すばらしい変人」と言い、ときに腹が立つほどめちゃくちゃで、ときに純粋な天才だったと話している（訳）。\n妻はアンドレア・ライズボロー、トミーはアンソン・ブーン。製作には、イエジー・スコリモフスキも名を連ねている。"}, {"h": "おとぎ話の皮をかぶって", "body": "グレアムは、この映画を『ヘンゼルとグレーテル』の語り直しのようだと言った。森の奥の家。やさしい顔をした大人。閉じこめられる子ども。たしかに骨組みは似ている。\nもう1つ、スクリーン誌の記事が引き合いに出すのが『時計じかけのオレンジ』だ。暴力的な若者を、外からの力で「直す」話。ただ、この夫婦がなぜそこまでするのかは、なかなか見えてこない。\nその見えなさが、この映画のいちばんの仕掛けなのだと思う。トミーと同じで、観客も地下室から上の階を見上げることになる。"}, {"h": "評価が割れているところ", "body": "2025年のトロント国際映画祭で初めて上映された。英国の業界誌スクリーンは、わざと奇妙に、注意深く調整された「ネオゴシックの寓話」で、どこか強く引きこまれると書いた（訳）。役者の力と、黒いユーモアをほめている。ただし終盤は息切れするとも。\nハリウッド・リポーターは厳しい。役者はいいが、人物が抽象的すぎて「吠えるだけで、噛まない」と評した（訳）。リトル・ホワイト・ライズも、閉じこめて痛めつける場面が「おそろしく大人しい」と書いている（訳）。\n怖さを期待して行くと、肩すかしかもしれない。気味の悪さを味わう映画だと思ったほうがいい。"}, {"h": "こんな人におすすめ", "body": "『聖なる犯罪者』の、善と悪の境目がぐらぐらする感じが好きだった人。それから『アドレセンス』でスティーヴン・グレアムに驚いた人。今度の彼は、静かで、やさしくて、だからこそ怖い。\n110分。PG12なので、残酷な場面は控えめだ。見終わったあと、「いい子」という言葉が少しだけ違って聞こえるかもしれない。"}], "quote": {"text": "ねじれた、恐ろしいおとぎ話のようなもの（訳）", "who": "スティーヴン・グレアム（Screen Dailyのインタビュー）"}, "terms": [{"w": "聖なる犯罪者", "d": "ヤン・コマサ監督の2019年の映画。少年院を出た青年が小さな村で神父になりすます。アカデミー賞の国際長編映画賞の候補になった。"}, {"w": "アドレセンス", "d": "スティーヴン・グレアムが共同で企画し、父親役で出演したNetflixのドラマ。13歳の少年の事件を、1話ずつ1カットで撮った。"}, {"w": "PG12", "d": "映倫の区分の1つ。12歳未満が見るときは、親などの助言や指導が望ましいとされる。"}, {"w": "時計じかけのオレンジ", "d": "スタンリー・キューブリック監督の1971年の映画。暴力的な若者が、矯正の治療で暴力を嫌うよう作りかえられる。"}], "src": [["映画.com", "https://eiga.com/movie/106884/"], ["ジョルダン映画（キネマ旬報）", "https://movie.jorudan.co.jp/news/kine-latest-20260916-nw-29881c/"], ["Screen Daily（インタビュー）", "https://www.screendaily.com/features/stephen-graham-on-why-good-boy-is-basically-a-european-film-with-british-accents/5208593.article"], ["Screen Daily（批評）", "https://www.screendaily.com/reviews/good-boy-review-stephen-graham-and-andrea-riseborough-anchor-off-kilter-morality-tale/5208642.article"], ["The Hollywood Reporter", "https://www.hollywoodreporter.com/movies/movie-reviews/good-boy-review-stephen-graham-andrea-riseborough-1236360523"], ["Little White Lies", "https://lwlies.com/reviews/the-good-boy"]]}, {"topic": "fashion", "label": "ファッション", "kicker": "冬の手首に、ひとつだけ。", "title": "きょう発売のUOMOは、まるごと時計特集。ブラウンのコートに、手巻きのカーキフィールドを", "lead": "コートを着る季節になると、手首は袖の奥に隠れる。だから時計なんて、と思うかもしれない。でも、改札でICカードをかざすとき。コーヒーを受け取るとき。ちらりと見える一瞬がある。きょう11月25日発売のUOMO1月号は、一冊まるごと時計の特集だ。合言葉は「服との相性がすべて」。", "facts": [{"k": "出発点", "v": "UOMO 2027年1月号（11月25日発売）「ファッションに合う時計」特集"}, {"k": "テーマ", "v": "冬のきれいめに、時計をひとつ"}, {"k": "今日の新顔", "v": "グリーンレーベル リラクシング（ユナイテッドアローズ）、ディエッメ"}, {"k": "予算の目安", "v": "コート・ブーツ・時計の3点で約21万5,000円"}], "pointsLabel": "ここがポイント", "points": ["UOMOの新年号は時計の大特集。「週5時計」や、27本を試着する新作時計フェスが載っている", "コートは4万円を切るメルトンのステンカラー。ダークブラウンなら、黒やグレーより少しやわらかい", "時計は38mmの手巻き。小さめの顔と布のベルトが、ウールの袖口になじむ"], "blocks": [{"h": "UOMOが言う「服との相性」", "body": "きょう発売のUOMO1月号は、表紙が賀来賢人さん。特集は「ファッションに合う時計」を徹底的に深掘りする、というものだ。\n目次には「結局、ファッションとの相性がすべてです」という見出しがある。6人が平日に毎日つける「週5時計」を見せてくれる。27本の新作を実際に腕にのせる「新作時計フェス」もある。\n時計の話というと、つい中の機械や値段の話になる。でも今号はまず服から考える。服が好きな人にはありがたい順番だと思う。"}, {"h": "コートは、ダークブラウンのメルトン", "body": "まずコート。グリーンレーベル リラクシングの「SENTDALE WOOL」シリーズから、ステンカラーコートを選んだ。UOMOでは俳優の上杉柊平さんがこのシリーズを着て、大人の冬アウターの答えの1つとして紹介している。\n色はダークブラウン。ネイビーやチェックもあるけれど、ブラウンは黒の小物とよく合う。価格は39,930円。いいコートが10万円を軽く超える時代に、これは助かる。\n中は、グレーのタートルネックのニットと、グレーかチャコールのウールのスラックス。手持ちのもので十分だ。色をしぼると、手首の時計が小さな句読点のように効いてくる。"}, {"h": "足元は、軽い黒ブーツ", "body": "足元は、RHC ロンハーマンがイタリアのディエッメに別注した黒ブーツ「ROCCIA VET」。UOMOによると、見た目は重厚なのに、履くと驚くほど軽いという。\nアッパーからはロゴを消し、中敷きにだけ「DIEMME RHC」と入れた。素材は撥水スエード、ナッパ（なめらかな革）、ハラコの3つで、すべて黒。価格はスエードとナッパが80,300円、ハラコが83,600円。11月21日に発売された。\nブラウンのコートに黒いブーツ。少し大人っぽすぎるかな、と思うくらいがちょうどいい。"}, {"h": "時計は、38mmの手巻き", "body": "時計はハミルトンの「カーキ フィールド メカニカル」38mm。ハミルトンは、軍用の時計を作ってきた歴史のあるブランドだ。黒い文字盤の、飾りの少ない顔をしている。\n毎日ゼンマイを巻く手巻き式で、ベルトは布のもの。価格は94,600円。同じ時計を金属のブレスレットにすると114,400円になる。\n38mmは、いまの時計としては小さめだ。けれどコートの袖口から見えるのは、ほんの一部。大きすぎないほうが、ちらりと見えたときに品がいい。そう思う。"}, {"h": "こんな人におすすめ", "body": "スマートフォンで時間を見るのに慣れて、時計をしばらくつけていない人。冬は服の色が暗くなりがちなので、手首に1つ小さな道具があるだけで、全体が少しだけ締まる。\nUOMOの特集には、ほかにもたくさんの時計が載っている。本屋で一度めくってから、自分の袖口に合う1本を探すのも楽しいと思う。"}], "quote": {"text": "結局、ファッションとの相性がすべてです", "who": "UOMO 2027年1月号の特集見出し"}, "items": [{"brand": "green label relaxing", "name": "SENTDALE WOOL ステンカラーコート（DK.BROWN）", "price": "39,930円（税込）", "note": "メルトンの端正なステンカラー。S〜XL", "url": "https://mitsui-shopping-park.com/ec/p/1270200047218?mallColor=0402", "linkText": "商品ページを見る", "img": "https://mitsui-shopping-park.com/ec/ecstatic/product/color/1270200047218_0402.jpg"}, {"brand": "DIEMME for RHC", "name": "ROCCIA VET（黒・撥水スエード）", "price": "80,300円", "note": "重厚に見えて軽い黒ブーツ。11/21発売", "url": "https://www.webuomo.jp/fashion/news/2026-11-20-Ut8x-g/", "linkText": "UOMOの記事を見る", "img": "https://img.webuomo.jp/article/sns/image/94/9457dc9a-fa69-4bf6-b00a-563f2807e231-1200x630.jpg"}, {"brand": "HAMILTON", "name": "カーキ フィールド メカニカル 38mm（H69439931）", "price": "94,600円", "note": "手巻き、黒文字盤、布ベルト", "url": "https://www.hamiltonwatch.com/ja-jp/h69439931-khaki-field-mechanical.html", "linkText": "公式ページを見る", "img": "https://www.hamiltonwatch.com/media/catalog/product/cache/6517c62f5899ad6aa0ba23ceb3eeff97/h/6/h69439931.png"}], "picksTitle": "冬の手首に、時計を3つの価格帯で", "picks": [{"tier": "high", "brand": "Cartier", "name": "タンク マスト", "price": "", "note": "一生ものの角形。服を選ばない定番の顔。価格は公式で要確認", "url": "https://precious.jp/articles/-/27799", "img": "https://precious.ismcdn.jp/mwimgs/c/6/1200w/img_c6535fdb5f3c223f9d1a46333a81f09e272218.jpg"}, {"tier": "mid", "brand": "HAMILTON", "name": "カーキ フィールド メカニカル 38mm", "price": "94,600円", "note": "機械式を毎日使う入口。巻く手間ごと楽しむ", "url": "https://www.hamiltonwatch.com/ja-jp/h69439931-khaki-field-mechanical.html", "img": "https://www.hamiltonwatch.com/media/catalog/product/cache/6517c62f5899ad6aa0ba23ceb3eeff97/h/6/h69439931.png"}, {"tier": "fast", "brand": "CASIO × A.P.C.", "name": "AQ-240EAC（シルバー×ダークグリーン）", "price": "13,200円", "note": "1万円台でデザインに払う。電池式で気楽", "url": "https://www.casio.com/us/watches/casio/about/apc_collaboration/apc_vol2/", "img": "https://www.casio.com/content/dam/casio/global/watch/casio-vintage/apc-collaboration-vol2/img/thumb.jpg"}], "look": [{"url": "https://www.webuomo.jp/magazine/", "img": "https://img.webuomo.jp/article/sns/image/23/234789ce-4398-47d2-9814-d1ba58d74289-1200x630.jpg", "site": "UOMO", "title": "【UOMO1月号・11月25日発売】表紙は賀来賢人さん。大特集は、ファッションに合う時計を徹底的に深掘り", "note": "今日の出発点。服から時計を選ぶ考え方"}, {"url": "https://www.webuomo.jp/fashion/topic/2026-11-05-unitedarrows/", "img": "https://img.webuomo.jp/article/sns/image/42/42da3bad-6773-4041-96f2-cd35b9e6e5e0-1200x630.jpg", "site": "UOMO", "title": "上杉柊平が着る、大人の冬アウター最適解。グリーンレーベル リラクシング「セントデールウール」のすべて", "note": "コートの着こなし見本（PR記事）"}], "terms": [{"w": "ステンカラーコート", "d": "後ろの襟が高く、前に向かって低く折れる襟のコート。スーツにも普段着にも合わせやすい。"}, {"w": "メルトン", "d": "織ったウールを縮ませ、表面を起毛させて目を詰めた厚手の生地。風を通しにくく、冬のコートによく使われる。"}, {"w": "手巻き", "d": "リューズを回してゼンマイを巻き、その力で動く機械式時計。電池は使わない。"}, {"w": "別注", "d": "お店がブランドに頼んで、色や素材、仕様を変えたそのお店だけの品を作ってもらうこと。"}, {"w": "ハラコ", "d": "毛が付いたままの牛革。短い毛の光沢と手ざわりが特徴。"}], "src": [["UOMO（1月号）", "https://www.webuomo.jp/magazine/"], ["UOMO（グリーンレーベル リラクシング）", "https://www.webuomo.jp/fashion/topic/2026-11-05-unitedarrows/"], ["&mall（商品ページ）", "https://mitsui-shopping-park.com/ec/p/1270200047218?mallColor=0402"], ["UOMO（ディエッメ別注）", "https://www.webuomo.jp/fashion/news/2026-11-20-Ut8x-g/"], ["ハミルトン公式", "https://www.hamiltonwatch.com/ja-jp/h69439931-khaki-field-mechanical.html"], ["UOMO（カシオ×A.P.C.）", "https://www.webuomo.jp/watch/news/2026-11-13-VBnUWg/"], ["CASIO公式", "https://www.casio.com/us/watches/casio/about/apc_collaboration/apc_vol2/"]]}]}</script>

  document.getElementById('folio-r').textContent=D.date.replace(/-/g,'.');
  document.getElementById('headline').textContent=D.headline;

      if(scroll&&!document.hidden){window.scrollTo({top:e.getBoundingClientRect().top+window.scrollY-60,behavior:'smooth'});}}
    if('mediaSession' in navigator){try{navigator.mediaSession.metadata=new MediaMetadata({title:c.title,artist:(c.secName||'朝のニュース'),album:'朝のニュース '+D.date,
      artwork:[{src:'art/'+(c.sec||'brief')+'.png',sizes:'512x512',type:'image/png'}]});}catch(e){}}
  }
  function setPP(){var p=!au.paused;pp.innerHTML=p?I_PAUSE:I_PLAY;pp.setAttribute('aria-label',p?'一時停止':'再生');}
  function open(){player.hidden=false;document.body.classList.add('listening');}
  function play(){open();au.playbackRate=RATES[rateI];var p=au.play();if(p&&p.catch)p.catch(function(err){meta.hidden=false;meta.textContent='再生できませんでした（'+(err&&err.name||'')+'）。もう一度押してください';});}
  function go(n){n=Math.max(0,Math.min(CH.length-1,n));au.currentTime=CH[n].start+0.01;show(true);}
  au.addEventListener('play',setPP);au.addEventListener('pause',setPP);
  au.addEventListener('timeupdate',function(){show(false);if(Math.floor(au.currentTime)%5===0){try{localStorage.setItem(PK,au.currentTime);}catch(e){}}});
  au.addEventListener('ended',function(){try{localStorage.removeItem(PK);}catch(e){}setPP();});
  au.addEventListener('error',function(){meta.hidden=false;meta.textContent='音声を読み込めませんでした（code '+(au.error&&au.error.code)+'）';});
  document.getElementById('lsn-go').addEventListener('click',function(){
    var s=0;try{s=+localStorage.getItem(PK)||0;}catch(e){}
    if(au.currentTime<1&&s>5)au.currentTime=Math.max(0,s-3);
    play();show(true);
  });
  pp.addEventListener('click',function(){au.paused?play():au.pause();});
  document.getElementById('pl-prev').addEventListener('click',function(){var n=idx(au.currentTime);go(au.currentTime-CH[n].start>3?n:n-1);});
  document.getElementById('pl-next').addEventListener('click',function(){go(idx(au.currentTime)+1);});
  document.getElementById('pl-stop').addEventListener('click',function(){au.pause();player.hidden=true;document.body.classList.remove('listening');if(lastEl)lastEl.classList.remove('speaking');});
  var rb=document.getElementById('pl-rate');
  function setRate(){rb.textContent=RATES[rateI].toFixed(1)+'×';au.playbackRate=RATES[rateI];}
  setRate();
  rb.addEventListener('click',function(){rateI=(rateI+1)%RATES.length;setRate();try{localStorage.setItem('brief-arate',RATES[rateI])}catch(e){}});
  if('mediaSession' in navigator){var ms=navigator.mediaSession;
    try{ms.setActionHandler('play',play);ms.setActionHandler('pause',function(){au.pause();});
      ms.setActionHandler('previoustrack',function(){document.getElementById('pl-prev').click();});
      ms.setActionHandler('nexttrack',function(){document.getElementById('pl-next').click();});
      ms.setActionHandler('seekto',function(e){au.currentTime=e.seekTime;});}catch(e){}}
})();
</script>
</body>

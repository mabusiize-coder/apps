<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="art/brief.png">
<title>朝のニュース</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=Noto+Sans+JP:wght@200;400;500;700;900&display=swap">
<style>
:root{
  color-scheme:light;
  --paper:#FFFFFF; --ink:#141414; --sub:#555; --faint:#999; --rule:#DCDCDC;
  --ic:#FFE03A;                                   /* その日のテーマカラー（JSで日替わり） */
  --ic-t:color-mix(in srgb,var(--ic) 28%,#fff);
  --ic-tt:color-mix(in srgb,var(--ic) 12%,#fff);
  --up:#D23B2F; --down:#1E4FD6;
  --f-en:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-jp:"Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN",system-ui,sans-serif;
  --gut:max(22px,env(safe-area-inset-left,0px));
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(60px + var(--sat))}
:root{--sat:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-jp);font-size:16px;line-height:2;letter-spacing:.04em;-webkit-font-smoothing:antialiased;padding-top:var(--sat);overflow-x:hidden}
[hidden]{display:none!important}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.in{max-width:660px;margin:0 auto;padding-left:var(--gut);padding-right:max(22px,env(safe-area-inset-right,0px))}
h1,h2,h3,.bp{word-break:auto-phrase}
p,.vp,.tx{overflow-wrap:anywhere}
.en{font-family:var(--f-en)}
.chip{display:inline-block;background:var(--ink);color:#fff;font:700 13px/1 var(--f-jp);letter-spacing:.06em;padding:7px 10px 6px}
.chip.ic{background:var(--ic);color:var(--ink)}
.pill{display:inline-block;border:2px solid var(--ink);border-radius:999px;padding:3px 14px 2px;font-weight:700}
.runhead{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--ink);padding:14px 0 8px;font:800 12px/1 var(--f-en);letter-spacing:.06em}
.runhead i{width:10px;height:10px;border:1.5px solid var(--ink);display:inline-block}
.folio{display:grid;grid-template-columns:56px minmax(0,1fr) auto;border:1px solid var(--ink);margin-top:28px;font:500 11px/1 var(--f-en);letter-spacing:.08em}
.folio>*{padding:11px 10px}
.folio>:nth-child(2){border-left:1px solid var(--ink);border-right:1px solid var(--ink);font-family:var(--f-jp);font-weight:700;letter-spacing:.14em}
.folio>:last-child{text-align:right;min-width:56px;white-space:nowrap}

/* ---------- cover ---------- */
.cover{background:var(--ic);padding-bottom:26px}
.cover .runhead{border-color:var(--ink)}
.cv-frame{margin-top:22px;background:#fff;border:2px solid var(--ink);aspect-ratio:10/7;overflow:hidden}
.cv-frame svg{display:block;width:100%;height:100%}
.cv-cap{font-size:10px;text-align:right;margin-top:4px;letter-spacing:.06em}
.cv-k{margin-top:18px;font-weight:700;font-size:13px;letter-spacing:.2em}
.cv-t{display:flex;align-items:center;flex-wrap:wrap;gap:10px 14px;margin:4px 0 0}
.cv-t h1{margin:0;font-weight:900;font-size:clamp(40px,12.4vw,64px);line-height:1.15;letter-spacing:.14em}
.cv-t .pill{font-size:clamp(18px,5vw,24px);letter-spacing:.06em;font-family:var(--f-en);font-weight:800}
.lede{margin:18px 0 0;font-weight:500;font-size:14.5px;line-height:1.95}
.mk{display:grid;grid-template-columns:1fr 1fr;margin-top:22px;border-top:1.5px solid var(--ink);border-left:1.5px solid var(--ink);background:#fff}
.mk>div{min-width:0;padding:10px 12px 12px;border-right:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink)}
.mk .l{font-size:11px;font-weight:700;line-height:1.4}
.mk .v{font:900 25px/1.2 var(--f-en);letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
.mk .c{font-size:11px;line-height:1.4;font-variant-numeric:tabular-nums}
.mk .c.up{color:var(--up)} .mk .c.down{color:var(--down)}

/* listen */
.lsn{margin-top:36px}
.lsn .box{display:flex;align-items:center;gap:14px;border:2px solid var(--ink);padding:12px 12px 12px 18px;position:relative;background:#fff}
.lsn .box::after{content:"";position:absolute;inset:6px -6px -6px 6px;background:var(--ic);z-index:-1;border:2px solid var(--ink)}
.lsn .lt{flex:1;min-width:0;line-height:1.5}
.lsn .lt b{display:block;font-size:15px;font-weight:900}
.lsn .lt span{font-size:12px;color:var(--sub)}
.go{flex:none;display:flex;align-items:center;gap:8px;background:var(--ink);color:#fff;border:0;border-radius:999px;padding:13px 20px;font:700 14px/1 var(--f-jp);letter-spacing:.1em;cursor:pointer}
.go svg{width:12px;height:12px}

/* contents */
.toc{margin-top:64px}
.toc .hd{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:10px}
.toc h2{margin:0;font:900 34px/1 var(--f-en);letter-spacing:-.02em}
.toc ol{list-style:none;margin:0;padding:0}
.toc li a{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;padding:16px 0;border-bottom:1px solid var(--rule);text-decoration:none}
.toc .no{font:900 30px/1 var(--f-en);color:transparent;-webkit-text-stroke:1.5px var(--ink);min-width:48px}
.toc .nm{font-weight:900;font-size:17px;line-height:1.4}
.toc .nm small{display:block;font:700 11px/1.6 var(--f-en);letter-spacing:.12em;text-transform:uppercase;color:var(--sub)}
.toc .ct{font-size:12px;font-weight:700}
.favbtn{margin-top:16px;background:#fff;border:1.5px solid var(--ink);border-radius:999px;padding:8px 16px;font:700 13px/1 var(--f-jp);cursor:pointer}
.favbtn[aria-pressed=true]{background:var(--ink);color:#fff}

/* sticky nav */
.navslot{margin-top:64px;min-height:47px}
.nav{z-index:20;background:#fff;border-bottom:1.5px solid var(--ink)}
.nav.fix{position:fixed;top:0;left:0;right:0;padding-top:var(--sat)}
.nav .in{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-block:9px}
.nav .in::-webkit-scrollbar{display:none}
.nav a{flex:none;text-decoration:none;font:700 12px/1 var(--f-jp);letter-spacing:.06em;padding:8px 12px 7px;border:1.5px solid var(--ink);border-radius:999px}
.nav a.on{background:var(--ic)}
.prog{height:3px;background:var(--ic);width:0;transition:width .15s linear;margin-bottom:-1.5px}

/* ---------- common article parts ---------- */
.ch{padding-top:72px}
.sechead{display:flex;justify-content:flex-end;align-items:stretch;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);padding:10px 0;gap:0}
.sechead .lede2{flex:1;font-size:12px;font-weight:700;line-height:1.7;padding-right:10px}
.sechead .t{display:flex;align-items:flex-start}
.sechead .t span{font:700 12px/1 var(--f-jp);padding:6px 8px 5px;border:1px solid var(--ink)}
.sechead .t span:first-child{background:var(--ic)}
.sechead .t span+span{border-left:0;font-weight:500}
.art{padding-top:48px}
.art h3{margin:10px 0 0;font-weight:900;font-size:clamp(21px,5.8vw,25px);line-height:1.55;letter-spacing:.02em}
.art p{margin:16px 0 0;font-size:15.5px;line-height:2.05}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grp{font-size:12px;font-weight:700;letter-spacing:.08em}
.grp::before{content:"#";color:var(--sub);margin-right:2px}
.tag{display:inline-block;font:800 10px/1 var(--f-en);letter-spacing:.12em;padding:5px 8px 4px;border-radius:99px;vertical-align:4px;margin-left:8px;white-space:nowrap}
.tag.fav{background:var(--ic);border:1.5px solid var(--ink);color:var(--ink)}
.tag.barca{background:#A50044;color:#fff}
.srcs{margin-top:16px;font-size:11.5px;line-height:1.9;color:var(--sub)}
.srcs b{font:800 10px/1 var(--f-en);letter-spacing:.14em;border:1px solid var(--sub);padding:3px 5px 2px;margin-right:8px}
.srcs a{margin-right:10px;text-underline-offset:3px}
.speaking{position:relative}
.speaking::after{content:"♪ NOW READING";position:absolute;right:max(22px,env(safe-area-inset-right,0px));top:20px;font:800 10px/1 var(--f-en);letter-spacing:.12em;background:var(--ic);border:1.5px solid var(--ink);padding:5px 8px 4px}

/* figures */
.fig{margin:28px 0 0;border:1.5px solid var(--ink);padding:16px 16px 14px;background:#fff}
.fig .fl{display:inline-block;transform:translateY(-27px);margin-bottom:-22px;background:var(--ink);color:#fff;font:800 10px/1 var(--f-en);letter-spacing:.14em;padding:5px 8px 4px}
.fig .ft{font-weight:900;font-size:15px;line-height:1.6}
.fig .fn{font-size:11px;color:var(--sub);margin-top:12px;line-height:1.7}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;margin-top:12px}
.stats>div{background:var(--ic-t);padding:12px 12px 11px;min-width:0}
.stats .sv{font:800 32px/1.1 var(--f-en);letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
.stats .sv.up{color:var(--up)} .stats .sv.down{color:var(--down)}
.stats .sl{font-size:11.5px;line-height:1.6;margin-top:6px;font-weight:500}
.bars{margin-top:12px;display:grid;gap:9px}
.bar{display:grid;grid-template-columns:6.5em minmax(0,1fr);align-items:center;gap:10px;font-size:12.5px;line-height:1.4;font-weight:500}
.bar .track{display:flex;align-items:center;gap:8px;min-width:0}
.bar .fill{height:14px;background:#fff;border:1.5px solid var(--ink);flex:none}
.bar.hi .fill{background:var(--ic)}
.bar .bv{font:800 12.5px/1 var(--f-en);white-space:nowrap}
.tl{list-style:none;margin:12px 0 0;padding:0 0 0 14px;border-left:2px dotted var(--ink)}
.tl li{position:relative;padding:6px 0 10px;font-size:13.5px;line-height:1.7}
.tl li::before{content:"";position:absolute;left:-21px;top:12px;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--ink)}
.tl li.hi::before{background:var(--ic)}
.tl .td{display:block;font:800 12px/1.6 var(--f-en)}
.tl li.hi .tx{font-weight:700}

/* two views */
.vw{margin-top:30px;position:relative;border:1.5px solid var(--ink);padding:24px 16px 16px;background:var(--ic-tt)}
.vw .lb{position:absolute;top:-14px;left:12px;transform:rotate(-3deg)}
.vw .vq{font-weight:900;font-size:16px;line-height:1.7}
.vc{margin-top:14px;background:#fff;border:1px solid var(--ink);padding:12px 14px}
.vc .vs{font-weight:900;font-size:13.5px;display:flex;gap:8px;align-items:center}
.vc .vs::before{content:"A";font:900 11px/18px var(--f-en);width:20px;height:20px;text-align:center;border-radius:50%;background:var(--ink);color:#fff;flex:none}
.vc.v1 .vs::before{content:"B";background:var(--ic);color:var(--ink);border:1.5px solid var(--ink);line-height:16px}
.vc .vp{margin:8px 0 0;font-size:13.5px;line-height:1.9}
.vc .vwho{margin-top:8px;font-size:11.5px;font-weight:700;line-height:1.6}
.vc .va{display:inline-block;font-size:11px;color:var(--sub);text-underline-offset:3px}

/* ---------- STYLE: label (WELL-MADE風) ---------- */
.s-label .opn{position:relative;margin-top:30px}
.s-label .tilt{transform:rotate(-4deg);display:inline-block;font:800 18px/1 var(--f-en);letter-spacing:.04em;padding:10px 16px 9px;position:relative;z-index:2;margin-left:-4px}
.s-label .box{background:var(--ic);border:2px solid var(--ink);padding:26px 20px 18px;margin-top:-12px}
.s-label .box h2{overflow:hidden;margin:0;font:900 clamp(40px,12.5vw,60px)/.98 var(--f-en);letter-spacing:-.02em;text-transform:uppercase}
.s-label .box .jp{margin-top:14px;font-weight:700;font-size:13px}
.s-label .cred{border:5px solid var(--ink);padding:10px 14px;margin-top:10px;font:700 12px/1.8 var(--f-en);letter-spacing:.02em}
.s-label .ill{margin-top:22px;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);aspect-ratio:10/6;overflow:hidden;background:var(--ic-tt)}
.s-label .ill svg{display:block;width:100%;height:100%}
.s-label .art.lead p:first-of-type::first-letter{float:left;font-weight:200;font-size:4.3em;line-height:.95;margin:8px 12px 0 -2px;padding:0 2px;background:linear-gradient(transparent 68%,var(--ic) 68%)}
.s-label .art h3{border-bottom:1px solid var(--ink);padding-bottom:10px}
.s-label .art:not(.lead) h3{font-size:19px;border:0;padding:0}
.s-label .art:not(.lead){border-left:3px solid var(--ink);padding-left:14px;margin-left:var(--gut);padding-top:0;margin-top:44px}
@media (min-width:704px){.s-label .art:not(.lead){margin-left:auto;margin-right:auto;max-width:616px}}

/* ---------- STYLE: map（相関図） ---------- */
.s-map .opn h2{margin:22px 0 0;font-weight:900;font-size:clamp(30px,9vw,42px);line-height:1.3;letter-spacing:.06em}
.s-map .opn .sub{font-weight:700;font-size:13px;margin-top:8px}
.map{position:relative;margin-top:22px;background-color:var(--ic-t);background-image:radial-gradient(color-mix(in srgb,var(--ink) 22%,transparent) .8px,transparent 1px);background-size:5px 5px;border:1px solid var(--ink);padding:26px 14px 30px}
.map svg.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.map .node{position:relative;display:block;width:78%;text-decoration:none;margin-top:30px}
.map .node:first-of-type{margin-top:0}
.map .node.r{margin-left:auto}
.map .node .chip{position:relative;z-index:1}
.map .node .nb{display:block;background:#fff;border:1.5px solid var(--ink);padding:10px 12px 10px;margin-top:-3px;font-weight:900;font-size:14.5px;line-height:1.55}
.map .node .nb small{display:block;font-weight:500;font-size:11px;line-height:1.6;color:var(--sub);margin-top:4px}
.map .key{position:absolute;right:12px;bottom:-14px}
.s-map .art .no{display:inline-grid;place-items:center;width:30px;height:30px;background:var(--ink);color:#fff;font:900 13px/1 var(--f-en)}

/* ---------- STYLE: outline（白抜き英字） ---------- */
.s-outline .opn .big{display:flex;align-items:center;gap:10px;margin-top:26px}
.s-outline .opn .big h2{overflow:hidden;min-width:0;padding:0 2px 4px;margin:0;font:900 clamp(54px,17vw,92px)/1 var(--f-en);letter-spacing:-.01em;color:transparent;-webkit-text-stroke:1.5px var(--ink);flex:0 1 auto}
.s-outline .opn .big i{flex:1 0 24px;height:1px;background:var(--ink)}
.s-outline .opn .bp{margin-top:12px;background:var(--ic-t);border:1px solid var(--ink);padding:10px 14px;font-weight:900;font-size:15px;text-align:center}
.s-outline .ill{margin-top:22px;aspect-ratio:10/6;overflow:hidden;background:var(--ic-tt);border:1px solid var(--ink)}
.s-outline .ill svg{display:block;width:100%;height:100%}
.s-outline .art .num{display:flex;align-items:center;gap:10px}
.s-outline .art .num b{font:900 52px/1 var(--f-en);color:transparent;-webkit-text-stroke:1.2px var(--ink);flex:none}
.s-outline .art .num i{flex:1;height:1px;background:var(--ink)}
.s-outline .art h3{background:var(--ic-t);border:1px solid var(--ink);padding:10px 14px;font-size:18px;margin-top:10px}
.s-outline .art.lead h3{font-size:22px}

/* ---------- STYLE: cards（グリッド） ---------- */
.s-cards .opn .hl{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:22px;flex-wrap:wrap}
.s-cards .opn h2{margin:0;font-weight:900;font-size:clamp(28px,8.4vw,40px);line-height:1.35;letter-spacing:.04em}
.s-cards .opn h2 em{font-style:normal;background:linear-gradient(transparent 58%,var(--ic) 58%)}
.s-cards .grid{display:grid;grid-template-columns:1fr;gap:0;margin-top:22px;border-top:1px solid var(--ink)}
.s-cards .art{min-width:0;padding:22px 0 26px;border-bottom:1px solid var(--ink)}
.s-cards .art .th{display:grid;grid-template-columns:38% minmax(0,1fr);gap:14px;align-items:start}
.s-cards .art .th .pic{border:1px solid var(--ink);aspect-ratio:4/3;overflow:hidden;background:var(--ic-tt)}
.s-cards .art .th .pic svg{display:block;width:100%;height:100%}
.s-cards .art h3{overflow-wrap:anywhere;margin:0;font-size:16.5px;line-height:1.6}
.s-cards .art.lead h3{font-size:21px}
.s-cards .art .th .meta{margin-top:6px}
.s-cards .art p{font-size:14px;line-height:1.95;margin-top:12px}
.s-cards .art.lead p{font-size:15.5px}

/* ---------- 特集 ---------- */
.ftr{margin-top:72px}
.ftr .hero{background:var(--ic);border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);padding:22px 0 30px;position:relative;overflow:hidden}
.ftr .hero .bg{position:absolute;right:-12px;bottom:-34px;font:900 clamp(120px,40vw,220px)/1 var(--f-en);letter-spacing:-.04em;color:transparent;-webkit-text-stroke:1.5px color-mix(in srgb,var(--ink) 28%,transparent);pointer-events:none;white-space:nowrap}
.ftr .hero .in{position:relative}
.ftr .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ftr .kick{font-weight:700;font-size:13px;line-height:1.8;margin-top:18px}
.ftr h2{margin:6px 0 0;font-weight:900;font-size:clamp(28px,8.2vw,44px);line-height:1.4;letter-spacing:.03em;word-break:auto-phrase}
.ftr .ld{margin:16px 0 0;font-size:15px;font-weight:500;line-height:2}
.ftr .facts{margin:28px 0 0;border:1.5px solid var(--ink)}
.ftr .facts>div{display:grid;grid-template-columns:6.5em minmax(0,1fr);border-top:1px solid var(--ink);font-size:13px;line-height:1.7}
.ftr .facts>div:first-child{border-top:0}
.ftr .facts dt{background:var(--ic-t);padding:8px 10px;font-weight:700;border-right:1px solid var(--ink)}
.ftr .facts dd{margin:0;padding:8px 12px;overflow-wrap:anywhere}
.ftr .pts{margin:30px 0 0;border:1.5px solid var(--ink);padding:22px 16px 10px;position:relative;background:var(--ic-tt)}
.ftr .pts .lb{position:absolute;top:-14px;left:12px;transform:rotate(-3deg)}
.ftr .pts ol{list-style:none;margin:0;padding:0;counter-reset:p}
.ftr .pts li{counter-increment:p;display:grid;grid-template-columns:34px minmax(0,1fr);gap:8px;padding:8px 0;border-top:1px dotted var(--ink);font-weight:700;font-size:14.5px;line-height:1.8}
.ftr .pts li:first-child{border-top:0}
.ftr .pts li::before{content:counter(p);font:900 26px/1.2 var(--f-en);color:transparent;-webkit-text-stroke:1.2px var(--ink)}
.ftr .blk{margin-top:44px}
.ftr .blk .n{display:flex;align-items:center;gap:10px;font:800 12px/1 var(--f-en);letter-spacing:.14em}
.ftr .blk .n i{flex:1;height:1px;background:var(--ink)}
.ftr .blk h3{margin:10px 0 0;font-weight:900;font-size:clamp(20px,5.6vw,24px);line-height:1.6;word-break:auto-phrase}
.ftr .blk h3 span{background:linear-gradient(transparent 62%,var(--ic) 62%)}
.ftr .blk p{margin:12px 0 0;font-size:15.5px;line-height:2.05}
.ftr .qt{margin:40px 0 0;border-left:6px solid var(--ic);padding:4px 0 4px 16px}
.ftr .qt p{margin:0;font-weight:200;font-size:clamp(20px,5.6vw,26px);line-height:1.75}
.ftr .qt cite{display:block;font-style:normal;font-size:12px;font-weight:700;margin-top:8px}
.ftr .its{margin:36px 0 0;border-top:2px solid var(--ink)}
.ftr .it{display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;padding:14px 0;border-bottom:1px solid var(--ink)}
.ftr .it .ix{font:900 22px/1.3 var(--f-en);color:transparent;-webkit-text-stroke:1.2px var(--ink)}
.ftr .it b{display:block;font-size:15px;line-height:1.6}
.ftr .it .br{font:800 11px/1.6 var(--f-en);letter-spacing:.1em;text-transform:uppercase}
.ftr .it .pr{font:800 13px/1.6 var(--f-en);margin-left:8px}
.ftr .it p{margin:4px 0 0;font-size:13.5px;line-height:1.9}
.ftr .it a{font-size:12px;text-underline-offset:3px}

es-over-energy-shock-tied-to-iran-war/"]}, {"side": "引き締めが必要", "point": "物価の上昇は原油と関係の薄いサービスや医療にまで広がっており、エネルギーだけでは説明できないと指摘した。原油価格がどうなっても解消しない問題で、FRBには信認を取り戻す仕事が残っていると論じる（同じ報道）。", "who": "オースタン・グールズビー（シカゴ連銀総裁）", "src": ["ロイター（WHBL, 11/13）", "https://whbl.com/2026/11/13/us-treasury-chief-says-fed-should-not-hike-rates-over-energy-shock-tied-to-iran-war/"]}]}, "terms": [{"w": "コア", "d": "価格の変動が大きい食品やエネルギーを除いた物価の指標。物価の基調を見るのに使われる。"}]}, {"title": "米軍、ホルムズ海峡のケシム島でイランのミサイル拠点を攻撃", "body": "米軍機は17日、ホルムズ海峡に浮かぶイランのケシム島で、革命防衛隊のミサイル発射拠点を精密誘導弾で攻撃した。米側は、イランによる米軍要員や施設への攻撃に対する自衛だと説明している。イランはバーレーンの米軍レーダーを無人機で攻撃したと発表し、米中央軍は迎撃したとしている。バーレーンが狙われたのは1週間足らずで3回目だ。北海ブレント原油は1バレル93ドル台に上がった。前日まではイラン側の攻撃が続いていたが、今回は米国が反撃に出た。", "src": [["The National", "https://www.thenationalnews.com/news/us/2026/11/17/us-jets-strike-irgc-missile-launch-site-on-irans-qeshm-island-in-self-defence/"], ["WTOC（AP）", "https://www.wtoc.com/2026/11/17/another-wipeout-hits-wall-street-nvidia-other-jittery-ai-stocks-swing-lower/"]], "debate": {"q": "米国の海上封鎖による圧力はイランに効いているか", "views": [{"side": "時間は米国に有利", "point": "経済的な痛みに耐える力は米国のほうが大きく、イランは経済的に追い詰められていくとみる。ただし、封鎖を破るためにイランが湾岸の産油国を攻撃するおそれもあり、双方が引かないこう着が続くと分析した（11/17）。", "who": "タルハ・アブドゥルラザク（英エクセター大学 戦略安全保障研究所 研究員）", "src": ["Al Jazeera（11/17）", "https://www.aljazeera.com/news/2026/11/17/is-the-us-israel-war-on-iran-turning-into-a-frozen-conflict"]}, {"side": "封鎖はもろい", "point": "ホルムズの包囲が続くのは、米国にとってコストが安い間だけだと指摘した。米兵の死者、燃料価格の急騰、高濃縮ウランの移送の兆しのどれかが出れば崩れるとし、査察の再開と封鎖の解除を組み合わせた水面下の取引が現実的な出口だと論じる（同じ記事）。", "who": "ムハナド・セルーム（ドーハ大学院大学 助教）", "src": ["Al Jazeera（11/17）", "https://www.aljazeera.com/news/2026/11/17/is-the-us-israel-war-on-iran-turning-into-a-frozen-conflict"]}]}, "terms": [{"w": "ホルムズ海峡", "d": "ペルシャ湾とオマーン湾を結ぶ海峡。中東産の原油を運ぶタンカーの主要な通り道になっている。"}, {"w": "革命防衛隊", "d": "イランの最高指導者に直属する軍事組織。正規の国軍とは別に置かれている。"}]}, {"group": "AI・テクノロジー", "title": "エヌビディア、フアン氏退任後初の決算で予想超え　次の四半期は1300億ドル見通し", "body": "エヌビディアの8〜10月期の売上高は1158億ドルで、前年同期の約2倍になった。データセンター部門は1076億ドルで、市場予想の約1091億ドルを上回っている。11〜1月期の売上高は1300億ドル（±3%）と予想を超える見通しを示したが、この数字に中国向けのデータセンター用チップは含まれていない。株価は時間外取引で2〜3%上がった。暫定CEOを務めるクレス氏は、次世代の「Vera Rubin」の出だしが好調だと強調している。トップ交代の混乱が続くなかでも、AI需要の強さを数字で示した決算だ。", "src": [["NVIDIA（GlobeNewswire）", "https://www.globenewswire.com/news-release/2026/11/17/3405200/0/en/nvidia-announces-financial-results-for-third-quarter-fiscal-2027.html"], ["24/7 Wall St.", "https://247wallst.com/investing/2026/11/17/nvidias-first-report-without-jensen-huang-115-8-billion-in-revenue-a-130-billion-forecast-and-the-stock-is-up-2-3-after-hours/"], ["CBS News", "https://www.cbsnews.com/news/nvidia-earnings-jensen-huang-colette-kress/"]], "viz": {"type": "stats", "title": "エヌビディア 8〜10月期決算", "items": [{"value": "$115.8B", "label": "売上高（前年同期比+103%）", "dir": "up"}, {"value": "$107.6B", "label": "データセンター部門", "dir": "up"}, {"value": "$130B", "label": "11〜1月期の売上見通し（±3%）", "dir": "up"}], "note": "出典：NVIDIA決算発表、CBS News"}, "debate": {"q": "決算を前に、エヌビディア株は買い場だったのか", "views": [{"side": "悲観が行き過ぎ", "point": "市場はAI需要のピークを2028年とみて、利益率の大幅な低下まで株価に織り込んでいると指摘した。その前提はあまりに厳しすぎるとして、悲観が行き過ぎているとの見方を示した（決算前の11月中旬のコメント）。", "who": "ティム・アーキュリ（UBS 半導体アナリスト）", "src": ["Yahoo Finance（ライブ解説）", "https://finance.yahoo.com/technology/live/nvidia-live-updates-interim-ceo-kress-prepares-for-q3-earnings-with-huang-reportedly-planning-comeback-153114076.html"]}, {"side": "今は買いを勧めにくい", "point": "投資判断を「市場並み」に下げ、目標株価を400ドルから200ドルに半分にした。トップ交代の不透明さなどを踏まえ、今の段階で買いを勧めるのは難しいとの立場だ（決算前の11月中旬）。", "who": "ステーシー・ラスゴン（バーンスタイン アナリスト）", "src": ["Yahoo Finance（ライブ解説）", "https://finance.yahoo.com/technology/live/nvidia-live-updates-interim-ceo-kress-prepares-for-q3-earnings-with-huang-reportedly-planning-comeback-153114076.html"]}]}}, {"group": "AI・テクノロジー", "title": "Anthropic、公開価格は仮条件の上限以上か　申込は6〜7倍", "body": "Anthropicの新規株式公開（IPO）は、17日夕方（米東部時間）に投資家の申込を締め切った。Bloombergは、公開価格が仮条件（70〜78ドル）の上限かそれを上回る見通しだと報じている。申込は募集株数の6〜7倍に達した。新たに出された書類では、上場後にAmazonが約15%、Googleが約14%の株を持つことがわかった。価格は米国時間18日に決まり、19日にナスダックで取引が始まる。AI関連株全体の行方を占う試金石とみられている。", "src": [["The Next Web", "https://thenextweb.com/news/anthropic-ipo-price-top-of-range-amazon-google-stakes-coatue"], ["MarketPulse", "https://www.marketpulse.com/markets/anthropics-ipo-a-make-or-break-test-for-the-trillion-dollar-ai-trade/"]], "debate": {"q": "時価総額1.4兆ドル規模での上場は、長期投資に値するか", "views": [{"side": "長期の成長株として買う", "point": "運用するアルティメーターはIPOで50億ドルを投じる計画で、これは同社の過去最大の投資の5倍にあたる。Anthropicを長く複利で成長し続ける中核銘柄とみているという（11/17の報道）。", "who": "ブラッド・ガースナー（アルティメーター・キャピタル創業者）", "src": ["The Next Web（11/17）", "https://thenextweb.com/news/anthropic-ipo-price-top-of-range-amazon-google-stakes-coatue"]}, {"side": "成長はすでに織り込み済み", "point": "最大1.4兆ドルという評価は厳しい試練に直面すると指摘した。将来の成長の多くはすでに公開価格に織り込まれている可能性があり、申込が多いことは上場後の株価の強さを保証しないと論じる（11/16）。", "who": "ケルビン・ウォン（OANDA MarketPulse シニアマーケットアナリスト）", "src": ["MarketPulse（11/16）", "https://www.marketpulse.com/markets/anthropics-ipo-a-make-or-break-test-for-the-trillion-dollar-ai-trade/"]}]}, "terms": [{"w": "仮条件", "d": "上場の前に示される公開価格の候補の幅。投資家の申込の状況を見て、この幅を目安に価格を決める。"}]}, {"group": "AI・テクノロジー", "title": "OpenAI、新モデル「GPT-6.2 Astra／Sol」　価格を約2割下げて対抗", "body": "OpenAIは17日、難しい専門業務向けの「GPT-6.2 Astra」と日常業務向けの「GPT-6.2 Sol」を公開した。Astraの利用料金は前のモデルより約2割安い。第三者機関Artificial Analysisの総合指数では、AnthropicのClaude Fable 5.2に次ぐ2位だった。一方でOpenAIは、AIが自らを改良する能力について、自社の安全基準で初めて「High」に達したモデルだと公表している。最先端モデルの競争が、性能だけでなくコストと安全性に広がっていることを示す発表だ。", "src": [["The Decoder", "https://the-decoder.com/openai-launches-gpt-6-2-astra-and-sol-with-lower-api-prices-and-some-benchmark-gains/"], ["Artificial Analysis", "https://artificialanalysis.ai/articles/openai-has-the-2-model-in-the-intelligence-index-with-the-release-of-gpt-6-2-astra-and-gpt-6-2-sol"], ["9to5Google", "https://9to5google.com/2026/11/17/openai-releases-gpt-6-2-astra-and-sol-for-complex-projects-a-week-after-claude-5-2/"]], "debate": {"q": "GPT-6.2はOpenAIの巻き返しになるか", "views": [{"side": "癖はあるが実力あり", "point": "試用版は出来にむらがあり、ほかのモデルより扱いにくいと認めた。それでも、野心的なプロジェクトを任せるとやり遂げる力があったと評価している（11/17）。", "who": "イーサン・モリック（ペンシルベニア大学ウォートン校 教授）", "src": ["Implicator.ai（11/17）", "https://www.implicator.ai/openai-gpt-6-2-astra-sol-cost-per-task/"]}, {"side": "期待外れ", "point": "競合のFable 5.2と比べると全体として期待外れの出来だと評した。文章の質は前のモデルより落ち、実際のプログラミングでは途中で止まりやすいと指摘している（11/18）。", "who": "ダン・シッパー（米メディアEvery CEO）", "src": ["OfficeChai（11/18）", "https://officechai.com/ai/gpt-6-2-astra-early-tester-harsh-reviews/"]}]}}]}, {"id": "football", "name": "海外サッカー", "items": [{"title": "ハーランドが96分にPKで決勝点、ノルウェーが逆転でネーションズリーグ8強", "body": "17日、ノルウェーは敵地コペンハーゲンでデンマークに3-2で逆転勝ちした。デンマークはホイルンドとホイビュアの得点で序盤に2点を先行した。ノルウェーはハーランドとウーデゴールの得点で追いつき、後半アディショナルタイム6分にハーランドがPKを決めて勝ち越した。引き分け以上で突破できたデンマークは、勝ち点で並ばれたうえ直接対決で負け越して3位に落ち、入れ替えプレーオフに回る。これで準々決勝に進む8チームが出そろった。", "src": [["ESPN", "https://www.espn.com/soccer/match/_/gameId/401861194"], ["UEFA", "https://www.uefa.com/uefanationsleague/news/02ab-2209792f2fda-6a523d4500bb-1000--nations-league-latest-on-quarter-final-qualification-promotion/"], ["GOAL", "https://www.goal.com/en/news/nations-league-haaland-scores-in-the-96th-minute-norway-reach-the-play-offs-hojlund-scores-ramos-disappoints/bltdbeb21c20a382b5c"]], "viz": {"type": "timeline", "title": "代表ウィーク明けの主な日程", "items": [{"date": "11/20", "text": "ネーションズリーグ準々決勝・入れ替え戦の組み合わせ抽選", "hi": true}, {"date": "11/21", "text": "ニューカッスル対アーセナル"}, {"date": "11/22", "text": "バルセロナ対ビジャレアル（カンプ・ノウ、日本時間22:00）", "hi": true}, {"date": "11/22", "text": "リバプール対マンU（ポチェッティーノ新監督の初陣予定）"}], "note": "出典：UEFA、DAZN、Sky Sports、AOL（日付は現地時間）"}, "terms": [{"w": "アディショナルタイム", "d": "負傷や交代などで止まった時間を補うために、前後半の終わりに足される時間。"}]}, {"title": "バルサ：デ・ヨングはビジャレアル戦に出場見込み、クバルシは様子見", "barca": true, "body": "バルセロナは検査結果を発表した。フレンキー・デ・ヨングは腰の付け根あたりの筋肉の軽い損傷で、すでに通常どおり練習しており、22日のビジャレアル戦に出られる見込みだ。スペイン代表のイングランド戦で前半だけで退いたクバルシは、股関節まわりの筋肉の張りと診断された。復帰の時期は示されず、出場は練習での回復しだいになる。フリック監督にとっては、中盤の主力が戻るめどが立った一方、最終ラインには不安が残る。", "src": [["Yahoo Sports", "https://sports.yahoo.com/articles/mixed-news-jong-cubars-bar-135100979.html"], ["Catalunya Press", "https://www.catalunyapress.es/articulo/deportes/2026-11-17/6094394-cara-cruz-enfermeria-fc-barcelona-comunicado-medico-oficial-sobre-jong-cubarsi"], ["DAZN", "https://www.dazn.com/es-ES/news/futbol/alineacion-barcelona-hoy-once-banquillo-suplentes/1pu8xhq5ywmza1ctxnrwdu4j9s"]]}, {"title": "10人のポルトガル、ウェールズに3-2で勝って首位通過", "body": "すでに8強入りを決めていたポルトガルは、カーディフでウェールズに3-2で勝った。ブルーノ・フェルナンデス、ペドロ・ネト、カルロス・フォルブスが得点し、ネトは後半に2枚目の警告で退場している。最下位のウェールズは入れ替えプレーオフに回る。この期間中に代表を負傷で離れたベルナルド・シウバについては、所属するレアル・マドリードの検査で損傷が見つからなかった。これにポルトガル協会の医師が反論し、クラブと代表のあいだで食い違いが話題になっている。", "src": [["ESPN", "https://www.espn.com/soccer/match/_/gameId/401861189/portugal-wales"], ["101 Great Goals", "https://www.101greatgoals.com/match-reports/wales-2-3-portugal-report-result-goals/"], ["GOAL（スペイン語）", "https://www.goal.com/es/noticias/el-medico-de-portugal-responde-traiciono-bernardo-silva-a-la-seleccion-por-el-real-madrid/blt81e897fcc9dd37f8"]]}, {"title": "マンUはポチェッティーノ体制へ、最下位パレスはフランクを招へい", "body": "マンチェスター・ユナイテッドは、リーグ10試合で1勝と降格圏に沈んだキャリック監督を12日に解任し、米国代表監督のポチェッティーノ氏を後任とすることで合意した。正式発表の時期は媒体によって伝え方が分かれている。同氏は米国代表の試合を終えてから合流し、22日のリバプール戦が初陣になる見込みだ。最下位のクリスタル・パレスも監督を解任し、トーマス・フランク氏を2年半契約で迎えた。", "src": [["Sky Sports", "https://www.skysports.com/football/news/13611745/mauricio-pochettino-manchester-united-agree-two-and-a-half-year-deal-with-usa-manager-to-replace-michael-carrick"], ["GOAL", "https://www.goal.com/en/news/mauricio-pochettino-manchester-united-manager-usmnt-liverpool/bltce123719a1128621"], ["Weekend Argus", "https://weekendargus.co.za/sport/soccer/2026-11-17-palace-appoint-frank-in-quest-for-premier-league-survival/"]]}, {"title": "アーセナル、スビメンディが代表戦で負傷　ニューカッスル戦は微妙", "body": "スペイン代表のスビメンディは15日のイングランド戦で右ハムストリングを痛めて途中交代し、アーセナルは診断結果を待っている。21日にはニューカッスル戦がある。サカも太ももの負傷で12月上旬まで戻れない見込みで、首位争いを続けるチームにとって中盤と前線の主力が同時に欠ける心配が出てきた。", "src": [["Sports Mole", "https://www.sportsmole.co.uk/football/arsenal/injury-news/news/big-blow-mikel-arteta-faces-fresh-arsenal-injury-concern-as-gbp55m-star-limps-off_609190.html"], ["AOL", "https://www.aol.co.uk/articles/zubimendi-tzolis-saka-dowman-arsenal-151720000.html"]]}]}, {"id": "art", "name": "アート", "items": [{"group": "国内", "title": "ポーラ美術館がゴンザレス＝トレス《パーフェクト・ラヴァーズ》を収蔵、12月4日から公開", "body": "箱根のポーラ美術館が、フェリックス・ゴンザレス＝トレスの代表作《「無題」（パーフェクト・ラヴァーズ）》（1987〜90年）を収蔵した。同じ時刻に合わせた2つの掛け時計を並べた作品で、時計は少しずつずれ、やがてどちらかが先に止まる。エイズ危機の時代に、パートナーとの関係を背景に生まれた。12月4日から開催中の「あたらしい目―モネと21世紀のアート」（2027年4月7日まで）で公開される。90年代以降の現代美術を代表する一点が、日本の美術館に入ることになる。", "src": [["美術手帖", "https://bijutsutecho.com/magazine/news/headline/33354"]], "terms": [{"w": "フェリックス・ゴンザレス＝トレス", "d": "キューバ生まれの米国の美術家（1957〜96年）。キャンディや電球など身近な物を使った作品で知られる。"}]}, {"group": "国内", "title": "国立美術館の所蔵作品展が1000円に、専門家が値上げの使い道に懸念", "body": "東京国立近代美術館と国立西洋美術館の所蔵作品展は500円から1000円に、国立工芸館は300円から1000円に、10月から段階的に値上げされている。背景には、展示事業の自己収入の比率を2030年度までに65%以上にするよう求めた文部科学省の目標がある。美術手帖は17日、文化政策の専門家・太下義之氏の見方を掲載した。太下氏は、値上げで得た収入が新しい展示や鑑賞しやすさの改善ではなく、基本的な運営費の穴埋めに回るおそれを指摘している。", "src": [["美術手帖", "https://bijutsutecho.com/magazine/insight/33348"]]}, {"group": "国内", "title": "大阪府の20世紀美術コレクションと子どもの作品を並べる展示、20日開幕", "body": "大阪・中之島のアートエリアB1で、「つくってみようよ展覧会」が11月20日から12月23日まで無料で開かれる。キュレーターは檜山真有さんだ。カルティエ＝ブレッソン、植田正治、田中一光らの大阪府コレクションを、府内の子どもたちやワークショップ参加者の作品と並べる。作品の価値を歴史や値段ではなく「出会いの記憶」から問い直す試みで、来場者が感想を書き込んで完成させる大きなカタログも用意される。", "src": [["美術手帖", "https://bijutsutecho.com/magazine/news/exhibition/33349"]]}, {"group": "国内", "title": "アンドリュー・クランストン、京都・両足院でアジア初の個展（22日まで）", "body": "スコットランドの画家アンドリュー・クランストンが、京都・祇園の禅寺、両足院で個展「Birds, beasts, and flowers」を開いている（22日まで）。寺の室礼に合わせて描いた大型の新作絵画5点と、茶室に置いた木版画3点で構成する。テートなども所蔵する画家の初来日で、ARTnews JAPANが17日にインタビューを載せた。会期は残り数日だ。", "src": [["ARTnews JAPAN", "https://artnewsjapan.com/article/93117"]]}, {"group": "海外", "title": "サザビーズNYの2セールで計3億7870万ドル、草間彌生が自身の最高額を更新", "body": "ニューヨークで16日夜、サザビーズの2つのセールが続けて開かれた。「Now and Contemporary」は手数料込みで約2億6870万ドル、バウム夫妻のコレクションは全24点が売れて約1億1000万ドルとなり、合計は3億7870万ドルだった。草間彌生《No. 3P.B.》（1960年）は約1500万ドルで落札され、作家のオークション最高額を更新した。ただしバウム・コレクションの3分の1は予想の下限を下回っており、買い手の慎重さも目立つ。", "src": [["The Art Newspaper", "https://www.theartnewspaper.com/2026/11/16/yayoi-kusama-sets-15m-auction-record-as-sothebys-opens-new-york-mega-sales"], ["USA Art News", "https://usaartnews.com/auctions/sothebys-november-sales-achieve-3787-million-amid-cautious-bidding/"]], "viz": {"type": "bars", "title": "サザビーズNY 11/16 上位の落札額（手数料込み）", "unit": "", "items": [{"label": "リキテンスタイン", "value": 24.6, "display": "$24.6M"}, {"label": "デ・クーニング", "value": 20.3, "display": "$20.3M"}, {"label": "ジョーン・ミッチェル", "value": 19.3, "display": "$19.3M"}, {"label": "ウォーホル", "value": 18.2, "display": "$18.2M"}, {"label": "ロスコ", "value": 17.7, "display": "$17.7M"}, {"label": "サム・フランシス", "value": 17.1, "display": "$17.1M"}, {"label": "草間彌生", "value": 15.0, "display": "$15.0M", "hi": true}], "note": "出典：The Art Newspaper（媒体によって±0.1Mの差あり）"}}, {"group": "海外", "title": "18日競売のゴッホ（予想約1.8億ドル）に、直前で返還請求", "body": "サザビーズが18日（NY時間）に競売にかけるゴッホ《花咲くマロニエ》（1890年）について、ユダヤ系の出版人サミュエル・フィッシャーの相続人が出品の取り下げを求めた。1936年の売却はナチスの迫害による強制的な売却だったという主張だ。サザビーズは、当時としては高い価格での自発的な売却だったとして、予定どおり出品するとしている。今週最大級の作品が、来歴をめぐる議論を抱えたまま競売にかけられる。", "src": [["ARTnews", "https://www.artnews.com/art-news/news/sothebys-van-gogh-180-million-restitution-claim-1936-sale-1234806093/"], ["ARTnews JAPAN", "https://artnewsjapan.com/article/93281"]]}, {"group": "海外", "title": "安藤忠雄と「もの派」の展覧会、2027年春にヴェネチアで", "body": "ピノー・コレクションのプンタ・デラ・ドガーナ（ヴェネチア）で、「Tadao Ando & Mono-ha. The Five Elements」が2027年3月21日から11月21日まで開かれる。未公開を含む、安藤が自ら撮った建築写真数百点を、同コレクションが所蔵するもの派の作品と並べる。会場そのものが安藤の改修した建物で、素材と空間に向き合う両者の姿勢が建築と呼応する企画になる。", "src": [["美術手帖", "https://bijutsutecho.com/magazine/news/exhibition/33351"]], "terms": [{"w": "ピノー・コレクション", "d": "フランスの実業家フランソワ・ピノーが集めた現代美術のコレクション。ヴェネチアとパリに展示施設を持つ。"}, {"w": "もの派", "d": "1960年代末から70年代の日本の美術の動向。石や木、鉄などをほとんど加工せずに置き、物と空間の関係を問うた。"}]}]}, {"id": "film", "name": "映画", "items": [{"title": "パナヒ監督に禁錮5年超の新判決、カンヌ映画祭が「司法による迫害」と非難", "body": "イランの革命裁判所が、ジャファル・パナヒ監督に禁錮5年1カ月の判決を言い渡した。あわせて2年間の出国とSNSの禁止、財産の没収も命じている。カンヌ映画祭は17日に声明を出し、表現を理由に投獄されるべき芸術家はいないとして、国際社会に行動を求めた。パルムドール受賞作『シンプル・アクシデント』の監督は、亡命を拒んで国内にとどまっている。映画をつくること自体が罪に問われる状況が続いている。", "src": [["Screen Daily", "https://www.screendaily ons/"], ["DutchNews（IDFA）", "https://www.dutchnews.nl/2026/11/whats-on-at-idfa-2026-five-documentaries-to-watch/"]], "terms": [{"w": "IDFA", "d": "アムステルダム国際ドキュメンタリー映画祭。世界最大級のドキュメンタリー映画祭。"}, {"w": "金馬奨", "d": "台湾で開かれる、中国語圏の映画を対象にした映画賞。"}]}, {"title": "東京フィルメックスが20日開幕、原田マハの初監督作がオープニング", "body": "第27回東京フィルメックスが11月20日から29日まで開かれる。オープニングは、小説家の原田マハが自作の短編を自ら脚色し監督した『無用の人』だ。コンペティションは10本で、日本映画は杉田協士の『十月のうた』1本、国際審査員にはリー・カンションが加わる。入江悠監督の初のドキュメンタリー『館長、最後の日』も特別招待で上映される。アジアの作家映画と新しい才能に出会える国内の主要な場だ。", "src": [["Real Sound", "https://realsound.jp/movie/2026/10/post-2559084.html"], ["映画.com", "https://eiga.com/l/Oq2lZ"]]}, {"title": "戦争と報道の記録映画、11月28日に日本公開が重なる", "fav": true, "body": "外国メディアが入れないガザで取材を続けるAFPの記者4人を追った『インサイド・ガザ 封鎖の内側から』（エレーヌ・ラム・トロン監督）が、28日からポレポレ東中野などで順次公開される。同じ日には、ベトナム戦争などを撮った報道写真家・石川文洋を描く『戦場のボヘミアン』も公開される。公開中の『NAZA ナザ』がヨーロッパ映画賞とゴッサム賞の両方で候補になったこともあり、戦争と報道を見つめる作品を続けて観られる時期だ。", "src": [["映画.com", "https://eiga.com/movie/106102/"], ["キネマ旬報（ジョルダン）", "https://movie.jorudan.co.jp/news/kine-latest-20260903-nw-d98316/"]]}, {"title": "新鋭・岩崎裕介のデビュー作『チルド』、12月17日からNetflixで配信", "fav": true, "body": "CMディレクター出身の岩崎裕介が初めて撮った長編で、染谷将太が主演するコンビニを舞台にしたホラーだ。ベルリン映画祭フォーラム部門で国際映画批評家連盟賞を受けている。7月の劇場公開に続き、12月17日からNetflixで世界に配信される。シュールでブラックな感覚を持つ日本の若手が、国際的な評価を経て広く届くことになる。", "src": [["シネマトゥデイ", "https://www.cinematoday.jp/news/N0158012"]]}, {"title": "エニェディ『静かな友人』12月4日公開、トニー・レオンが来日へ", "body": "『心と体と』のイルディコー・エニェディ監督が、2025年のヴェネチアのコンペに出した『静かな友人』が12月4日に公開される。トニー・レオンにとって初めての欧州映画の主演作で、共演のルナ・ベドラーは同映画祭で新人俳優賞を受けた。17日の発表によると、レオンと監督は12月3日から6日にかけて東京と大阪で舞台あいさつをする予定だ。", "src": [["シネマトゥデイ", "https://www.cinematoday.jp/news/N0158015"], ["映画.com", "https://eiga.com/movie/104402/"]]}, {"title": "アダム・ドライバー主演、ジェームズ・グレイ『Paper Tiger』が米限定公開で好発進", "fav": true, "body": "ネオン配給のジェームズ・グレイ監督作『Paper Tiger』が、ニューヨークとロサンゼルスの6スクリーンで公開され、興行収入21.5万ドルを上げた。1スクリーンあたり約3.6万ドルは、グレイ作品で最高とされる。35mmで撮影された大人向けのクライム映画で、ゴッサム賞の作品賞候補にも入っている。カンヌでは評価が割れたが、作家性の強い作品が興行でも健闘している。", "src": [["World of Reel", "https://www.worldofreel.com/blog/2026/11/15/what-did-you-see-this-weekend-ebenezer-paper-tiger-opens-victorian-psycho-how-to-rob-a-bank-wild-horse-nine-goes-wide"]]}, {"title": "カンヌ「ある視点」脚本賞のデビュー作『ピリオン』、12月4日公開", "body": "ハリー・ライトン監督の長編デビュー作で、アレクサンダー・スカルスガルドが支配的なバイク乗り、ハリー・メリングが内気な青年を演じ、2人の主従関係のような恋を描く。2025年のカンヌ「ある視点」部門で脚本賞を受けた。ユーモアと居心地の悪さが同居する新人のデビュー作として注目されている。", "src": [["映画.com", "https://eiga.com/movie/106574/"]], "terms": [{"w": "ある視点", "d": "カンヌ映画祭の公式部門の一つ。独創的な作品や新しい才能を紹介する。"}]}, {"title": "ベルリン銀熊賞のアルゼンチン映画『アニカの伝言』、27日公開", "body": "イバン・フンド監督の『El Mensaje』が、『アニカの伝言』の題で27日からユーロスペースなどで公開される。第75回ベルリン映画祭で審査員賞（銀熊賞）を受けた作品だ。中南米の作家映画を劇場で観られる貴重な機会になる。", "src": [["Real Sound", "https://realsound.jp/movie/2026/09/post-2538327.html"], ["映画.com（公開予定）", "https://eiga.com/coming/"]]}]}], "features": [{"topic": "ai", "label": "AI", "kicker": "AIは働いた。でも研究は進まなかった。", "title": "AIと100分で論文を書く実験、33回の相談で「採用」は1回だけ", "lead": "AIを好きなだけ使っていいから、100分で論文を1本書いてほしい。マイクロソフトの研究者2人が、12人のAI研究者にそう頼んだ。AIはよく働いた。案も文章も次々に出てきた。でも研究はあまり進まなかった。なぜだろう。11月2日にarXivに出たプレプリント（査読前の論文）を読んでみる。", "facts": [{"k": "論文", "v": "We Ran a Research Sprint With AI. The AI Worked. The Research Didn't"}, {"k": "著者", "v": "Anush Sankaran、Arijit Banerjee（Microsoft）"}, {"k": "公開", "v": "2026年11月2日　arXiv（査読前）"}, {"k": "実験", "v": "AI研究者12人（4人×3チーム）、100分、Claude・Claude Code・ChatGPT・Copilotを自由に使用"}], "pointsLabel": "ここが面白い", "points": ["AIへの相談は33回。そのまま採用されたのは1回だけ（3%）。直して採用が5回。残る27回（82%）は、採ったかどうかの記録がない", "3チームとも「AIの出力を読み切れなかった」と振り返った。1チームは、実験の設計でAIを使うのをやめている", "別に走らせた全自動のAIは、論文の下書きを1本書き上げた。その間、人は一度も中身を確かめていない"], "blocks": [{"h": "100分、3チーム、AIは使い放題", "body": "集まったのは社内のAI研究者12人。4人ずつ、3つのチームに分かれた。やることは多い。アイデアを出し、実験を設計し、動かし、分析して、論文に書く。それを100分でやる。段階ごとに締め切りはあるけれど、AIをどう使うか、誰が何を受け持つかは決まっていない。好きにやっていい。\n課題は少しややこしい。「人とAIが一緒に研究するとき、アイデアがどう変わっていったかをどう記録し、抜けをどう見つけるか」。これを実証的な論文にまとめる。各チームには、黙って観察するだけの研究者が1人つく。進行役と批評役もいて、会場には全部で17人がいた。"}, {"h": "つまずき①　作る速さに、読む速さが追いつかない", "body": "AIは休まない。案を出し、文章を書き、また次の案を出す。困ったのは人間のほうだ。読む時間がない。良いのか悪いのか、判断する時間もない。著者はこれを「消費のボトルネック」と呼んでいる。食べきれない量の料理が、次々にテーブルへ運ばれてくるところを想像するとわかりやすい。\nある参加者は「AIが生成した結果を消化して、理解したうえで判断する時間がない」と振り返った。2つのチームは、申し合わせたように同じ言葉を使っている。「吟味せずに突き進んだ」。地味な手間もあった。Claude Codeと共有の作業環境のあいだで、コピー＆ペーストを何度も繰り返す。考えるための時間が、そこで少しずつ削られていった。"}, {"h": "つまずき②　それぞれがAIと閉じこもる", "body": "もう一つのつまずきは、もっと静かに起きる。メンバーがそれぞれ、自分のAIとのやり取りに入り込んでしまうのだ。チームで決めるはずのことが、いつの間にか一人とAIのあいだで決まっている。著者の言葉では「AIが生む研究のサイロ」。サイロというのは、中身が外とつながらない縦長の貯蔵庫のことだ。\nあるチームでは、Claudeが下書きした仮説のまとめに略語が多すぎて、ほかのメンバーがついていけなかった。別のチームでは、データセットを選んでいる人をただ待つ時間ができた。最初の10分で、研究の問いそのものがいつの間にかClaudeに委ねられていた例も記録されている。"}, {"h": "処方箋は「人→AI→人」", "body": "ではどうすればいいのか。著者の答えはわりに素朴だ。AIが出したものは、必ず人から人へ手渡して確かめる。「Human-AI-Human」という名前がついている。\n最低限やるべきことは2つある。まず、全員が同じ文脈を見られる共有の場をつくること。それから、チーム全員で評価する時間を、最初から工程に入れておくこと。\nほかにも、採ったか捨てたかをチームから見える形で残す、誰が決めたかをあとで追えるようにする、といった項目を含む7つの設計要件が挙げられている。著者はこれを正解としてではなく、これから検証できる仮説として示している。"}, {"h": "ただし、割り引いて読む", "body": "この論文には、割り引いて読むべきところがいくつかある。なにしろ1回きり、1社、12人、100分の小さな試みだ。著者自身も「時間の制約や進め方の影響と、AIそのものの影響は切り分けられない」と認めている。82%という数字も、評価しなかった証拠ではない。記録が残っていなかった、というだけのことだ。できあがった論文の質も採点されていない。\nだから結論として読むより、これから確かめるべき仮説のリストとして読むのがいいと思う。それでも、一人ひとりが速くなることと、チームの研究が良くなることは別の話だ、という指摘には説得力がある。AIを仕事で使っている人なら、たぶん思い当たるところがあるはずだ。"}], "quote": {"text": "個人の生産性が上がっても、チームの研究が良くなるとは限らない。", "who": "論文の要旨より（訳）"}, "src": [["arXiv 2611.03946", "https://arxiv.org/abs/2611.03946"], ["全文（HTML）", "https://arxiv.org/html/2611.03946"]], "terms": [{"w": "arXiv", "d": "研究者が査読前の論文を公開するオンラインの保管庫。物理、数学、計算機科学の論文が多い。"}, {"w": "Claude Code", "d": "Anthropicが提供する、AIがコードの作成や編集を手伝う開発者向けのツール。"}]}]}</script>

  function redraw(){fitAll();afters.forEach(function(f){f();});}
  redraw();window.addEventListener('resize',redraw);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(redraw);

  if(favN){
    var fb=document.getElementById('favbtn');fb.hidden=false;fb.textContent='★ 好みの記事だけ表示（'+favN+'）';

  }

  var selT=0;
  document.addEventListener('selectionchange',function(){clearTimeout(selT);selT=setTimeout(function(){
    var sel=window.getSelection(),tx=sel&&!sel.isCollapsed?String(sel).replace(/\s+/g,' ').trim():'';
    var an=sel&&sel.anchorNode,ae=an&&(an.nodeType===1?an:an.parentNode);
    if(!tx||tx.length>80||!ae||!ae.closest('#main')){selask.hidden=true;return;}
    selask.querySelector('b').textContent=tx;selask.href=askWord(tx,ctxOf(an));
    var pl=document.getElementById('player');if(pl&&!pl.hidden)document.body.style.setProperty('--plh',pl.offsetHeight+'px');
    tmClose();selask.hidden=false;},350);});
  var links=[].slice.call(nav.querySelectorAll('a')),prog=document.getElementById('prog');
  /* ジャンルのタブ：sticky はホーム画面アプリで効かないことがあるので、通り過ぎたら fixed に切り替える */
  var slot=document.getElementById('navslot'),bar=slot.firstElementChild,rt=document.documentElement;
  (function(){var pb=document.createElement('div');pb.style.cssText='position:fixed;top:0;left:0;width:0;height:env(safe-area-inset-top,0px);visibility:hidden';document.body.appendChild(pb);var sa=pb.offsetHeight;pb.remove();
    var alone=window.navigator.standalone===true||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches);
    if(alone&&!sa&&window.innerHeight>=screen.height-1)rt.style.setProperty('--sat','54px');})();
  function sat(){return parseFloat(getComputedStyle(document.body).paddingTop)||0;}
  function onScroll(){
    var fx=slot.getBoundingClientRect().top<=sat();
    if(fx!==bar.classList.contains('fix')){if(fx)slot.style.height=slot.offsetHeight+'px';bar.classList.toggle('fix',fx);if(!fx)slot.style.height='';}
    var y=window.scrollY+90,cur=null;
    document.querySelectorAll('.ch').forEach(function(ch){if(!ch.hidden&&ch.offsetTop<=y)cur=ch.id;});
    links.forEach(function(a){var on=a.getAttribute('href')==='#'+cur;if(on&&!a.classList.contains('on'))a.scrollIntoView({inline:'center',block:'nearest'});a.classList.toggle('on',on);});
    var h=document.documentElement.scrollHeight-window.innerHeight;prog.style.width=(h>0?Math.min(100,window.scrollY/h*100):0)+'%';
  }
  window.addEventListener('scroll',onScroll,{passive:true});onScroll();
})();
</script>

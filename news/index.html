<style>
/* Layout: a newspaper "visual special" — dark masthead band, then one full-bleed chapter per genre: big Mincho opener, a lead story set large, the rest as a tappable index */
:root{
  --paper:#F5F6F8; --sheet:#FFFFFF; --ink:#111418; --sub:#4E5864; --faint:#8A94A0; --rule:#DADFE5;
  --night:#0C1016; --night-ink:#F2F4F7; --night-sub:#9AA6B4; --night-rule:#2A323D;
  --pol:#2D4F95; --foot:#127A55; --art:#AE2E69; --film:#9C6406;
  --up:#C8372D; --down:#2763AD; --fav:#C9461C; --barca:#A50044; --onacc:#FFFFFF; --barc:#C9D0D9;
  --f-mincho:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F1318; --sheet:#161B22; --ink:#E8ECF0; --sub:#A7B1BC; --faint:#6F7A86; --rule:#28303A;
  --night:#06080B; --night-rule:#222A34;
  --pol:#8EAEEB; --foot:#5ACB98; --art:#EC86B8; --film:#E9B45A;
  --up:#F27F72; --down:#7FB0EC; --fav:#F2915F; --barca:#E85A90; --onacc:#0C1016; --barc:#3A4451; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F1318; --sheet:#161B22; --ink:#E8ECF0; --sub:#A7B1BC; --faint:#6F7A86; --rule:#28303A;
  --night:#06080B; --night-rule:#222A34;
  --pol:#8EAEEB; --foot:#5ACB98; --art:#EC86B8; --film:#E9B45A;
  --up:#F27F72; --down:#7FB0EC; --fav:#F2915F; --barca:#E85A90; --onacc:#0C1016; --barc:#3A4451; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.8;-webkit-text-size-adjust:100%;word-break:auto-phrase}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--night)}
a{color:inherit}
:focus-visible{outline:2px solid var(--fav);outline-offset:3px;border-radius:4px}
.in{max-width:680px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}

/* masthead */
.mast{background:var(--night);color:var(--night-ink)}
.mast .in{padding-block:28px 0}
.mrow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;color:var(--night-sub);text-transform:uppercase}
.bigdate{font-family:var(--f-mincho);font-weight:800;font-size:clamp(76px,24vw,128px);line-height:.9;letter-spacing:-.03em;margin-top:18px;font-variant-numeric:tabular-nums}
.bigdate .dot{color:var(--fav)}
.dow{font-family:var(--f-mincho);font-weight:600;font-size:18px;margin-top:10px;color:var(--night-sub)}
.lede{font-family:var(--f-mincho);font-weight:800;font-size:clamp(23px,6.2vw,30px);line-height:1.55;margin:26px 0 0;letter-spacing:.01em}
.mk{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:30px;border-top:1px solid var(--night-rule)}
.mk>div{padding:14px 10px 18px 0;min-width:0}
.mk>div+div{padding-left:12px;border-left:1px solid var(--night-rule)}
.mk .l{font-size:11px;color:var(--night-sub);letter-spacing:.06em}
.mk .v{font-family:var(--f-mono);font-size:17px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.5}
.mk .c{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}
.mk .up{color:#FF8A7E} .mk .down{color:#8DB9F2} .mk .flat{color:var(--night-sub)}
@media (max-width:460px){.mk{grid-template-columns:repeat(2,minmax(0,1fr))}.mk>div:nth-child(3){padding-left:0;border-left:0}.mk>div:nth-child(n+3){border-top:1px solid var(--night-rule)}}

/* sticky chapter nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--night);border-bottom:1px solid var(--night-rule)}
.nav .in{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-block:0}
.nav .in::-webkit-scrollbar{display:none}
.nav a,.nav button{flex:none;display:flex;align-items:center;gap:6px;color:var(--night-sub);text-decoration:none;font:500 13px/1 var(--f-body);padding:14px 10px;border:0;background:none;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.nav a.on{color:var(--night-ink);border-bottom-color:var(--c)}
.nav a .sw{width:7px;height:7px;border-radius:50%;background:var(--c)}
.nav button[aria-pressed="true"]{color:var(--onacc);background:var(--fav);border-radius:999px;padding:7px 12px;margin-block:7px}
.prog{position:absolute;left:0;bottom:-1px;height:2px;background:var(--night-ink);opacity:.5;width:0}

/* chapters */
.ch{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 46px)}
.opener{border-top:6px solid var(--c);background:var(--sheet)}
.opener .in{padding-block:36px 8px}
.en{font-family:var(--f-mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--c)}
.opener h2{font-family:var(--f-mincho);font-weight:800;font-size:clamp(40px,12vw,60px);line-height:1.15;margin:6px 0 0;letter-spacing:.02em}
.opener .meta{font-size:13px;color:var(--sub);margin-top:6px}

.lead{background:var(--sheet)}
.lead .in{padding-block:18px 34px}
.lead h3{font-family:var(--f-mincho);font-weight:800;font-size:clamp(23px,6vw,28px);line-height:1.5;margin:0}
.lead p{font-size:16.5px;line-height:1.95;margin:14px 0 0;color:var(--ink);max-width:60ch}

.idx{background:var(--paper)}
.idx .in{padding-block:8px 44px}
.grp{font-family:var(--f-body);font-weight:700;font-size:12px;letter-spacing:.14em;color:var(--c);margin:26px 0 4px;display:flex;align-items:center;gap:10px}
.grp::after{content:"";flex:1;height:1px;background:var(--rule)}
.item{border-bottom:1px solid var(--rule)}
.item summary{list-style:none;cursor:pointer;display:flex;gap:14px;align-items:flex-start;padding-block:16px}
.item summary::-webkit-details-marker{display:none}
.item .t{flex:1;min-width:0;font-weight:700;font-size:16.5px;line-height:1.6}
.pm{flex:none;width:22px;height:22px;margin-top:2px;border-radius:50%;border:1px solid var(--rule);position:relative}
.pm::before,.pm::after{content:"";position:absolute;left:50%;top:50%;width:9px;height:1.5px;background:var(--sub);transform:translate(-50%,-50%)}
.pm::after{transform:translate(-50%,-50%) rotate(90deg);transition:transform .2s}
.item[open] .pm::after{transform:translate(-50%,-50%) rotate(0deg)}
.item .b{padding-bottom:18px}
.item .b p{margin:0;font-size:15.5px;line-height:1.9;color:var(--ink);max-width:60ch}

.tag{display:inline-block;font:500 10px/1 var(--f-mono);letter-spacing:.06em;padding:4px 6px 3px;border-radius:3px;margin-left:8px;vertical-align:3px;color:var(--onacc);white-space:nowrap}
.tag.fav{background:var(--fav)} .tag.barca{background:var(--barca)}
.srcs{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:12.5px}
.srcs a{color:var(--c);text-decoration:none;border-bottom:1px solid currentColor;padding-bottom:1px}
.srcs a::after{content:" ↗";color:var(--faint)}
.srcs span{color:var(--faint);font-family:var(--f-mono);font-size:10px;letter-spacing:.12em}

.foot{background:var(--night);color:var(--night-sub);font-size:12px;line-height:1.8}
.foot .in{padding-block:32px 40px}
.foot b{color:var(--night-ink);font-family:var(--f-mincho);font-size:16px;display:block;margin-bottom:6px}

/* illustrations & figures */
.mast{position:relative;overflow:hidden}
.sun{position:absolute;right:-60px;top:-40px;width:300px;height:300px;color:var(--fav);opacity:.9;pointer-events:none}
.mast .in{position:relative}
.otop{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.illo{width:clamp(92px,26vw,132px);height:auto;color:var(--c);display:block;flex:none}
.fig{margin:22px 0 0;padding:18px 16px 14px;background:var(--paper);border-radius:10px}
.idx .fig{background:var(--sheet)}
.fig .fl{font-family:var(--f-mono);font-size:10px;letter-spacing:.16em;color:var(--c);text-transform:uppercase}

.fig .fn{font-size:11.5px;color:var(--faint);margin-top:10px;line-height:1.6}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:14px;margin-top:12px}
.stats .sv{font-family:var(--f-mincho);font-weight:800;font-size:clamp(30px,9vw,40px);line-height:1.1;font-variant-numeric:tabular-nums}
.stats .sv.up{color:var(--up)} .stats .sv.down{color:var(--down)}
.stats .sl{font-size:12.5px;color:var(--sub);line-height:1.5;margin-top:4px}
.bars{display:grid;gap:9px;margin-top:12px}
.bar{display:grid;grid-template-columns:minmax(0,7.5em) minmax(0,1fr);gap:10px;align-items:center;font-size:12.5px}
.bar .bl{color:var(--sub);line-height:1.35;overflow-wrap:anywhere}
.bar .track{display:flex;align-items:center;gap:8px;min-width:0}
.bar .fill{height:14px;border-radius:0 3px 3px 0;background:var(--barc);flex:none;min-width:2px}
.bar.hi .fill{background:var(--c)} .bar.hi .bl{color:var(--ink);font-weight:700}
.bar .bv{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tl{list-style:none;margin:14px 0 0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:5px;top:8px;bottom:8px;width:1.5px;background:var(--rule)}
.tl li{position:relative;padding-left:26px;display:grid;grid-template-columns:4.2em minmax(0,1fr);gap:10px;padding-block:6px;font-size:14px;line-height:1.55}
.tl li::before{content:"";position:absolute;left:0;top:12px;width:12px;height:12px;border-radius:50%;background:var(--sheet);border:2px solid var(--c);box-sizing:border-box}
.tl li.hi::before{background:var(--c)}
.tl .td{font-family:var(--f-mono);font-size:12.5px;color:var(--c);font-weight:500;padding-top:1px}
.tl li.hi .tx{font-weight:700}
/* debate: two opposing views */
:root{--v0:#A8512A;--v1:#2C6A87}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--v0:#EE9B72;--v1:#7DBCDB}}
:root[data-theme="dark"]{--v0:#EE9B72;--v1:#7DBCDB}
.vw{margin:22px 0 0;border-top:1px solid var(--rule);padding-top:14px}
.vl{font-family:var(--f-mono);font-size:10px;letter-spacing:.16em;color:var(--c);text-transform:uppercase}
.vq{font-weight:700;font-size:14.5px;line-height:1.5;margin-top:2px}
.vg{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin-top:10px}
.vc{background:var(--paper);border-radius:10px;padding:14px 14px 12px;border-top:3px solid var(--va);min-width:0}
.idx .vc{background:var(--sheet)}
.vc.v0{--va:var(--v0)} .vc.v1{--va:var(--v1)}
.vs{font-weight:700;font-size:13px;color:var(--va);letter-spacing:.04em}
.vc p.vp{margin:6px 0 0;font-size:14.5px;line-height:1.8;color:var(--ink)}
.vwho{font-size:12px;color:var(--sub);margin-top:8px;line-height:1.5}
.va{display:inline-block;font-size:12px;color:var(--va);text-decoration:none;border-bottom:1px solid currentColor;margin-top:6px}
.va::after{content:" ↗";color:var(--faint)}
@media (prefers-reduced-motion:reduce){.pm::after{transition:none}}
/* home-screen install guide */
.inst{background:var(--night);color:var(--night-ink);border-top:1px solid var(--night-rule)}
.inst .in{padding-block:16px 18px;display:grid;gap:10px}
.inst .ih{display:flex;justify-content:space-between;align-items:center;gap:12px}
.inst b{font-family:var(--f-mincho);font-size:16px}
.inst .x{flex:none;font:500 12px/1 var(--f-body);color:var(--night-sub);background:none;border:1px solid var(--night-rule);border-radius:999px;padding:7px 12px;cursor:pointer}
.inst ol{margin:0;padding:0;list-style:none;display:grid;gap:8px;font-size:13.5px;line-height:1.6;color:var(--night-sub)}
.inst ol li{display:grid;grid-template-columns:5.5em minmax(0,1fr);gap:8px}
.inst ol li span:first-child{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;color:var(--fav);padding-top:2px}
.inst .k{color:var(--night-ink);font-weight:700}
.inst .nt{font-size:12px;color:var(--night-sub);line-height:1.6}
.again{background:none;border:0;color:var(--night-sub);font:inherit;text-decoration:underline;cursor:pointer;padding:0;margin-top:6px}

/* listen: read-aloud player */
.lsn{background:var(--night);border-top:1px solid var(--night-rule)}
.lsn .in{padding-block:14px 16px;display:flex;align-items:center;gap:14px}
.lsn .lt{flex:1;min-width:0;color:var(--night-sub);font-size:13px;line-height:1.5}
.lsn .lt b{display:block;color:var(--night-ink);font-family:var(--f-mincho);font-size:17px}
.lsn .go{flex:none;display:flex;align-items:center;gap:8px;background:var(--fav);color:var(--onacc);border:0;border-radius:999px;padding:11px 18px;font:700 14px/1 var(--f-body);cursor:pointer}
.lsn .go svg{width:14px;height:14px}
.player{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--night);color:var(--night-ink);border-top:1px solid var(--night-rule);padding-bottom:env(safe-area-inset-bottom,0px)}
.player .in{padding-block:10px 12px;display:grid;gap:8px}
.pl-now{display:flex;gap:10px;align-items:baseline;min-width:0}
.pl-sec{flex:none;font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--pc,var(--night-sub))}
.pl-ttl{flex:1;min-width:0;font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-pos{flex:none;font-family:var(--f-mono);font-size:11px;color:var(--night-sub);font-variant-numeric:tabular-nums}
.pl-bar{height:3px;background:var(--night-rule);border-radius:2px;overflow:hidden}
.pl-bar i{display:block;height:100%;width:0;background:var(--fav);transition:width .3s}
.pl-ctl{display:flex;align-items:center;gap:8px}
.pl-ctl button{display:grid;place-items:center;background:none;border:1px solid var(--night-rule);color:var(--night-ink);border-radius:999px;width:42px;height:42px;cursor:pointer;flex:none}
.pl-ctl button svg{width:16px;height:16px}
.pl-ctl .pp{width:52px;height:52px;background:var(--fav);border-color:var(--fav);color:var(--onacc)}
.pl-ctl .pp svg{width:20px;height:20px}
.pl-ctl .rate{width:auto;padding:0 12px;font:500 12px/1 var(--f-mono);height:34px}
.pl-ctl .sp{flex:1}
.pl-ctl .x{width:auto;height:34px;padding:0 12px;font:500 12px/1 var(--f-body);color:var(--night-sub)}
.pl-note{font-size:11.5px;color:var(--night-sub);line-height:1.5}
body.listening .foot .in{padding-bottom:190px}
.speaking{box-shadow:inset 4px 0 0 var(--c)}
@media (prefers-reduced-motion:reduce){.pl-bar i{transition:none}}

/* desktop: wider sheet, larger type, two-column masthead and story index */

<script type="application/json" id="news-data">{"date": "2026-11-18", "weekday": "水", "headline": "クアッド首脳がマニラで2年ぶりに会合し、エヌビディアは売上高1158億ドルで予想を上回る。米国の利上げ観測とAI不安で日米の株価は続落し、日経平均は5万8860円。ハーランドの96分の決勝弾でノルウェーが8強入りし、パナヒ監督への新たな判決にカンヌが抗議。", "markets": [{"label": "日経平均", "value": "58,860", "change": "−802（17日終値）", "dir": "down"}, {"label": "ドル円", "value": "159.12円", "change": "17日NY終値", "dir": "flat"}, {"label": "NYダウ（17日）", "value": "50,759", "change": "−849ドル（−1.6%）", "dir": "down"}, {"label": "米10年債", "value": "5.10%", "change": "−0.02（引け前）", "dir": "down"}], "sections": [{"id": "politics", "name": "政治・経済", "items": [{"title": "クアッド首脳会合、2年ぶりにマニラで開催　海洋監視と重要鉱物で合意", "body": "17日、トランプ大統領、モディ首相、アルバニージー首相、高市首相の4人がASEAN関連会議に合わせてマニラで会合を開いた。共同文書は中国を名指ししなかった。そのうえで、力や威圧で現状を変えることに反対し、恣意的な輸出規制などの「経済的威圧」に深い懸念を示した。具体策として、海洋監視協力の新設、4カ国の哨戒機による2027年の共同演習、重要鉱物の供給網に関する協定を打ち出している。トランプ氏にとって初めてのクアッド会合で、米印の関税摩擦で止まっていた枠組みが動き出した。高市首相とトランプ氏も会場で短く懇談した。", "src": [["ホワイトハウス", "https://www.whitehouse.gov/briefings-statements/2026/11/quad-leaders-summit-joint-press-release/"], ["Al Jazeera", "https://www.aljazeera.com/news/2026/11/17/trump-announces-critical-minerals-agreements-at-quad-meeting-in-manila"], ["神奈川新聞（共同）", "https://www.kanaloco.jp/news/government/article-1321475.html"]], "debate": {"q": "クアッドは実務で成果を出せる枠組みか、構造的な限界を抱えた集まりか", "views": [{"side": "実務で成果を出せる", "point": "会合が続いていること自体が枠組みの存続を示しており、海洋状況把握などの初期成果からも実務的な結果を出せると評価した。分野を絞って焦点を定めれば、具体的な利益を生みやすくなるとみる（2026年5月の外相会合の分析）。", "who": "アクリティ・ヴァスデヴァ・カリヤンカル（スティムソン・センター フェロー）", "src": ["Stimson Center（2026年5月）", "https://www.stimson.org/2026/takeaways-from-the-quad-foreign-ministers-meeting/"]}, {"side": "構造的な限界がある", "point": "弱点の原因は特定の政権ではなく構造にあり、各国の利害がずれているうえ、特にインドは戦略的な自律を重んじると指摘した。発表と実績の差が続いているので、過去の約束の実行状況を点検する仕組みが必要だと論じる（同じく2026年5月）。", "who": "ケリー・グリエコ（スティムソン・センター シニアフェロー）", "src": ["Stimson Center（2026年5月）", "https://www.stimson.org/2026/takeaways-from-the-quad-foreign-ministers-meeting/"]}]}}, {"title": "高市首相、初の訪中でAPEC深圳へ　日中首脳会談は見通せず", "body": "高市首相はマニラから中国・深圳に移り、18日に始まるAPEC首脳会議に出席する。就任後初めての訪中で、19日に帰国する予定だ。首相が国会で台湾有事に触れて以降、中国は貿易制限や渡航への注意喚起で対抗しており、日中関係は大きく冷え込んでいる。習近平主席との正式な会談の調整は難航していると伝えられ、短い接触にとどまるかどうかが焦点だ。", "src": [["NHK", "https://news.web.nhk/newsweb/na/nd-20261118de77459"], ["nippon.com（時事）", "https://www.nippon.com/ja/articles/-/57367"], ["China-Global South Project（AFP）", "https://chinaglobalsouth.com/analysis/takaichi-xi-meeting-apec-china-japan-taiwan/"]], "debate": {"q": "日中関係を動かす「次の一手」は日本と中国のどちらが打つべきか", "views": [{"side": "日本の歩み寄りが前提", "point": "日本が謝罪に近いシグナルを出さないかぎり、習氏が会談に応じる可能性は極めて低いとみる。中国は自国の懸念に日本が応じるまで、どの問題でも関与しない姿勢だと分析した（11/16のAFP報道でのコメント）。", "who": "ボニー・グレーザー（ジャーマン・マーシャル・ファンド インド太平洋プログラム）", "src": ["AFP（China-Global South Project, 11/16）", "https://chinaglobalsouth.com/analysis/takaichi-xi-meeting-apec-china-japan-taiwan/"]}, {"side": "軟化を迫られているのは中国", "point": "中国の態度がやわらいできたのは、日本企業の撤退などで経済的な打撃を受けたためで、強硬路線は目的を果たせていないとみる。高市首相の応答を引き出すには、拘束中の日本人の解放など中国がよりはっきりした行動を示す必要があると論じた（同じ報道）。", "who": "高原明生（東京女子大学 特任教授）", "src": ["AFP（China-Global South Project, 11/16）", "https://chinaglobalsouth.com/analysis/takaichi-xi-meeting-apec-china-japan-taiwan/"]}]}}, {"title": "19日に初の米中ロ首脳会談　「新ヤルタ」への警戒も", "body": "中国外務省は、習主席、トランプ大統領、プーチン大統領による初めての3カ国首脳会談を19日に深圳で開くと発表した。議題は公表されていない。米国は核軍備管理への中国の参加を重視しており、新START条約は2026年2月に失効している。ロシアはウクライナと欧州の安全保障を議題にしたい考えだ。大国が頭越しに勢力圏を取引することへの懸念が、ウクライナ、台湾、欧州で広がっている。トランプ氏がアジアで何を約束するかは、日本にとっても重い意味を持つ。", "src": [["Tribune India", "https://www.tribuneindia.com/news/world/china-confirms-first-xi-trump-putin-summit-on-november-19/"], ["Al-Monitor（ロイター）", "https://www.al-monitor.com/originals/2026/11/analysis-new-yalta-trump-and-putin-push-meeting-xi-wary-hosting"]], "debate": {"q": "米中ロ3首脳の会談は世界を安定させるか", "views": [{"side": "米国に不利でリスクが大きい", "point": "米国にとっては得るものより、悪い方向に転ぶリスクのほうが大きいとみる。ウクライナでも3カ国の軍備管理でも、突破口は期待しにくいと論じた（11/12の論考）。", "who": "ライアン・ハス（ブルッキングス研究所）", "src": ["Brookings（11/12）", "https://www.brookings.edu/articles/trump-xi-and-putin-what-to-expect-from-the-apec-summit/"]}, {"side": "直接対話には意味がある", "point": "ウクライナや軍備管理がすぐに解決するわけではないが、首脳が直接会えば緊張が激化するリスクを下げられると主張した。エネルギーや供給網での協力にも利点があるとし、中国が大国による世界の分割を認めないことを条件に支持した（10月5日の社説）。", "who": "The Standard（香港の英字紙）社説", "src": ["The Standard（10/5）", "https://www.thestandard.com.hk/editorial/article/344570/The-Shenzhen-tripartite-proposition-optical-power-strategic-realism-and-global-stability"]}]}}, {"title": "米連銀総裁「春までに複数回の利上げ」　ダウ849ドル安、日経平均も続落", "body": "セントルイス連銀のムサレム総裁は17日の講演で、近いうちに利上げが必要で、2027年春までにさらに複数回の利上げが要るとの考えを示した。物価上昇率が総合とコアの両方で3%を超え、上昇が幅広い品目に広がっていることを理由に挙げている。AI関連株への不安も重なり、NYダウは848.75ドル安の5万759ドルで引けた。東京市場も日経平均が801円安の5万8860円と2日続けて下げ、5万9000円を割り込んだ。日米の金利差を通じて円相場にも響く話だ。", "src": [["Yahoo Finance", "https://finance.yahoo.com/economy/policy/article/st-louis-feds-musalem-calls-for-interest-rate-hikes-soon-132554806.html"], ["WTOC（AP）", "https://www.wtoc.com/2026/11/17/another-wipeout-hits-wall-street-nvidia-other-jittery-ai-stocks-swing-lower/"], ["財経新聞", "https://www.zaikei.co.jp/article/20261117/878046.html"]], "viz": {"type": "bars", "title": "17日の日米株価指数の下落率", "unit": "%", "items": [{"label": "NYダウ", "value": -1.6, "display": "−1.6%", "hi": true}, {"label": "日経平均", "value": -1.34, "display": "−1.34%"}, {"label": "S&P500", "value": -1.0, "display": "−1.0%"}, {"label": "ナスダック", "value": -0.7, "display": "−0.7%"}], "note": "出典：AP（WTOC）、財経新聞。日経平均の率は801.59円安÷前日終値59,662円で計算"}, "debate": {"q": "FRBはイラン戦争に伴う物価高に利上げで応じるべきか", "views": [{"side": "利上げに慎重", "point": "今のインフレはイラン戦争によるエネルギーの供給ショックが原因で、そのショックは和らぎ始めていると主張した。大幅な利上げは避けて先を見た判断をすべきで、昨年利下げしたばかりで急に方向を変えるのは賢明でないとの立場だ（11/13）。", "who": "スコット・ベッセント（米財務長官）", "src": ["ロイター（WHBL, 11/13）", "https://whbl.com/2026/11/13/us-treasury-chief-says-fed-should-not-hike-rates-over-energy-shock-tied-to-iran-war/"]}, {"side": "引き締めが必要", "point": "物価の上昇は原油と関係の薄いサービスや医療にまで広がっており、エネルギーだけでは説明できないと指摘した。原油価格がどうなっても解消しない問題で、FRBには信認を取り戻す仕事が残っていると論じる（同じ報道）。", "who": "オースタン・グールズビー（シカゴ連銀総裁）", "src": ["ロイター（WHBL, 11/13）", "https://whbl.com/2026/11/13/us-treasury-chief-says-fed-should-not-hike-rates-over-energy-shock-tied-to-iran-war/"]}]}}, {"title": "米軍、ホルムズ海峡のケシム島でイランのミサイル拠点を攻撃", "body": "米軍機は17日、ホルムズ海峡に浮かぶイランのケシム島で、革命防衛隊のミサイル発射拠点を精密誘導弾で攻撃した。米側は、イランによる米軍要員や施設への攻撃に対する自衛だと説明している。イランはバーレーンの米軍レーダーを無人機で攻撃したと発表し、米中央軍は迎撃したとしている。バーレーンが狙われたのは1週間足らずで3回目だ。北海ブレント原油は1バレル93ドル台に上がった。前日まではイラン側の攻撃が続いていたが、今回は米国が反撃に出た。", "src": [["The National", "https://www.thenationalnews.com/news/us/2026/11/17/us-jets-strike-irgc-missile-launch-site-on-irans-qeshm-island-in-self-defence/"], ["WTOC（AP）", "https://www.wtoc.com/2026/11/17/another-wipeout-hits-wall-street-nvidia-other-jittery-ai-stocks-swing-lower/"]], "debate": {"q": "米国の海上封鎖による圧力はイランに効いているか", "views": [{"side": "時間は米国に有利", "point": "経済的な痛みに耐える力は米国のほうが大きく、イランは経済的に追い詰められていくとみる。ただし、封鎖を破るためにイランが湾岸の産油国を攻撃するおそれもあり、双方が引かないこう着が続くと分析した（11/17）。", "who": "タルハ・アブドゥルラザク（英エクセター大学 戦略安全保障研究所 研究員）", "src": ["Al Jazeera（11/17）", "https://www.aljazeera.com/news/2026/11/17/is-the-us-israel-war-on-iran-turning-into-a-frozen-conflict"]}, {"side": "封鎖はもろい", "point": "ホルムズの包囲が続くのは、米国にとってコストが安い間だけだと指摘した。米兵の死者、燃料価格の急騰、高濃縮ウランの移送の兆しのどれかが出れば崩れるとし、査察の再開と封鎖の解除を組み合わせた水面下の取引が現実的な出口だと論じる（同じ記事）。", "who": "ムハナド・セルーム（ドーハ大学院大学 助教）", "src": ["Al Jazeera（11/17）", "https://www.aljazeera.com/news/2026/11/17/is-the-us-israel-war-on-iran-turning-into-a-frozen-conflict"]}]}}, {"group": "AI・テクノロジー", "title": "エヌビディア、フアン氏退任後初の決算で予想超え　次の四半期は1300億ドル見通し", "body": "エヌビディアの8〜10月期の売上高は1158億ドルで、前年同期の約2倍になった。データセンター部門は1076億ドルで、市場予想の約1091億ドルを上回っている。11〜1月期の売上高は1300億ドル（±3%）と予想を超える見通しを示したが、この数字に中国向けのデータセンター用チップは含まれていない。株価は時間外取引で2〜3%上がった。暫定CEOを務めるクレス氏は、次世代の「Vera Rubin」の出だしが好調だと強調している。トップ交代の混乱が続くなかでも、AI需要の強さを数字で示した決算だ。", "src": [["NVIDIA（GlobeNewswire）", "https://www.globenewswire.com/news-release/2026/11/17/3405200/0/en/nvidia-announces-financial-results-for-third-quarter-fiscal-2027.html"], ["24/7 Wall St.", "https://247wallst.com/investing/2026/11/17/nvidias-first-report-without-jensen-huang-115-8-billion-in-revenue-a-130-billion-forecast-and-the-stock-is-up-2-3-after-hours/"], ["CBS News", "https://www.cbsnews.com/news/nvidia-earnings-jensen-huang-colette-kress/"]], "viz": {"type": "stats", "title": "エヌビディア 8〜10月期決算", "items": [{"value": "$115.8B", "label": "売上高（前年同期比+103%）", "dir": "up"}, {"value": "$107.6B", "label": "データセンター部門", "dir": "up"}, {"value": "$130B", "label": "11〜1月期の売上見通し（±3%）", "dir": "up"}], "note": "出典：NVIDIA決算発表、CBS News"}, "debate": {"q": "決算を前に、エヌビディア株は買い場だったのか", "views": [{"side": "悲観が行き過ぎ", "point": "市場はAI需要のピークを2028年とみて、利益率の大幅な低下まで株価に織り込んでいると指摘した。その前提はあまりに厳しすぎるとして、悲観が行き過ぎているとの見方を示した（決算前の11月中旬のコメント）。", "who": "ティム・アーキュリ（UBS 半導体アナリスト）", "src": ["Yahoo Finance（ライブ解説）", "https://finance.yahoo.com/technology/live/nvidia-live-updates-interim-ceo-kress-prepares-for-q3-earnings-with-huang-reportedly-planning-comeback-153114076.html"]}, {"side": "今は買いを勧めにくい", "point": "投資判断を「市場並み」に下げ、目標株価を400ドルから200ドルに半分にした。トップ交代の不透明さなどを踏まえ、今の段階で買いを勧めるのは難しいとの立場だ（決算前の11月中旬）。", "who": "ステーシー・ラスゴン（バーンスタイン アナリスト）", "src": ["Yahoo Finance（ライブ解説）", "https://finance.yahoo.com/technology/live/nvidia-live-updates-interim-ceo-kress-prepares-for-q3-earnings-with-huang-reportedly-planning-comeback-153114076.html"]}]}}, {"group": "AI・テクノロジー", "title": "Anthropic、公開価格は仮条件の上限以上か　申込は6〜7倍", "body": "Anthropicの新規株式公開（IPO）は、17日夕方（米東部時間）に投資家の申込を締め切った。Bloombergは、公開価格が仮条件（70〜78ドル）の上限かそれを上回る見通しだと報じている。申込は募集株数の6〜7倍に達した。新たに出された書類では、上場後にAmazonが約15%、Googleが約14%の株を持つことがわかった。価格は米国時間18日に決まり、19日にナスダックで取引が始まる。AI関連株全体の行方を占う試金石とみられている。", "src": [["The Next Web", "https://thenextweb.com/news/anthropic-ipo-price-top-of-range-amazon-google-stakes-coatue"], ["MarketPulse", "https://www.marketpulse.com/markets/anthropics-ipo-a-make-or-break-test-for-the-trillion-dollar-ai-trade/"]], "debate": {"q": "時価総額1.4兆ドル規模での上場は、長期投資に値するか", "views": [{"side": "長期の成長株として買う", "point": "運用するアルティメーターはIPOで50億ドルを投じる計画で、これは同社の過去最大の投資の5倍にあたる。Anthropicを長く複利で成長し続ける中核銘柄とみているという（11/17の報道）。", "who": "ブラッド・ガースナー（アルティメーター・キャピタル創業者）", "src": ["The Next Web（11/17）", "https://thenextweb.com/news/anthropic-ipo-price-top-of-range-amazon-google-stakes-coatue"]}, {"side": "成長はすでに織り込み済み", "point": "最大1.4兆ドルという評価は厳しい試練に直面すると指摘した。将来の成長の多くはすでに公開価格に織り込まれている可能性があり、申込が多いことは上場後の株価の強さを保証しないと論じる（11/16）。", "who": "ケルビン・ウォン（OANDA MarketPulse シニアマーケットアナリスト）", "src": ["MarketPulse（11/16）", "https://www.marketpulse.com/markets/anthropics-ipo-a-make-or-break-test-for-the-trillion-dollar-ai-trade/"]}]}}, {"group": "AI・テクノロジー", "title": "OpenAI、新モデル「GPT-6.2 Astra／Sol」　価格を約2割下げて対抗", "body": "OpenAIは17日、難しい専門業務向けの「GPT-6.2 Astra」と日常業務向けの「GPT-6.2 Sol」を公開した。Astraの利用料金は前のモデルより約2割安い。第三者機関Artificial Analysisの総合指数では、AnthropicのClaude Fable 5.2に次ぐ2位だった。一方でOpenAIは、AIが自らを改良する能力について、自社の安全基準で初めて「High」に達したモデルだと公表している。最先端モデルの競争が、性能だけでなくコストと安全性に広がっていることを示す発表だ。", "src": [["The Decoder", "https://the-decoder.com/openai-launches-gpt-6-2-astra-and-sol-with-lower-api-prices-and-some-benchmark-gains/"], ["Artificial Analysis", "https://artificialanalysis.ai/articles/openai-has-the-2-model-in-the-intelligence-index-with-the-release-of-gpt-6-2-astra-and-gpt-6-2-sol"], ["9to5Google", "https://9to5google.com/2026/11/17/openai-releases-gpt-6-2-astra-and-sol-for-complex-projects-a-week-after-claude-5-2/"]], "debate": {"q": "GPT-6.2はOpenAIの巻き返しになるか", "views": [{"side": "癖はあるが実力あり", "point": "試用版は出来にむらがあり、ほかのモデルより扱いにくいと認めた。それでも、野心的なプロジェクトを任せるとやり遂げる力があったと評価している（11/17）。", "who": "イーサン・モリック（ペンシルベニア大学ウォートン校 教授）", "src": ["Implicator.ai（11/17）", "https://www.implicator.ai/openai-gpt-6-2-astra-sol-cost-per-task/"]}, {"side": "期待外れ", "point": "競合のFable 5.2と比べると全体として期待外れの出来だと評した。文章の質は前のモデルより落ち、実際のプログラミングでは途中で止まりやすいと指摘している（11/18）。", "who": "ダン・シッパー（米メディアEvery CEO）", "src": ["OfficeChai（11/18）", "https://officechai.com/ai/gpt-6-2-astra-early-tester-harsh-reviews/"]}]}}]}, {"id": "football", "name": "海外サッカー", "items": [{"title": "ハーランドが96分にPKで決勝点、ノルウェーが逆転でネーションズリーグ8強", "body": "17日、ノルウェーは敵地コペンハーゲンでデンマークに3-2で逆転勝ちした。デンマークはホイルンドとホイビュアの得点で序盤に2点を先行した。ノルウェーはハーランドとウーデゴールの得点で追いつき、後半アディショナルタイム6分にハーランドがPKを決めて勝ち越した。引き分け以上で突破できたデンマークは、勝ち点で並ばれたうえ直接対決で負け越して3位に落ち、入れ替えプレーオフに回る。これで準々決勝に進む8チームが出そろった。", "src": [["ESPN", "https://www.espn.com/soccer/match/_/gameId/401861194"], ["UEFA", "https://www.uefa.com/uefanationsleague/news/02ab-2209792f2fda-6a523d4500bb-1000--nations-league-latest-on-quarter-final-qualification-promotion/"], ["GOAL", "https://www.goal.com/en/news/nations-league-haaland-scores-in-the-96th-minute-norway-reach-the-play-offs-hojlund-scores-ramos-disappoints/bltdbeb21c20a382b5c"]], "viz": {"type": "timeline", "title": "代表ウィーク明けの主な日程", "items": [{"date": "11/20", "text": "ネーションズリーグ準々決勝・入れ替え戦の組み合わせ抽選", "hi": true}, {"date": "11/21", "text": "ニューカッスル対アーセナル"}, {"date": "11/22", "text": "バルセロナ対ビジャレアル（カンプ・ノウ、日本時間22:00）", "hi": true}, {"date": "11/22", "text": "リバプール対マンU（ポチェッティーノ新監督の初陣予定）"}], "note": "出典：UEFA、DAZN、Sky Sports、AOL（日付は現地時間）"}}, {"title": "バルサ：デ・ヨングはビジャレアル戦に出場見込み、クバルシは様子見", "barca": true, "body": "バルセロナは検査結果を発表した。フレンキー・デ・ヨングは腰の付け根あたりの筋肉の軽い損傷で、すでに通常どおり練習しており、22日のビジャレアル戦に出られる見込みだ。スペイン代表のイングランド戦で前半だけで退いたクバルシは、股関節まわりの筋肉の張りと診断された。復帰の時期は示されず、出場は練習での回復しだいになる。フリック監督にとっては、中盤の主力が戻るめどが立った一方、最終ラインには不安が残る。", "src": [["Yahoo Sports", "https://sports.yahoo.com/articles/mixed-news-jong-cubars-bar-135100979.html"], ["Catalunya Press", "https://www.catalunyapress.es/articulo/deportes/2026-11-17/6094394-cara-cruz-enfermeria-fc-barcelona-comunicado-medico-oficial-sobre-jong-cubarsi"], ["DAZN", "https://www.dazn.com/es-ES/news/futbol/alineacion-barcelona-hoy-once-banquillo-suplentes/1pu8xhq5ywmza1ctxnrwdu4j9s"]]}, {"title": "10人のポルトガル、ウェールズに3-2で勝って首位通過", "body": "すでに8強入りを決めていたポルトガルは、カーディフでウェールズに3-2で勝った。ブルーノ・フェルナンデス、ペドロ・ネト、カルロス・フォルブスが得点し、ネトは後半に2枚目の警告で退場している。最下位のウェールズは入れ替えプレーオフに回る。この期間中に代表を負傷で離れたベルナルド・シウバについては、所属するレアル・マドリードの検査で損傷が見つからなかった。これにポルトガル協会の医師が反論し、クラブと代表のあいだで食い違いが話題になっている。", "src": [["ESPN", "https://www.espn.com/soccer/match/_/gameId/401861189/portugal-wales"], ["101 Great Goals", "https://www.101greatgoals.com/match-reports/wales-2-3-portugal-report-result-goals/"], ["GOAL（スペイン語）", "https://www.goal.com/es/noticias/el-medico-de-portugal-responde-traiciono-bernardo-silva-a-la-seleccion-por-el-real-madrid/blt81e897fcc9dd37f8"]]}, {"title": "マンUはポチェッティーノ体制へ、最下位パレスはフランクを招へい", "body": "マンチェスター・ユナイテッドは、リーグ10試合で1勝と降格圏に沈んだキャリック監督を12日に解任し、米国代表監督のポチェッティーノ氏を後任とすることで合意した。正式発表の時期は媒体によって伝え方が分かれている。同氏は米国代表の試合を終えてから合流し、22日のリバプール戦が初陣になる見込みだ。最下位のクリスタル・パレスも監督を解任し、トーマス・フランク氏を2年半契約で迎えた。", "src": [["Sky Sports", "https://www.skysports.com/football/news/13611745/mauricio-pochettino-manchester-united-agree-two-and-a-half-year-deal-with-usa-manager-to-replace-michael-carrick"], ["GOAL", "https://www.goal.com/en/news/mauricio-pochettino-manchester-united-manager-usmnt-liverpool/bltce123719a1128621"], ["Weekend Argus", "https://weekendargus.co.za/sport/soccer/2026-11-17-palace-appoint-frank-in-quest-for-premier-league-survival/"]]}, {"title": "アーセナル、スビメンディが代表戦で負傷　ニューカッスル戦は微妙", "body": "スペイン代表のスビメンディは15日のイングランド戦で右ハムストリングを痛めて途中交代し、アーセナルは診断結果を待っている。21日にはニューカッスル戦がある。サカも太ももの負傷で12月上旬まで戻れない見込みで、首位争いを続けるチームにとって中盤と前線の主力が同時に欠ける心配が出てきた。", "src": [["Sports Mole", "https://www.sportsmole.co.uk/football/arsenal/injury-news/news/big-blow-mikel-arteta-faces-fresh-arsenal-injury-concern-as-gbp55m-star-limps-off_609190.html"], ["AOL", "https://www.aol.co.uk/articles/zubimendi-tzolis-saka-dowman-arsenal-151720000.html"]]}]}, {"id": "art", "name": "アート", "items": [{"group": "国内", "title": "ポーラ美術館がゴンザレス＝トレス《パーフェクト・ラヴァーズ》を収蔵、12月4日から公開", "body": "箱根のポーラ美術館が、フェリックス・ゴンザレス＝トレスの代表作《「無題」（パーフェクト・ラヴァーズ）》（1987〜90年）を収蔵した。同じ時刻に合わせた2つの掛け時計を並べた作品で、時計は少しずつずれ、やがてどちらかが先に止まる。エイズ危機の時代に、パートナーとの関係を背景に生まれた。12月4日から開催中の「あたらしい目―モネと21世紀のアート」（2027年4月7日まで）で公開される。90年代以降の現代美術を代表する一点が、日本の美術館に入ることになる。", "src": [["美術手帖", "https://bijutsutecho.com/magazine/news/headline/33354"]]}, {"group": "国内", "title": "国立美術館の所蔵作品展が1000円に、専門家が値上げの使い道に懸念", "body": "東京国立近代美術館と国立西洋美術館の所蔵作品展は500円から1000円に、国立工芸館は300円から1000円に、10月から段階的に値上げされている。背景には、展示事業の自己収入の比率を2030年度までに65%以上にするよう求めた文部科学省の目標がある。美術手帖は17日、文化政策の専門家・太下義之氏の見方を掲載した。太下氏は、値上げで得た収入が新しい展示や鑑賞しやすさの改善ではなく、基本的な運営費の穴埋めに回るおそれを指摘している。", "src": [["美術手帖", "https://bijutsutecho.com/magazine/insight/33348"]]}, {"group": "国内", "title": "大阪府の20世紀美術コレクションと子どもの作品を並べる展示、20日開幕", "body": "大阪・中之島のアートエリアB1で、「つくってみようよ展覧会」が11月20日から12月23日まで無料で開かれる。キュレーターは檜山真有さんだ。カルティエ＝ブレッソン、植田正治、田中一光らの大阪府コレクションを、府内の子どもたちやワークショップ参加者の作品と並べる。作品の価値を歴史や値段ではなく「出会いの記憶」から問い直す試みで、来場者が感想を書き込んで完成させる大きなカタログも用意される。", "src": [["美術手帖", "https://bijutsutecho.com/magazine/news/exhibition/33349"]]}, {"group": "国内", "title": "アンドリュー・クランストン、京都・両足院でアジア初の個展（22日まで）", "body": "スコットランドの画家アンドリュー・クランストンが、京都・祇園の禅寺、両足院で個展「Birds, beasts, and flowers」を開いている（22日まで）。寺の室礼に合わせて描いた大型の新作絵画5点と、茶室に置いた木版画3点で構成する。テートなども所蔵する画家の初来日で、ARTnews JAPANが17日にインタビューを載せた。会期は残り数日だ。", "src": [["ARTnews JAPAN", "https://artnewsjapan.com/article/93117"]]}, {"group": "海外", "title": "サザビーズNYの2セールで計3億7870万ドル、草間彌生が自身の最高額を更新", "body": "ニューヨークで16日夜、サザビーズの2つのセールが続けて開かれた。「Now and Contemporary」は手数料込みで約2億6870万ドル、バウム夫妻のコレクションは全24点が売れて約1億1000万ドルとなり、合計は3億7870万ドルだった。草間彌生《No. 3P.B.》（1960年）は約1500万ドルで落札され、作家のオークション最高額を更新した。ただしバウム・コレクションの3分の1は予想の下限を下回っており、買い手の慎重さも目立つ。", "src": [["The Art Newspaper", "https://www.theartnewspaper.com/2026/11/16/yayoi-kusama-sets-15m-auction-record-as-sothebys-opens-new-york-mega-sales"], ["USA Art News", "https://usaartnews.com/auctions/sothebys-november-sales-achieve-3787-million-amid-cautious-bidding/"]], "viz": {"type": "bars", "title": "サザビーズNY 11/16 上位の落札額（手数料込み）", "unit": "", "items": [{"label": "リキテンスタイン", "value": 24.6, "display": "$24.6M"}, {"label": "デ・クーニング", "value": 20.3, "display": "$20.3M"}, {"label": "ジョーン・ミッチェル", "value": 19.3, "display": "$19.3M"}, {"label": "ウォーホル", "value": 18.2, "display": "$18.2M"}, {"label": "ロスコ", "value": 17.7, "display": "$17.7M"}, {"label": "サム・フランシス", "value": 17.1, "display": "$17.1M"}, {"label": "草間彌生", "value": 15.0, "display": "$15.0M", "hi": true}], "note": "出典：The Art Newspaper（媒体によって±0.1Mの差あり）"}}, {"group": "海外", "title": "18日競売のゴッホ（予想約1.8億ドル）に、直前で返還請求", "body": "サザビーズが18日（NY時間）に競売にかける

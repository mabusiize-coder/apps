<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="art/brief.png">
<title>朝のニュース</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800;900&family=Archivo+Narrow:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style>
:root{
  color-scheme:light;
  --paper:#FFFFFF; --ink:#141414; --sub:#5C5C5C; --faint:#9A9A9A; --rule:#E6E6E6; --hair:#141414;
  --cream:#F4EFE6; --tint:#F6F6F4;
  --pol:#1E4FD6; --foot:#0E8A55; --art:#E2463F; --film:#D99300;
  --pol-t:#E9EEFB; --foot-t:#E5F3EC; --art-t:#FCEAE8; --film-t:#FBF2DE;
  --up:#D23B2F; --down:#1E4FD6;
  --f-en:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-en-n:"Archivo Narrow","Archivo","Helvetica Neue",Arial,sans-serif;
  --f-jp:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  --gut:max(24px,env(safe-area-inset-left,0px));
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:64px}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-jp);font-size:16.5px;line-height:2;letter-spacing:.03em;font-feature-settings:"palt" 0;-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.in{max-width:640px;margin:0 auto;padding-left:var(--gut);padding-right:max(24px,env(safe-area-inset-right,0px))}
.en{font-family:var(--f-en);letter-spacing:.02em}
.lab{font-family:var(--f-en-n);font-weight:700;font-size:11px;letter-spacing:.22em;text-transform:uppercase}

/* ---------- cover ---------- */
.cover{padding-top:28px}
.mast{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid var(--hair);padding-bottom:10px}
.logo{font-family:var(--f-en);font-weight:900;font-size:clamp(40px,13vw,72px);line-height:.82;letter-spacing:-.045em;margin:0}
.logo small{display:block;font-size:.3em;letter-spacing:.02em;font-weight:800;margin-bottom:.35em}
.issue{text-align:right;font-family:var(--f-en-n);font-weight:700;font-size:12px;line-height:1.5;letter-spacing:.08em}
.issue b{display:block;font-family:var(--f-en);font-weight:900;font-size:26px;letter-spacing:-.02em;line-height:1}
.cv-art{margin:28px 0 0;background:var(--cream);border-radius:2px;aspect-ratio:10/7;overflow:hidden}
.cv-art svg{display:block;width:100%;height:100%}
.cv-cap{display:flex;justify-content:space-between;margin-top:8px;color:var(--faint)}
.lede,.art h3,.op .jp,.vq,.ft{word-break:auto-phrase}
.lede{font-weight:700;font-size:clamp(19px,5vw,24px);line-height:1.8;letter-spacing:.02em;margin:40px 0 0}
.mk{display:grid;grid-template-columns:1fr 1fr;margin-top:40px;border-top:1px solid var(--hair)}
.mk>div{padding:14px 0 16px;border-bottom:1px solid var(--rule)}
.mk>div:nth-child(odd){padding-right:14px;border-right:1px solid var(--rule)}
.mk>div:nth-child(even){padding-left:16px}
.mk .l{font-size:12px;color:var(--sub);line-height:1.4}
.mk .v{font-family:var(--f-en);font-weight:800;font-size:26px;letter-spacing:-.02em;line-height:1.25;margin-top:4px;font-variant-numeric:tabular-nums}
.mk .c{font-size:12px;line-height:1.4;font-variant-numeric:tabular-nums}
.mk .c.up{color:var(--up)} .mk .c.down{color:var(--down)}

/* ---------- listen ---------- */
.lsn{margin-top:56px}
.lsn .in>div{display:flex;align-items:center;gap:18px;border:1.5px solid var(--hair);border-radius:999px;padding:10px 10px 10px 24px}
.lsn .lt{flex:1;min-width:0;line-height:1.5}
.lsn .lt b{display:block;font-size:15px}
.lsn .lt span{font-size:12px;color:var(--sub)}
.go{flex:none;display:flex;align-items:center;gap:8px;background:var(--ink);color:#fff;border:0;border-radius:999px;padding:13px 22px;font:700 14px/1 var(--f-jp);letter-spacing:.08em;cursor:pointer}
.go svg{width:12px;height:12px}

/* ---------- contents ---------- */
.toc{margin-top:88px}
.toc h2{margin:0 0 6px;font-family:var(--f-en);font-weight:900;font-size:40px;letter-spacing:-.03em;line-height:1}
.toc ol{list-style:none;margin:20px 0 0;padding:0;border-top:2px solid var(--hair)}
.toc li a{display:grid;grid-template-columns:48px 1fr auto;align-items:baseline;gap:8px;padding:16px 0;border-bottom:1px solid var(--rule);text-decoration:none}
.toc .no{font-family:var(--f-en);font-weight:800;font-size:15px;color:var(--c)}
.toc .nm{font-weight:700;font-size:17px;line-height:1.5}
.toc .nm small{display:block;font-family:var(--f-en-n);font-weight:500;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
.toc .ct{font-family:var(--f-en-n);font-size:12px;color:var(--sub);letter-spacing:.1em}
.favbtn{margin-top:18px;background:none;border:1px solid var(--rule);border-radius:999px;padding:8px 16px;font:500 13px/1 var(--f-jp);color:var(--sub);cursor:pointer}
.favbtn[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}

/* ---------- sticky nav ---------- */
.nav{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--rule);margin-top:88px}
.nav .in{display:flex;gap:22px;overflow-x:auto;scrollbar-width:none;padding-block:0}
.nav .in::-webkit-scrollbar{display:none}
.nav a{flex:none;text-decoration:none;font-family:var(--f-en-n);font-weight:700;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);padding:15px 0 13px;border-bottom:2px solid transparent}
.nav a.on{color:var(--ink);border-color:var(--c)}
.prog{height:2px;background:var(--ink);width:0;transition:width .15s linear}

/* ---------- section opener ---------- */
.ch{padding-top:96px}
.op .no{font-family:var(--f-en);font-weight:900;font-size:15px;color:var(--c);letter-spacing:.04em}
.op h2{margin:10px 0 0;font-family:var(--f-en);font-weight:900;font-size:clamp(46px,14vw,80px);line-height:.92;letter-spacing:-.045em}
.op .jp{margin-top:14px;font-weight:700;font-size:15px;display:flex;gap:12px;align-items:center}
.op .jp::before{content:"";width:28px;height:2px;background:var(--c)}
.op .ill{margin-top:36px;background:var(--t);aspect-ratio:10/7;overflow:hidden}
.op .ill svg{display:block;width:100%;height:100%}

/* ---------- articles ---------- */
.art{padding-top:64px}
.art+.art{margin-top:8px}
.kick{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.kick .n{font-family:var(--f-en);font-weight:800;font-size:13px;color:var(--c)}
.kick .g{font-size:12px;font-weight:500;color:var(--sub);letter-spacing:.08em}
.tag{display:inline-block;font:700 10.5px/1 var(--f-en-n);letter-spacing:.14em;padding:5px 8px 4px;border-radius:99px;vertical-align:3px;margin-left:6px;white-space:nowrap}
.tag.fav{background:var(--ink);color:#fff}
.tag.barca{background:#A50044;color:#fff}
.art h3{margin:12px 0 0;font-weight:900;font-size:clamp(22px,6vw,27px);line-height:1.55;letter-spacing:.01em}
.art.lead h3{font-size:clamp(26px,7.6vw,34px);line-height:1.45}
.art p{margin:22px 0 0}
.art.lead>p{font-size:17.5px}
.art.lead>p::first-letter{font-weight:900}
.art .rule{height:1px;background:var(--rule);margin-top:64px}
.srcs{margin-top:22px;font-size:12px;line-height:1.9;color:var(--faint)}
.srcs span{font-family:var(--f-en-n);font-weight:700;letter-spacing:.18em;margin-right:10px;color:var(--sub)}
.srcs a{margin-right:12px;text-underline-offset:3px;text-decoration-color:var(--rule)}
.speaking{position:relative}
.speaking::before{content:"";position:absolute;left:calc(var(--gut) * -1 + 6px);top:64px;bottom:0;width:3px;background:var(--c)}
@media (min-width:700px){.speaking::before{left:max(6px,calc((100vw - 640px)/2 - 18px))}}

/* figures */
.fig{margin:40px 0 0;padding:26px 0 0;border-top:2px solid var(--hair)}
.fig .fl{color:var(--c)}
.fig .ft{font-weight:700;font-size:15px;margin-top:6px;line-height:1.6}
.fig .fn{font-size:11.5px;color:var(--faint);margin-top:14px;line-height:1.7}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:20px 18px;margin-top:18px}
.stats .sv{font-family:var(--f-en);font-weight:900;font-size:40px;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.stats .sv.up{color:var(--up)} .stats .sv.down{color:var(--down)}
.stats .sl{font-size:12px;color:var(--sub);line-height:1.6;margin-top:8px}
.bars{margin-top:18px;display:grid;gap:12px}
.bar{display:grid;grid-template-columns:6.5em 1fr;align-items:center;gap:10px;font-size:13px;line-height:1.4}
.bar .track{display:flex;align-items:center;gap:8px;min-width:0}
.bar .fill{height:12px;background:var(--ink);opacity:.18;flex:none}
.bar.hi .fill{background:var(--c);opacity:1}
.bar .bv{font-family:var(--f-en);font-weight:700;font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.tl{list-style:none;margin:18px 0 0;padding:0}
.tl li{display:grid;grid-template-columns:5.5em minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px solid var(--rule);font-size:14px;line-height:1.7}
.tl .td{font-family:var(--f-en-n);font-weight:700;font-size:13px;color:var(--sub)}
.tl li.hi .td{color:var(--c)}
.tl li.hi .tx{font-weight:700}
.tx,.vp,.art p,.art h3,.bl{overflow-wrap:anywhere}

/* two views */
.vw{margin-top:40px;background:var(--tint);padding:28px 24px 24px}
.vw .vq{font-weight:900;font-size:18px;line-height:1.65;margin-top:8px}
.vc{margin-top:22px;padding-top:18px;border-top:1px solid var(--rule)}
.vc .vs{font-weight:700;font-size:14px;display:flex;gap:8px;align-items:center}
.vc .vs::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c)}
.vc.v1 .vs::before{background:transparent;box-shadow:inset 0 0 0 2px var(--c)}
.vc .vp{margin:10px 0 0;font-size:14.5px;line-height:1.95}
.vc .vwho{margin-top:10px;font-size:12px;color:var(--sub);line-height:1.7}
.vc .va{display:inline-block;margin-top:4px;font-size:11.5px;color:var(--faint);text-underline-offset:3px}

/* footer */
.foot{margin-top:120px;border-top:2px solid var(--hair);padding:28px 0 64px;font-size:12px;line-height:1.9;color:var(--sub)}
.foot .logo{font-size:30px;margin-bottom:14px;color:var(--ink)}
body.listening .foot{padding-bottom:220px}

/* ---------- player ---------- */
.player{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1.5px solid var(--hair);padding-bottom:env(safe-area-inset-bottom,0px)}
.player .in{padding-block:12px 12px;display:grid;gap:10px}
.pl-now{display:flex;align-items:baseline;gap:10px;min-width:0;line-height:1.4}
.pl-sec{flex:none;font-family:var(--f-en-n);font-weight:700;font-size:11px;letter-spacing:.14em;color:var(--pc,var(--ink))}
.pl-ttl{flex:1;min-width:0;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-pos{flex:none;font-family:var(--f-en-n);font-size:11px;color:var(--faint)}
.pl-bar{height:2px;background:var(--rule)}
.pl-bar i{display:block;height:100%;width:0;background:var(--pc,var(--ink))}
.pl-ctl{display:flex;align-items:center;gap:10px}
.pl-ctl button{background:none;border:1px solid var(--rule);color:var(--ink);border-radius:999px;height:42px;min-width:42px;display:grid;place-items:center;cursor:pointer;font:600 12px/1 var(--f-en)}
.pl-ctl button svg{width:14px;height:14px}
.pl-ctl .pp{background:var(--ink);border-color:var(--ink);color:#fff;width:52px;height:52px}
.pl-ctl .pp svg{width:16px;height:16px}
.pl-ctl .rate{padding:0 12px}
.pl-ctl .sp{flex:1}
.pl-ctl .x{padding:0 14px;font-family:var(--f-jp);font-weight:500}
.pl-note{font-size:11px;color:var(--faint);line-height:1.5}
.pl-note a{color:var(--sub)}

@media (min-width:900px){
  body{font-size:17px}
  .in{max-width:700px}
  .cover{padding-top:56px}
}
</style>
</head>
<body>

<header class="cover"><div class="in">
  <div class="mast">
    <h1 class="logo"><small>The</small>MORNING<br>BRIEF</h1>
    <div class="issue"><b id="iss-d"></b><span id="iss-w"></span><br><span id="iss-y"></span></div>
  </div>
  <div class="cv-art" id="cv-art"></div>
  <div class="cv-cap lab"><span>Today's Issue</span><span id="cv-n"></span></div>
  <p class="lede" id="headline"></p>
  <div class="mk" id="markets"></div>
</div></header>

<section class="lsn" id="lsn" aria-label="音声で聞く"><div class="in"><div>
  <div class="lt"><b>歩きながら聞く</b><span id="lsn-sub">画面を消しても再生が続きます</span><span id="lsn-meta" hidden></span></div>
  <button type="button" class="go" id="lsn-go"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9-5.5z" fill="currentColor"/></svg><span>聞く</span></button>
</div></div></section>

<section class="toc" aria-label="目次"><div class="in">
  <div class="lab" style="color:var(--faint)">Contents</div>
  <h2>In This Issue</h2>
  <ol id="toc"></ol>
  <button type="button" class="favbtn" id="favbtn" aria-pressed="false" hidden></button>
</div></section>

<nav class="nav" aria-label="ジャンル"><div class="in" id="nav"></div><div class="prog" id="prog"></div></nav>
<main id="main"></main>

<footer class="foot"><div class="in">
  <div class="logo">MORNING<br>BRIEF</div>
  直近24時間（日本時間）のニュースを、一次ソースと信頼できる報道機関からまとめています。各記事の出典から原文を確認できます。<br>
  <span id="updated"></span>
</div></footer>

<div class="player" id="player" hidden><div class="in">
  <div class="pl-now"><span class="pl-sec" id="pl-sec"></span><span class="pl-ttl" id="pl-ttl"></span><span class="pl-pos" id="pl-pos"></span></div>
  <div class="pl-bar"><i id="pl-bar"></i></div>
  <div class="pl-ctl">
    <button type="button" id="pl-prev" aria-label="前の記事"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2.5h2v11H3zM14 2.5v11L6 8z" fill="currentColor"/></svg></button>
    <button type="button" class="pp" id="pl-pp" aria-label="一時停止"></button>
    <button type="button" id="pl-next" aria-label="次の記事"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M11 2.5h2v11h-2zM2 2.5v11L10 8z" fill="currentColor"/></svg></button>
    <button type="button" class="rate" id="pl-rate" aria-label="再生の速さ">1.0×</button>
    <span class="sp"></span>
    <button type="button" class="x" id="pl-stop">閉じる</button>
  </div>
  <div class="pl-note" id="pl-note">画面を消しても続きます。<a href="video.html">テロップ画面で見る</a></div>
</div></div>

<script type="application/json" id="news-data">__NEWS_DATA__</script>
<script>
(function(){
  var D=JSON.parse(document.getElementById('news-data').textContent);
  var META={politics:{c:'var(--pol)',t:'var(--pol-t)',en:'Politics & Economy'},football:{c:'var(--foot)',t:'var(--foot-t)',en:'Football'},art:{c:'var(--art)',t:'var(--art-t)',en:'Art'},film:{c:'var(--film)',t:'var(--film-t)',en:'Cinema'}};
  function el(t,a,kids){var e=document.createElement(t);if(a)for(var k in a){if(k==='text')e.textContent=a[k];else e.setAttribute(k,a[k]);}(kids||[]).forEach(function(x){if(x)e.appendChild(typeof x==='string'?document.createTextNode(x):x)});return e;}
  function pad(n){return String(n).padStart(2,'0');}
  var d=new Date(D.date+'T00:00:00');
  var EW=['SUN','MON','TUE','WED','THU','FRI','SAT'];
  document.getElementById('iss-d').textContent=(d.getMonth()+1)+'.'+pad(d.getDate());
  document.getElementById('iss-w').textContent=EW[d.getDay()]+' / '+D.weekday+'曜日';
  document.getElementById('iss-y').textContent=String(d.getFullYear());
  document.getElementById('headline').textContent=D.headline;
  document.getElementById('updated').textContent='Updated '+D.date.replace(/-/g,'.');
  var mk=document.getElementById('markets');
  (D.markets||[]).slice(0,4).forEach(function(m){mk.appendChild(el('div',null,[el('div',{class:'l',text:m.label}),el('div',{class:'v',text:m.value}),el('div',{class:'c '+m.dir,text:(m.dir==='up'?'▲ ':m.dir==='down'?'▼ ':'')+m.change})]))});
  if(!mk.children.length)mk.hidden=true;

  /* ---- illustrations (flat, limited palette) ---- */
  var K='#141414',W='#FFFFFF',CR='#F4EFE6',PE='#F2A27E',SK='#A9CBEA',YE='#F4C744',GR='#C9C2B6';

    '<g transform="rotate(-8 140 190)"><rect x="52" y="140" width="176" height="104" fill="'+W+'" stroke="'+K+'" stroke-width="3"/><path d="M140 140v104" stroke="'+K+'" stroke-width="2"/><rect x="64" y="152" width="64" height="12" fill="'+K+'"/><path d="M64 176h64M64 186h64M64 196h50M64 206h64M64 216h40M152 154h64M152 164h64M152 174h54" stroke="'+K+'" stroke-width="2.5"/><rect x="152" y="186" width="64" height="44" fill="'+c+'"/></g>'+
    '<path d="M272 196c0 30 14 44 34 44s34-14 34-44z" fill="'+W+'" stroke="'+K+'" stroke-width="3"/><path d="M340 204c16 0 16 22 0 22" fill="none" stroke="'+K+'" stroke-width="3"/><ellipse cx="306" cy="242" rx="50" ry="7" fill="'+W+'" stroke="'+K+'" stroke-width="3"/>'+
    '<path d="M294 182c-8-10 8-16 0-28M314 182c-8-10 8-16 0-28" fill="none" stroke="'+K+'" stroke-width="2.5" stroke-linecap="round"/>';}],
   politics:[
    function(c){return '<rect x="40" y="40" width="320" height="200" fill="none"/>'+
     '<circle cx="200" cy="120" r="78" fill="'+SK+'"/><path d="M134 92c30 8 34-20 62-6s20 40 52 28 28 8 28 8M128 140c24-6 30 16 54 8s22-26 48-10" fill="none" stroke="'+W+'" stroke-width="5" stroke-linecap="round"/>'+
     '<rect x="128" y="168" width="144" height="86" fill="'+c+'"/><rect x="128" y="168" width="144" height="16" fill="'+K+'"/>'+
     '<path d="M178 168v-50M222 168v-50" stroke="'+K+'" stroke-width="4"/><rect x="170" y="104" width="16" height="22" rx="8" fill="'+K+'"/><rect x="214" y="104" width="16" height="22" rx="8" fill="'+K+'"/>'+
     '<rect x="186" y="204" width="28" height="28" fill="'+W+'"/><circle cx="200" cy="218" r="8" fill="'+c+'"/>'+
     '<path d="M40 254h320" stroke="'+K+'" stroke-width="3"/>';},
    function(c){return '<path d="M40 236h320" stroke="'+K+'" stroke-width="3"/>'+
     '<rect x="70" y="160" width="40" height="76" fill="'+GR+'"/><rect x="126" y="124" width="40" height="112" fill="'+GR+'"/><rect x="182" y="140" width="40" height="96" fill="'+GR+'"/><rect x="238" y="96" width="40" height="140" fill="'+c+'"/><rect x="294" y="62" width="40" height="174" fill="'+K+'"/>'+
     '<path d="M70 150l70-46 56 20 64-58 70-30" fill="none" stroke="'+K+'" stroke-width="4" stroke-linejoin="round"/><path d="M314 30l18 6-6 18" fill="none" stroke="'+K+'" stroke-width="4" stroke-linejoin="round"/>'+

  var doy=Math.floor((d-new Date(d.getFullYear(),0,0))/864e5);
  function art(id,col,i){var v=ILLO[id];if(!v)return '';return '<svg viewBox="0 0 400 280" aria-hidden="true" preserveAspectRatio="xMidYMid meet">'+v[(doy+(i||0))%v.length](col)+'</svg>';}
  var HEX={politics:'#1E4FD6',football:'#0E8A55',art:'#E2463F',film:'#D99300'};
  document.getElementById('cv-art').innerHTML=art('cover',HEX[(D.sections[0]||{}).id]||'#E2463F');

  var FIGLAB={stats:'Numbers',bars:'Chart',timeline:'Timeline'};
  function fig(v){
    if(!v||!v.type)return null;
    var f=el('figure',{class:'fig'},[el('div',{class:'fl lab',text:FIGLAB[v.type]||'Figure'}),v.title?el('div',{class:'ft',text:v.title}):null]);
    if(v.type==='stats'){var g=el('div',{class:'stats'});(v.items||[]).forEach(function(x){g.appendChild(el('div',null,[el('div',{class:'sv '+(x.dir||''),text:x.value}),el('div',{class:'sl',text:x.label})]))});f.appendChild(g);}
    else if(v.type==='bars'){var mx=0;(v.items||[]).forEach(function(x){mx=Math.max(mx,Math.abs(+x.value)||0)});var b=el('div',{class:'bars'});
      (v.items||[]).forEach(function(x){var w=mx?Math.abs(+x.value)/mx:0;
        b.appendChild(el('div',{class:'bar'+(x.hi?' hi':'')},[el('span',{class:'bl',text:x.label}),el('span',{class:'track'},[el('span',{class:'fill',style:'width:calc((100% - 5em) * '+w.toFixed(3)+')'}),el('span',{class:'bv',text:(x.display||String(x.value))+(v.unit&&!x.display?v.unit:'')})])]))});f.appendChild(b);}
    else if(v.type==='timeline'){var u=el('ol',{class:'tl'});(v.items||[]).forEach(function(x){u.appendChild(el('li',{class:x.hi?'hi':''},[el('span',{class:'td',text:x.date}),el('span',{class:'tx',text:x.text})]))});f.appendChild(u);}
    else return null;
    if(v.note)f.appendChild(el('div',{class:'fn',text:v.note}));
    return f;
  }
  function title(tag,it){var t=el(tag,null,[it.title]);if(it.fav)t.appendChild(el('span',{class:'tag fav',text:'★ FAVORITE'}));if(it.barca)t.appendChild(el('span',{class:'tag barca',text:'BARÇA'}));return t;}
  function srcs(it){if(!it.src||!it.src.length)return null;var s=el('div',{class:'srcs'},[el('span',{text:'SOURCE'})]);it.src.forEach(function(x){s.appendChild(el('a',{href:x[1],target:'_blank',rel:'noopener',text:x[0]}))});return s;}
  function debate(it){
    var v=it.debate;if(!v||!v.views||v.views.length<2)return null;
    var box=el('div',{class:'vw'},[el('div',{class:'lab',style:'color:var(--c)',text:'Two Views'}),v.q?el('div',{class:'vq',text:v.q}):null]);
    v.views.slice(0,2).forEach(function(x,i){box.appendChild(el('div',{class:'vc v'+i},[el('div',{class:'vs',text:x.side}),el('p',{class:'vp',text:x.point}),x.who?el('div',{class:'vwho',text:x.who}):null,x.src?el('a',{class:'va',href:x.src[1],target:'_blank',rel:'noopener',text:x.src[0]}):null]))});
    return box;
  }

  var nav=document.getElementById('nav'),main=document.getElementById('main'),toc=document.getElementById('toc'),favN=0,no=0;
  D.sections.forEach(function(s,si){
    var m=META[s.id]||{c:'var(--ink)',t:'var(--tint)',en:s.name};
    if(!s.items||!s.items.length)return;

    nav.appendChild(el('a',{href:'#'+s.id,style:'--c:'+m.c,text:m.en}));
    var ch=el('section',{class:'ch',id:s.id,style:'--c:'+m.c+';--t:'+m.t});
    var op=el('div',{class:'op in'},[el('div',{class:'no',text:'No.'+pad(no)}),el('h2',{text:m.en}),el('div',{class:'jp',text:s.name+'　'+s.items.length+'本'})]);

      last=g;
      ch.appendChild(a);
    });
    main.appendChild(ch);

  if(favN){
    var fb=document.getElementById('favbtn');fb.hidden=false;fb.textContent='★ 好みの記事だけ表示（'+favN+'）';
    fb.addEventListener('click',function(){
      var on=fb.getAttribute('aria-pressed')!=='true';fb.setAttribute('aria-pressed',String(on));
      document.querySelectorAll('.ch').forEach(function(ch){var shown=0;
        ch.querySelectorAll('[data-fav]').forEach(function(x){var h=on&&x.dataset.fav!=='1';x.hidden=h;if(!h)shown++;});
        ch.hidden=on&&!shown;});
    });
  }
  var links=[].slice.call(nav.querySelectorAll('a')),prog=document.getElementById('prog');
  function onScroll(){
    var y=window.scrollY+90,cur=null;
    document.querySelectorAll('.ch').forEach(function(ch){if(!ch.hidden&&ch.offsetTop<=y)cur=ch.id;});
    links.forEach(function(a){var on=a.getAttribute('href')==='#'+cur;if(on&&!a.classList.contains('on'))a.scrollIntoView({inline:'center',block:'nearest'});a.classList.toggle('on',on);});
    var h=document.documentElement.scrollHeight-window.innerHeight;prog.style.width=(h>0?Math.min(100,window.scrollY/h*100):0)+'%';
  }
  window.addEventListener('scroll',onScroll,{passive:true});onScroll();

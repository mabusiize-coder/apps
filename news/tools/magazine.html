<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="art/brief.png">
<title>朝のニュース</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=Noto+Sans+JP:wght@200;400;500;700;900&display=swap">
<style>
:root{
  color-scheme:light;
  --paper:#FFFFFF; --ink:#141414; --sub:#555; --faint:#999; --rule:#DCDCDC;
  --ic:#FFE03A;                                   /* その日のテーマカラー（JSで日替わり） */
  --ic-t:color-mix(in srgb,var(--ic) 28%,#fff);
  --ic-tt:color-mix(in srgb,var(--ic) 12%,#fff);
  --up:#D23B2F; --down:#1E4FD6;
  --f-en:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-jp:"Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN",system-ui,sans-serif;
  --gut:max(22px,env(safe-area-inset-left,0px));
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(60px + var(--sat))}
:root{--sat:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-jp);font-size:16px;line-height:2;letter-spacing:.04em;-webkit-font-smoothing:antialiased;padding-top:var(--sat);overflow-x:hidden}
[hidden]{display:none!important}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.in{max-width:660px;margin:0 auto;padding-left:var(--gut);padding-right:max(22px,env(safe-area-inset-right,0px))}
h1,h2,h3,.bp{word-break:auto-phrase}
p,.vp,.tx{overflow-wrap:anywhere}
.en{font-family:var(--f-en)}
.chip{display:inline-block;background:var(--ink);color:#fff;font:700 13px/1 var(--f-jp);letter-spacing:.06em;padding:7px 10px 6px}
.chip.ic{background:var(--ic);color:var(--ink)}
.pill{display:inline-block;border:2px solid var(--ink);border-radius:999px;padding:3px 14px 2px;font-weight:700}
.runhead{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--ink);padding:14px 0 8px;font:800 12px/1 var(--f-en);letter-spacing:.06em}
.runhead i{width:10px;height:10px;border:1.5px solid var(--ink);display:inline-block}
.folio{display:grid;grid-template-columns:56px minmax(0,1fr) auto;border:1px solid var(--ink);margin-top:28px;font:500 11px/1 var(--f-en);letter-spacing:.08em}
.folio>*{padding:11px 10px}
.folio>:nth-child(2){border-left:1px solid var(--ink);border-right:1px solid var(--ink);font-family:var(--f-jp);font-weight:700;letter-spacing:.14em}
.folio>:last-child{text-align:right;min-width:56px;white-space:nowrap}

/* ---------- cover ---------- */
.cover{background:var(--ic);padding-bottom:26px}
.cover .runhead{border-color:var(--ink)}
.cv-frame{margin-top:22px;background:#fff;border:2px solid var(--ink);aspect-ratio:10/7;overflow:hidden}
.cv-frame svg{display:block;width:100%;height:100%}
.cv-cap{font-size:10px;text-align:right;margin-top:4px;letter-spacing:.06em}
.cv-k{margin-top:18px;font-weight:700;font-size:13px;letter-spacing:.2em}
.cv-t{display:flex;align-items:center;flex-wrap:wrap;gap:10px 14px;margin:4px 0 0}
.cv-t h1{margin:0;font-weight:900;font-size:clamp(40px,12.4vw,64px);line-height:1.15;letter-spacing:.14em}
.cv-t .pill{font-size:clamp(18px,5vw,24px);letter-spacing:.06em;font-family:var(--f-en);font-weight:800}
.lede{margin:18px 0 0;font-weight:500;font-size:14.5px;line-height:1.95}
.mk{display:grid;grid-template-columns:1fr 1fr;margin-top:22px;border-top:1.5px solid var(--ink);border-left:1.5px solid var(--ink);background:#fff}
.mk>div{min-width:0;padding:10px 12px 12px;border-right:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink)}
.mk .l{font-size:11px;font-weight:700;line-height:1.4}
.mk .v{font:900 25px/1.2 var(--f-en);letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
.mk .c{font-size:11px;line-height:1.4;font-variant-numeric:tabular-nums}
.mk .c.up{color:var(--up)} .mk .c.down{color:var(--down)}

/* listen */
.lsn{margin-top:36px}
.lsn .box{display:flex;align-items:center;gap:14px;border:2px solid var(--ink);padding:12px 12px 12px 18px;position:relative;background:#fff}
.lsn .box::after{content:"";position:absolute;inset:6px -6px -6px 6px;background:var(--ic);z-index:-1;border:2px solid var(--ink)}
.lsn .lt{flex:1;min-width:0;line-height:1.5}
.lsn .lt b{display:block;font-size:15px;font-weight:900}
.lsn .lt span{font-size:12px;color:var(--sub)}
.go{flex:none;display:flex;align-items:center;gap:8px;background:var(--ink);color:#fff;border:0;border-radius:999px;padding:13px 20px;font:700 14px/1 var(--f-jp);letter-spacing:.1em;cursor:pointer}
.go svg{width:12px;height:12px}

/* contents */
.toc{margin-top:64px}
.toc .hd{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:10px}
.toc h2{margin:0;font:900 34px/1 var(--f-en);letter-spacing:-.02em}
.toc ol{list-style:none;margin:0;padding:0}
.toc li a{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;padding:16px 0;border-bottom:1px solid var(--rule);text-decoration:none}
.toc .no{font:900 30px/1 var(--f-en);color:transparent;-webkit-text-stroke:1.5px var(--ink);min-width:48px}
.toc .nm{font-weight:900;font-size:17px;line-height:1.4}
.toc .nm small{display:block;font:700 11px/1.6 var(--f-en);letter-spacing:.12em;text-transform:uppercase;color:var(--sub)}
.toc .ct{font-size:12px;font-weight:700}
.favbtn{margin-top:16px;background:#fff;border:1.5px solid var(--ink);border-radius:999px;padding:8px 16px;font:700 13px/1 var(--f-jp);cursor:pointer}
.favbtn[aria-pressed=true]{background:var(--ink);color:#fff}

/* sticky nav */
.navslot{margin-top:64px;min-height:47px}
.nav{z-index:20;background:#fff;border-bottom:1.5px solid var(--ink)}
.nav.fix{position:fixed;top:0;left:0;right:0;padding-top:var(--sat)}
.nav .in{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-block:9px}
.nav .in::-webkit-scrollbar{display:none}
.nav a{flex:none;text-decoration:none;font:700 12px/1 var(--f-jp);letter-spacing:.06em;padding:8px 12px 7px;border:1.5px solid var(--ink);border-radius:999px}
.nav a.on{background:var(--ic)}
.prog{height:3px;background:var(--ic);width:0;transition:width .15s linear;margin-bottom:-1.5px}

/* ---------- common article parts ---------- */
.ch{padding-top:72px}
.sechead{display:flex;justify-content:flex-end;align-items:stretch;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);padding:10px 0;gap:0}
.sechead .lede2{flex:1;font-size:12px;font-weight:700;line-height:1.7;padding-right:10px}
.sechead .t{display:flex;align-items:flex-start}
.sechead .t span{font:700 12px/1 var(--f-jp);padding:6px 8px 5px;border:1px solid var(--ink)}
.sechead .t span:first-child{background:var(--ic)}
.sechead .t span+span{border-left:0;font-weight:500}
.art{padding-top:48px}
.art h3{margin:10px 0 0;font-weight:900;font-size:clamp(21px,5.8vw,25px);line-height:1.55;letter-spacing:.02em}
.art p{margin:16px 0 0;font-size:15.5px;line-height:2.05}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grp{font-size:12px;font-weight:700;letter-spacing:.08em}
.grp::before{content:"#";color:var(--sub);margin-right:2px}
.tag{display:inline-block;font:800 10px/1 var(--f-en);letter-spacing:.12em;padding:5px 8px 4px;border-radius:99px;vertical-align:4px;margin-left:8px;white-space:nowrap}
.tag.fav{background:var(--ic);border:1.5px solid var(--ink);color:var(--ink)}
.tag.barca{background:#A50044;color:#fff}
.srcs{margin-top:16px;font-size:11.5px;line-height:1.9;color:var(--sub)}
.srcs b{font:800 10px/1 var(--f-en);letter-spacing:.14em;border:1px solid var(--sub);padding:3px 5px 2px;margin-right:8px}
.srcs a{margin-right:10px;text-underline-offset:3px}
.speaking{position:relative}
.speaking::after{content:"♪ NOW READING";position:absolute;right:max(22px,env(safe-area-inset-right,0px));top:20px;font:800 10px/1 var(--f-en);letter-spacing:.12em;background:var(--ic);border:1.5px solid var(--ink);padding:5px 8px 4px}

/* figures */
.fig{margin:28px 0 0;border:1.5px solid var(--ink);padding:16px 16px 14px;background:#fff}
.fig .fl{display:inline-block;transform:translateY(-27px);margin-bottom:-22px;background:var(--ink);color:#fff;font:800 10px/1 var(--f-en);letter-spacing:.14em;padding:5px 8px 4px}
.fig .ft{font-weight:900;font-size:15px;line-height:1.6}
.fig .fn{font-size:11px;color:var(--sub);margin-top:12px;line-height:1.7}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;margin-top:12px}
.stats>div{background:var(--ic-t);padding:12px 12px 11px;min-width:0}
.stats .sv{font:800 32px/1.1 var(--f-en);letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
.stats .sv.up{color:var(--up)} .stats .sv.down{color:var(--down)}
.stats .sl{font-size:11.5px;line-height:1.6;margin-top:6px;font-weight:500}
.bars{margin-top:12px;display:grid;gap:9px}
.bar{display:grid;grid-template-columns:6.5em minmax(0,1fr);align-items:center;gap:10px;font-size:12.5px;line-height:1.4;font-weight:500}
.bar .track{display:flex;align-items:center;gap:8px;min-width:0}
.bar .fill{height:14px;background:#fff;border:1.5px solid var(--ink);flex:none}
.bar.hi .fill{background:var(--ic)}
.bar .bv{font:800 12.5px/1 var(--f-en);white-space:nowrap}
.tl{list-style:none;margin:12px 0 0;padding:0 0 0 14px;border-left:2px dotted var(--ink)}
.tl li{position:relative;padding:6px 0 10px;font-size:13.5px;line-height:1.7}
.tl li::before{content:"";position:absolute;left:-21px;top:12px;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--ink)}
.tl li.hi::before{background:var(--ic)}
.tl .td{display:block;font:800 12px/1.6 var(--f-en)}
.tl li.hi .tx{font-weight:700}

/* two views */
.vw{margin-top:30px;position:relative;border:1.5px solid var(--ink);padding:24px 16px 16px;background:var(--ic-tt)}
.vw .lb{position:absolute;top:-14px;left:12px;transform:rotate(-3deg)}
.vw .vq{font-weight:900;font-size:16px;line-height:1.7}
.vc{margin-top:14px;background:#fff;border:1px solid var(--ink);padding:12px 14px}
.vc .vs{font-weight:900;font-size:13.5px;display:flex;gap:8px;align-items:center}
.vc .vs::before{content:"A";font:900 11px/18px var(--f-en);width:20px;height:20px;text-align:center;border-radius:50%;background:var(--ink);color:#fff;flex:none}
.vc.v1 .vs::before{content:"B";background:var(--ic);color:var(--ink);border:1.5px solid var(--ink);line-height:16px}
.vc .vp{margin:8px 0 0;font-size:13.5px;line-height:1.9}
.vc .vwho{margin-top:8px;font-size:11.5px;font-weight:700;line-height:1.6}
.vc .va{display:inline-block;font-size:11px;color:var(--sub);text-underline-offset:3px}

/* ---------- STYLE: label (WELL-MADE風) ---------- */
.s-label .opn{position:relative;margin-top:30px}
.s-label .tilt{transform:rotate(-4deg);display:inline-block;font:800 18px/1 var(--f-en);letter-spacing:.04em;padding:10px 16px 9px;position:relative;z-index:2;margin-left:-4px}
.s-label .box{background:var(--ic);border:2px solid var(--ink);padding:26px 20px 18px;margin-top:-12px}
.s-label .box h2{overflow:hidden;margin:0;font:900 clamp(40px,12.5vw,60px)/.98 var(--f-en);letter-spacing:-.02em;text-transform:uppercase}
.s-label .box .jp{margin-top:14px;font-weight:700;font-size:13px}
.s-label .cred{border:5px solid var(--ink);padding:10px 14px;margin-top:10px;font:700 12px/1.8 var(--f-en);letter-spacing:.02em}
.s-label .ill{margin-top:22px;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);aspect-ratio:10/6;overflow:hidden;background:var(--ic-tt)}
.s-label .ill svg{display:block;width:100%;height:100%}
.s-label .art.lead p:first-of-type::first-letter{float:left;font-weight:200;font-size:4.3em;line-height:.95;margin:8px 12px 0 -2px;padding:0 2px;background:linear-gradient(transparent 68%,var(--ic) 68%)}
.s-label .art h3{border-bottom:1px solid var(--ink);padding-bottom:10px}
.s-label .art:not(.lead) h3{font-size:19px;border:0;padding:0}
.s-label .art:not(.lead){border-left:3px solid var(--ink);padding-left:14px;margin-left:var(--gut);padding-top:0;margin-top:44px}
@media (min-width:704px){.s-label .art:not(.lead){margin-left:auto;margin-right:auto;max-width:616px}}

/* ---------- STYLE: map（相関図） ---------- */
.s-map .opn h2{margin:22px 0 0;font-weight:900;font-size:clamp(30px,9vw,42px);line-height:1.3;letter-spacing:.06em}
.s-map .opn .sub{font-weight:700;font-size:13px;margin-top:8px}
.map{position:relative;margin-top:22px;background-color:var(--ic-t);background-image:radial-gradient(color-mix(in srgb,var(--ink) 22%,transparent) .8px,transparent 1px);background-size:5px 5px;border:1px solid var(--ink);padding:26px 14px 30px}
.map svg.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.map .node{position:relative;display:block;width:78%;text-decoration:none;margin-top:30px}
.map .node:first-of-type{margin-top:0}
.map .node.r{margin-left:auto}
.map .node .chip{position:relative;z-index:1}
.map .node .nb{display:block;background:#fff;border:1.5px solid var(--ink);padding:10px 12px 10px;margin-top:-3px;font-weight:900;font-size:14.5px;line-height:1.55}
.map .node .nb small{display:block;font-weight:500;font-size:11px;line-height:1.6;color:var(--sub);margin-top:4px}
.map .key{position:absolute;right:12px;bottom:-14px}
.s-map .art .no{display:inline-grid;place-items:center;width:30px;height:30px;background:var(--ink);color:#fff;font:900 13px/1 var(--f-en)}

/* ---------- STYLE: outline（白抜き英字） ---------- */
.s-outline .opn .big{display:flex;align-items:center;gap:10px;margin-top:26px}
.s-outline .opn .big h2{overflow:hidden;min-width:0;padding:0 2px 4px;margin:0;font:900 clamp(54px,17vw,92px)/1 var(--f-en);letter-spacing:-.01em;color:transparent;-webkit-text-stroke:1.5px var(--ink);flex:0 1 auto}
.s-outline .opn .big i{flex:1 0 24px;height:1px;background:var(--ink)}
.s-outline .opn .bp{margin-top:12px;background:var(--ic-t);border:1px solid var(--ink);padding:10px 14px;font-weight:900;font-size:15px;text-align:center}
.s-outline .ill{margin-top:22px;aspect-ratio:10/6;overflow:hidden;background:var(--ic-tt);border:1px solid var(--ink)}
.s-outline .ill svg{display:block;width:100%;height:100%}
.s-outline .art .num{display:flex;align-items:center;gap:10px}
.s-outline .art .num b{font:900 52px/1 var(--f-en);color:transparent;-webkit-text-stroke:1.2px var(--ink);flex:none}
.s-outline .art .num i{flex:1;height:1px;background:var(--ink)}
.s-outline .art h3{background:var(--ic-t);border:1px solid var(--ink);padding:10px 14px;font-size:18px;margin-top:10px}
.s-outline .art.lead h3{font-size:22px}

/* ---------- STYLE: cards（グリッド） ---------- */
.s-cards .opn .hl{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:22px;flex-wrap:wrap}
.s-cards .opn h2{margin:0;font-weight:900;font-size:clamp(28px,8.4vw,40px);line-height:1.35;letter-spacing:.04em}
.s-cards .opn h2 em{font-style:normal;background:linear-gradient(transparent 58%,var(--ic) 58%)}
.s-cards .grid{display:grid;grid-template-columns:1fr;gap:0;margin-top:22px;border-top:1px solid var(--ink)}
.s-cards .art{min-width:0;padding:22px 0 26px;border-bottom:1px solid var(--ink)}
.s-cards .art .th{display:grid;grid-template-columns:38% minmax(0,1fr);gap:14px;align-items:start}
.s-cards .art .th .pic{border:1px solid var(--ink);aspect-ratio:4/3;overflow:hidden;background:var(--ic-tt)}
.s-cards .art .th .pic svg{display:block;width:100%;height:100%}
.s-cards .art h3{overflow-wrap:anywhere;margin:0;font-size:16.5px;line-height:1.6}
.s-cards .art.lead h3{font-size:21px}
.s-cards .art .th .meta{margin-top:6px}
.s-cards .art p{font-size:14px;line-height:1.95;margin-top:12px}
.s-cards .art.lead p{font-size:15.5px}

/* ---------- 特集 ---------- */
.ftr{margin-top:72px}
.ftr .hero{background:var(--ic);border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);padding:22px 0 30px;position:relative;overflow:hidden}
.ftr .hero .bg{position:absolute;right:-12px;bottom:-34px;font:900 clamp(120px,40vw,220px)/1 var(--f-en);letter-spacing:-.04em;color:transparent;-webkit-text-stroke:1.5px color-mix(in srgb,var(--ink) 28%,transparent);pointer-events:none;white-space:nowrap}
.ftr .hero .in{position:relative}
.ftr .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ftr .kick{font-weight:700;font-size:13px;line-height:1.8;margin-top:18px}
.ftr h2{margin:6px 0 0;font-weight:900;font-size:clamp(28px,8.2vw,44px);line-height:1.4;letter-spacing:.03em;word-break:auto-phrase}
.ftr .ld{margin:16px 0 0;font-size:15px;font-weight:500;line-height:2}
.ftr .facts{margin:28px 0 0;border:1.5px solid var(--ink)}
.ftr .facts>div{display:grid;grid-template-columns:6.5em minmax(0,1fr);border-top:1px solid var(--ink);font-size:13px;line-height:1.7}
.ftr .facts>div:first-child{border-top:0}
.ftr .facts dt{background:var(--ic-t);padding:8px 10px;font-weight:700;border-right:1px solid var(--ink)}
.ftr .facts dd{margin:0;padding:8px 12px;overflow-wrap:anywhere}
.ftr .pts{margin:30px 0 0;border:1.5px solid var(--ink);padding:22px 16px 10px;position:relative;background:var(--ic-tt)}
.ftr .pts .lb{position:absolute;top:-14px;left:12px;transform:rotate(-3deg)}
.ftr .pts ol{list-style:none;margin:0;padding:0;counter-reset:p}
.ftr .pts li{counter-increment:p;display:grid;grid-template-columns:34px minmax(0,1fr);gap:8px;padding:8px 0;border-top:1px dotted var(--ink);font-weight:700;font-size:14.5px;line-height:1.8}
.ftr .pts li:first-child{border-top:0}
.ftr .pts li::before{content:counter(p);font:900 26px/1.2 var(--f-en);color:transparent;-webkit-text-stroke:1.2px var(--ink)}
.ftr .blk{margin-top:44px}
.ftr .blk .n{display:flex;align-items:center;gap:10px;font:800 12px/1 var(--f-en);letter-spacing:.14em}
.ftr .blk .n i{flex:1;height:1px;background:var(--ink)}
.ftr .blk h3{margin:10px 0 0;font-weight:900;font-size:clamp(20px,5.6vw,24px);line-height:1.6;word-break:auto-phrase}
.ftr .blk h3 span{background:linear-gradient(transparent 62%,var(--ic) 62%)}
.ftr .blk p{margin:12px 0 0;font-size:15.5px;line-height:2.05}
.ftr .qt{margin:40px 0 0;border-left:6px solid var(--ic);padding:4px 0 4px 16px}
.ftr .qt p{margin:0;font-weight:200;font-size:clamp(20px,5.6vw,26px);line-height:1.75}
.ftr .qt cite{display:block;font-style:normal;font-size:12px;font-weight:700;margin-top:8px}
.ftr .its{margin:36px 0 0;border-top:2px solid var(--ink)}
.ftr .it{display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;padding:14px 0;border-bottom:1px solid var(--ink)}
.ftr .it .ix{font:900 22px/1.3 var(--f-en);color:transparent;-webkit-text-stroke:1.2px var(--ink)}
.ftr .it b{display:block;font-size:15px;line-height:1.6}
.ftr .it .br{font:800 11px/1.6 var(--f-en);letter-spacing:.1em;text-transform:uppercase}
.ftr .it .pr{font:800 13px/1.6 var(--f-en);margin-left:8px}
.ftr .it p{margin:4px 0 0;font-size:13.5px;line-height:1.9}
.ftr .it a{font-size:12px;text-underline-offset:3px}

.pl-ctl .pp{background:var(--ic);width:52px;height:52px}
.pl-ctl .pp svg{width:16px;height:16px}
.pl-ctl .rate{padding:0 12px}
.pl-ctl .sp{flex:1}
.pl-ctl .x{padding:0 14px;font-family:var(--f-jp)}

#tmbox .d{margin-top:6px;font-size:14.5px;line-height:1.85;overflow-wrap:anywhere}

#tmbox .go,#selask{display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:#fff;text-decoration:none;font-weight:700;font-size:14px;line-height:1;padding:11px 14px 10px}

#selask b{max-width:11em;overflow:hidden;text-overflow:ellipsis;font-weight:700}

    tmClose();selask.hidden=false;},350);});
  var links=[].slice.call(nav.querySelectorAll('a')),prog=document.getElementById('prog');
  /* ジャンルのタブ：sticky はホーム画面アプリで効かないことがあるので、通り過ぎたら fixed に切り替える */
  var slot=document.getElementById('navslot'),bar=slot.firstElementChild,rt=document.documentElement;
  (function(){var pb=document.createElement('div');pb.style.cssText='position:fixed;top:0;left:0;width:0;height:env(safe-area-inset-top,0px);visibility:hidden';document.body.appendChild(pb);var sa=pb.offsetHeight;pb.remove();
    var alone=window.navigator.standalone===true||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches);
    if(alone&&!sa&&window.innerHeight>=screen.height-1)rt.style.setProperty('--sat','54px');})();
  function sat(){return parseFloat(getComputedStyle(document.body).paddingTop)||0;}
  function onScroll(){
    var fx=slot.getBoundingClientRect().top<=sat();
    if(fx!==bar.classList.contains('fix')){if(fx)slot.style.height=slot.offsetHeight+'px';bar.classList.toggle('fix',fx);if(!fx)slot.style.height='';}
    var y=window.scrollY+90,cur=null;
    document.querySelectorAll('.ch').forEach(function(ch){if(!ch.hidden&&ch.offsetTop<=y)cur=ch.id;});
    links.forEach(function(a){var on=a.getAttribute('href')==='#'+cur;if(on&&!a.classList.contains('on'))a.scrollIntoView({inline:'center',block:'nearest'});a.classList.toggle('on',on);});
    var h=document.documentElement.scrollHeight-window.innerHeight;prog.style.width=(h>0?Math.min(100,window.scrollY/h*100):0)+'%';
  }
  window.addEventListener('scroll',onScroll,{passive:true});onScroll();
})();
</script>

<style>
/* Layout: a one-screen lecture player (copied from news/tools). Genre-colored stage, big Mincho telop, caption strip, transport at the bottom. Deliberately single dark theme (it is a video). */
:root{
  --night:#0C1016; --deep:#06080B; --ink:#F2F4F7; --sub:#9AA6B4; --rule:#2A323D; --chip:#161C24;
  --sun:#C9461C; --c:#C9461C;
  --pol:#5B7FD0; --foot:#2FA877; --art:#D2508D; --film:#D39A33; --barca:#E85A90;
  --v0:#EE9B72; --v1:#7DBCDB;
  --f-mincho:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--deep);color:var(--ink);font-family:var(--f-body);-webkit-text-size-adjust:100%;word-break:auto-phrase;overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sun);outline-offset:3px;border-radius:6px}

.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;max-width:560px;margin:0 auto;background:var(--night);position:relative;overflow:hidden}

/* top: date + chapter progress */
.top{padding-block:12px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:9px;position:relative;z-index:2}
.trow{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;color:var(--sub);text-transform:uppercase}
.segs{display:flex;gap:3px;height:3px}
.segs i{flex:1 1 0;background:var(--rule);border-radius:2px;overflow:hidden;position:relative;cursor:pointer}
.segs i b{position:absolute;inset:0 auto 0 0;width:0;background:var(--ink)}
.segs i.done b{width:100%;background:var(--sub)}

/* stage */
.stage{position:relative;min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:4px 0}
.glow{position:absolute;inset:-20% -30% auto auto;width:120%;aspect-ratio:1;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--c) 38%,transparent),transparent 70%);pointer-events:none;transition:background .8s}
.vis{position:relative;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.illo{width:min(72%,300px);height:auto;color:var(--c);animation:kb 18s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1) translate(0,0)}to{transform:scale(1.12) translate(-3%,2%)}}
.photo{position:absolute;inset:0;background-size:cover;background-position:center;border-radius:12px;animation:kb 20s ease-in-out infinite alternate;opacity:.9}
.telop{position:relative;display:grid;gap:8px;padding-block:6px 14px}
.eb{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-family:var(--f-mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--c)}
.eb .sw{width:9px;height:9px;border-radius:50%;background:var(--c)}
.tag{font:500 10px/1 var(--f-mono);letter-spacing:.06em;padding:4px 6px 3px;border-radius:3px;color:var(--night);text-transform:none}
.tag.fav{background:var(--sun);color:#fff}.tag.barca{background:var(--barca);color:#fff}
.ttl{font-family:var(--f-mincho);font-weight:800;font-size:clamp(23px,6.6vw,31px);line-height:1.45;margin:0;text-wrap:balance}
.in .ttl,.in .eb{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
.in .eb{animation-delay:.05s}
@keyframes rise{from{opacity:.001;transform:translateY(14px)}to{opacity:1;transform:none}}

/* figures */
.fig{width:100%;align-self:center;background:color-mix(in srgb,var(--chip) 88%,transparent);border:1px solid var(--rule);border-radius:12px;padding:16px 16px 12px;position:relative}
.fl{font-family:var(--f-mono);font-size:10px;letter-spacing:.16em;color:var(--c);text-transform:uppercase}
.ft{font-weight:700;font-size:15px;line-height:1.5;margin-top:2px}
.fn{font-size:11px;color:var(--sub);margin-top:10px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:14px;margin-top:12px}
.sv{font-family:var(--f-mincho);font-weight:800;font-size:clamp(30px,9vw,42px);line-height:1.1;font-variant-numeric:tabular-nums}
.sv.up{color:#FF8A7E}.sv.down{color:#8DB9F2}
.sl{font-size:12.5px;color:var(--sub);line-height:1.5;margin-top:4px}
.bars{display:grid;gap:9px;margin-top:12px}
.bar{display:grid;grid-template-columns:minmax(0,7.5em) minmax(0,1fr);gap:10px;align-items:center;font-size:12.5px}
.bar .bl{color:var(--sub);line-height:1.35}
.bar .tr{display:flex;align-items:center;gap:8px;min-width:0}
.bar .fi{height:14px;border-radius:0 3px 3px 0;background:#3A4451;flex:none;min-width:2px;transform-origin:left;animation:grow .9s cubic-bezier(.2,.7,.2,1) both}
.bar.hi .fi{background:var(--c)}.bar.hi .bl{color:var(--ink);font-weight:700}
.bar .bv{font-family:var(--f-mono);font-size:12px;white-space:nowrap}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}
.tl{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:4px}
.tl li{display:grid;grid-template-columns:4.2em minmax(0,1fr);gap:10px;font-size:14px;line-height:1.5}
.tl .td{font-family:var(--f-mono);font-size:12.5px;color:var(--c)}
.tl li.hi .tx{font-weight:700}
.mk{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:12px;overflow:hidden;width:100%;align-self:center}
.mk>div{background:var(--night);padding:12px 14px}
.mk .l{font-size:11px;color:var(--sub)}
.mk .v{font-family:var(--f-mono);font-size:20px;font-weight:500;font-variant-numeric:tabular-nums}
.mk .ch{font-family:var(--f-mono);font-size:11.5px;color:var(--sub)}
.mk .up{color:#FF8A7E}.mk .down{color:#8DB9F2}
.big{font-family:var(--f-mincho);font-weight:800;font-size:clamp(84px,26vw,132px);line-height:.9;letter-spacing:-.03em}
.big .dot{color:var(--sun)}
.hero{display:grid;gap:18px;width:100%;align-self:center}
/* debate */
.dv{display:grid;gap:10px;width:100%;align-self:center}
.dq{font-weight:700;font-size:14.5px;line-height:1.5}
.vc{border-radius:12px;padding:12px 14px;border:1px solid var(--rule);border-top:3px solid var(--va);background:var(--chip);opacity:.55;transition:opacity .4s,transform .4s}
.vc.on{opacity:1;transform:scale(1.015)}
.vc.v0{--va:var(--v0)}.vc.v1{--va:var(--v1)}
.vs{font-weight:700;font-size:13px;color:var(--va)}
.vw{font-size:12px;color:var(--sub);margin-top:4px;line-height:1.5}

/* caption */
.cap{min-height:5.6em;display:flex;align-items:flex-end;padding-block:0 12px}
.cap p{margin:0;background:rgba(0,0,0,.55);border-left:3px solid var(--c);padding:9px 12px;border-radius:4px;font-size:15.5px;line-height:1.7;font-weight:500;width:100%}

/* transport */
.ctl{padding-block:10px 14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-top:1px solid var(--rule);background:var(--deep);display:grid;gap:10px}
.time{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:11px;color:var(--sub);font-variant-numeric:tabular-nums}
.scrub{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:transparent;margin:0}
.scrub::-webkit-slider-runnable-track{height:3px;background:linear-gradient(to right,var(--sun) var(--p,0%),var(--rule) var(--p,0%));border-radius:2px}
.scrub::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--ink);margin-top:-5.5px}
.scrub::-moz-range-track{height:3px;background:var(--rule)}.scrub::-moz-range-progress{height:3px;background:var(--sun)}
.btns{display:flex;align-items:center;justify-content:space-between;gap:8px}
.btns button{display:grid;place-items:center;background:none;border:1px solid var(--rule);border-radius:999px;width:44px;height:44px;cursor:pointer;flex:none}
.btns svg{width:17px;height:17px}
.btns .pp{width:60px;height:60px;background:var(--sun);border-color:var(--sun);color:#fff}
.btns .pp svg{width:22px;height:22px}
.btns .txt{width:auto;min-width:44px;padding:0 12px;font:500 12px/1 var(--f-mono)}

/* start cover */
.cover{position:absolute;inset:0;z-index:5;background:var(--night);display:grid;align-content:center;gap:18px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));overflow:hidden}
.cover .sunbg{position:absolute;right:-90px;top:-70px;width:340px;height:340px;color:var(--sun);opacity:.85}
.cover .lab{font-family:var(--f-mono);font-size:11px;letter-spacing:.2em;color:var(--sub);text-transform:uppercase;position:relative}
.cover .head{font-family:var(--f-mincho);font-weight:800;font-size:clamp(19px,5.4vw,24px);line-height:1.6;position:relative}
.cover .go{justify-self:start;display:flex;align-items:center;gap:10px;background:var(--sun);color:#fff;border:0;border-radius:999px;padding:15px 24px;font:700 16px/1 var(--f-body);cursor:pointer;position:relative}
.cover .go svg{width:16px;height:16px}
.cover .meta{font-size:12.5px;color:var(--sub);line-height:1.7;position:relative}

/* chapter list */
.sheet{position:absolute;inset:0;z-index:6;background:rgba(6,8,11,.97);display:grid;grid-template-rows:auto minmax(0,1fr)}
.sheet .sh{display:flex;justify-content:space-between;align-items:center;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--rule);font-weight:700}
.sheet .sh button{background:none;border:1px solid var(--rule);border-radius:999px;padding:7px 14px;cursor:pointer;font-size:12px}
.sheet ol{list-style:none;margin:0;padding:6px 0 30px;overflow-y:auto}
.sheet li button{width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);display:grid;grid-template-columns:3.6em minmax(0,1fr);gap:10px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));cursor:pointer}
.sheet .st{font-family:var(--f-mono);font-size:11.5px;color:var(--c);padding-top:3px;font-variant-numeric:tabular-nums}
.sheet .sn{font-size:14.5px;line-height:1.5}
.sheet .sg{display:block;font-size:11px;color:var(--c);letter-spacing:.1em}
.sheet li.cur .sn{font-weight:700}
.sheet li.cur button{background:var(--chip)}

@media (prefers-reduced-motion:reduce){.illo,.photo,.in .ttl,.in .eb,.bar .fi{animation:none}.vc{transition:none}}
@media (min-height:760px){.ttl{font-size:clamp(25px,7vw,34px)}.cap p{font-size:16.5px}}
</style>

  function el(t,a,kids){var e=document.createElement(t);if(a)for(var k in a){if(k==='text')e.textContent=a[k];else if(k==='html')e.innerHTML=a[k];else e.setAttribute(k,a[k]);}(kids||[]).forEach(function(x){if(x)e.appendChild(typeof x==='string'?document.createTextNode(x):x)});return e;}
  function fmt(s){s=Math.max(0,Math.floor(s||0));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
  var au=document.getElementById('au'), app=document.getElementById('app');

  function markets(){var m=el('div',{class:'mk'});(V.markets||[]).slice(0,4).forEach(function(x){m.appendChild(el('div',null,[el('div',{class:'l',text:x.label}),el('div',{class:'v',text:x.value}),el('div',{class:'ch '+x.dir,text:(x.dir==='up'?'▲ ':x.dir==='down'?'▼ ':'')+x.change})]))});return m;}
  // which sentence starts the debate, and each side
  CH.forEach(function(c){c.dbAt=-1;c.sideAt=[];if(!c.debate)return;
    c.sents.forEach(function(s,k){if(c.dbAt<0&&/^論点です/.test(s.x))c.dbAt=k;});

  var curC=-1,curS=-1,mode='';
  var vis=document.getElementById('vis'),telop=document.getElementById('telop'),cap=document.getElementById('cap'),stage=document.getElementById('stage');
  function visual(c,i,k){
    var m=(c.debate&&c.dbAt>=0&&k>=c.dbAt)?'debate':'main';
    if(m===mode&&i===curC)return;mode=m;vis.innerHTML='';
    if(m==='debate'){var dv=el('div',{class:'dv'},[el('div',{class:'fl',text:'Two Views'}),el('div',{class:'dq',text:c.debate.q||''})]);
      c.debate.views.slice(0,2).forEach(function(v,j){dv.appendChild(el('div',{class:'vc v'+j,'data-j':j},[el('div',{class:'vs',text:v.side}),el('div',{class:'vw',text:v.who||''})]))});vis.appendChild(dv);return;}
    if(i===0){vis.appendChild(el('div',{class:'hero'},[el('div',{class:'big',html:(d.getMonth()+1)+'<span class="dot">.</span>'+String(d.getDate()).padStart(2,'0')}),markets()]));return;}
    if(c.img){vis.appendChild(el('div',{class:'photo',style:'background-image:url('+c.img+')'}));}
    var f=fig(c.viz);if(f){vis.appendChild(f);return;}
    if(!c.img){var il=illo(c,i);if(il)vis.appendChild(il);}
  }
  function fit(){var f=vis.firstElementChild;if(!f||f.tagName==='svg'||f.classList.contains('photo'))return;f.style.transform='';f.style.transformOrigin='center';
    var h=vis.clientHeight,fh=f.scrollHeight;if(fh>h&&h>0){var s=Math.max(.55,h/fh);f.style.transform='scale('+s.toFixed(3)+')';}}
  window.addEventListener('resize',fit);
  function render(i,k){
    var c=CH[i];if(!c)return;
    if(i!==curC){
      app.style.setProperty('--c',COL[c.sec]||'var(--sun)');
      telop.innerHTML='';
      var eb=el('div',{class:'eb'},[el('span',{class:'sw'}),EN[c.sec]||'',c.group?' · '+c.group:'']);
      if(c.fav)eb.appendChild(el('span',{class:'tag fav',text:'★好み'}));if(c.barca)eb.appendChild(el('span',{class:'tag barca',text:'BARÇA'}));
      telop.appendChild(eb);telop.appendChild(el('h1',{class:'ttl',text:i===0?V.headline.split('。')[0]+'。':c.title}));
      stage.classList.remove('in');void stage.offsetWidth;stage.classList.add('in');
      document.getElementById('t-pos').textContent=(i+1)+' / '+CH.length;
      [].forEach.call(segs.children,function(s,j){s.classList.toggle('done',j<i);if(j!==i)s.firstChild.style.width='';});
      [].forEach.call(list.children,function(li,j){li.classList.toggle('cur',j===i)});
      meta(i);
    }
    var pm=mode,pc=curC;visual(c,i,k);if(mode!==pm||i!==pc)fit();
    if(mode==='debate'){vis.querySelectorAll('.vc').forEach(function(v){var j=+v.dataset.j;var a=c.sideAt[j],b=j===0?c.sideAt[1]:9999;v.classList.toggle('on',a>=0&&k>=a&&(b<0||k<b));});}
    curC=i;
    if(k!==curS){curS=k;cap.textContent=k>=0?c.sents[k].x:'';}
  }
  function locate(t){var i=0;while(i<CH.length-1&&t>=CH[i+1].start)i++;var c=CH[i],k=-1;for(var j=0;j<c.sents.length;j++){if(t>=c.sents[j].t-0.05)k=j;else break;}return [i,k];}
  var scrub=document.getElementById('scrub'),curEl=document.getElementById('cur'),dragging=false,lastSave=0;
  function tick(){
    var t=au.currentTime||0,p=locate(t);render(p[0],p[1]);
    var c=CH[p[0]];segs.children[p[0]].firstChild.style.width=Math.min(100,(t-c.start)/(c.end-c.start)*100)+'%';

    scrub.style.setProperty('--p',(t/V.duration*100)+'%');curEl.textContent=fmt(t);

  }

  var I_PLAY='<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9-5.5z" fill="currentColor"/></svg>',I_PAUSE='<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 2.5h3v11h-3zM9.5 2.5h3v11h-3z" fill="currentColor"/></svg>';

  var RATES=[1,1.2,1.4,1.6,0.9],ri=0;try{var r=+localStorage.getItem('nv-rate');if(RATES.indexOf(r)>=0)ri=RATES.indexOf(r);}catch(e){}
